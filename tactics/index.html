<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="永生戰棋">
<title>語嫣・永生戰棋（原型）</title>
<style>
:root{--bg:#120e0b;--panel:#1d1712;--line:#3a2e24;--ink:#e9dcc4;--dim:#a8977c;--gold:#d8b56a;--blue:#6f9fd8;--red:#d86a5f;--warn:#b48cff;--ok:#8fc77a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
body{padding:calc(8px + env(safe-area-inset-top)) 8px calc(150px + env(safe-area-inset-bottom));max-width:540px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
h1{font-size:16px;line-height:1.3;margin:0;color:var(--gold);letter-spacing:1px;flex:1 1 100%}
.chip{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.gatebar{flex:1;min-width:110px;height:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#2a1d17}
.gatebar i{display:block;height:100%;background:linear-gradient(90deg,#a2543e,#d8b56a)}
#board{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:#0a0807;border:1px solid var(--line);border-radius:6px;padding:1px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;overflow:hidden}
.c .tg{position:absolute;left:2px;top:1px;font-size:9px;color:#0008;font-weight:700;pointer-events:none}
.PLAIN{background:#5b5140}.FOREST{background:#34452e}.HILL{background:#7a6748}.SWAMP{background:#3d4636}.WALL{background:#2b2a2a}.SHALLOW_WATER{background:#33505a}.DEEP_WATER{background:#1b2d38}.FLESH{background:#6b2f2f}.GATE{background:#4a3221}
.FOREST{background-image:radial-gradient(circle at 30% 40%,#2a3a25 18%,transparent 19%),radial-gradient(circle at 70% 65%,#2a3a25 18%,transparent 19%)}
.HILL{background-image:linear-gradient(135deg,transparent 45%,#8a7655 46%,#8a7655 54%,transparent 55%)}
.WALL{background-image:repeating-linear-gradient(0deg,#3a3837 0 3px,#2b2a2a 3px 8px)}
.FLESH{background-image:radial-gradient(circle at 40% 50%,#8a3c38 20%,transparent 22%)}
.SHALLOW_WATER,.DEEP_WATER{background-image:repeating-linear-gradient(160deg,transparent 0 6px,#ffffff10 6px 8px)}
.c.zone{box-shadow:inset 0 0 0 100px #e8c56a26,inset 0 0 0 1px #e8c56a88}
.c.reach::after{content:"";position:absolute;inset:0;background:#6f9fd855;border:1px solid #6f9fd8aa}
.c.dash::after{background:#9f7fd855;border-color:#b48cff}
.c.threat::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#d86a5f40 0 3px,transparent 3px 7px);pointer-events:none}
.c.tgt{outline:2px solid var(--red);outline-offset:-2px}
.c.ally{outline:2px solid var(--ok);outline-offset:-2px}
.c.zsel{outline:2px dashed var(--gold);outline-offset:-2px}
.c.zprev{box-shadow:inset 0 0 0 100px #e8c56a55}
.c.tgtsel{outline:3px solid #fff;outline-offset:-3px}
.c.warn{box-shadow:inset 0 0 0 2px var(--warn)}
.c.warn .wv{position:absolute;right:1px;bottom:0;font-size:10px;color:var(--warn)}
.c.dest{box-shadow:inset 0 0 0 2px #fff}
.u{position:relative;z-index:2;width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.4vw,17px);font-weight:700;border:2px solid #0008;box-shadow:0 1px 3px #000a}
.u.P{background:radial-gradient(circle at 35% 30%,#a9c6ea,#3e6aa0);color:#0d1a2b}
.u.E{background:radial-gradient(circle at 35% 30%,#efa49a,#93372e);color:#2a0b07}
.u.cmd{border-color:var(--gold);box-shadow:0 0 0 2px #d8b56a88}
.u.acted{filter:grayscale(.75) brightness(.7)}
.u.ghost{opacity:.4}
.u .hp{position:absolute;left:8%;right:8%;bottom:-3px;height:4px;background:#000a;border-radius:2px;overflow:hidden}
.u .hp i{display:block;height:100%;background:var(--ok)}
.u.E .hp i{background:#f0c070}
.u .sn{position:absolute;left:-5px;bottom:-5px;font-size:9px;line-height:1;background:#111c;color:#fff;border-radius:6px;padding:1px 3px;font-weight:400}
.u .ic{position:absolute;right:-5px;top:-5px;display:flex;gap:1px}
.u .ic b{font-size:8.5px;line-height:1;background:var(--gold);color:#000;border-radius:5px;padding:1px 2px;font-weight:700}
.u .ic b.r{background:#b48cff}.u .ic b.m{background:#ff8a6a}.u .ic b.f{background:#9fd1ff}
.gatec{z-index:2;font-size:clamp(11px,3.4vw,16px);color:var(--gold);font-weight:700}
.c.flash{animation:fl .35s}
@keyframes fl{0%{filter:brightness(2.2)}100%{filter:none}}
#info{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:76px;font-size:14px;line-height:1.55}
#info b{color:var(--gold)}
.say{color:#e8c9a0}.note{color:var(--dim);font-size:12px}.bad{color:var(--red)}.good{color:var(--ok)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#120e0bf2;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:20}
button{font:inherit;font-size:14px;color:var(--ink);background:#2a2119;border:1px solid #5a4632;border-radius:8px;padding:8px 11px;min-height:42px;cursor:pointer}
#bar button{font-size:13.5px}
button.pri{background:#5a3f22;border-color:var(--gold);color:#fff3da}
button.sk{background:#3a2a4a;border-color:#b48cff}
button.dng{background:#4a1f1b;border-color:#a2543e}
button:disabled{opacity:.4}
#log{margin-top:8px;background:#0e0b09;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.5;max-height:180px;overflow:auto;color:var(--dim)}
#log div.s{color:#e8c9a0}#log div.e{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hide{display:none}
.box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:500px;width:100%;max-height:86vh;overflow:auto;padding:14px 16px;font-size:14px;line-height:1.6}
.box h2{margin:0 0 6px;color:var(--gold);font-size:18px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}
.pick{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;cursor:pointer;background:#16110d}
.pick.on{border-color:var(--gold);background:#2a2015}
.pick .no{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3e6aa0;color:#fff;font-weight:700}
.pick.on .no{background:var(--gold);color:#000}
@media (prefers-reduced-motion:reduce){.c.flash{animation:none}}
</style>
</head>
<body>
<header>
 <h1>語嫣・永生戰棋　<span class="note">原型 P1・黑鐘城第一次圍攻</span></h1>
 <span class="chip" id="rd">第 1／8 回合</span>
 <span class="chip" id="ph">我方回合</span>
 <span class="note">城門 <b id="gh">300</b></span><div class="gatebar"><i id="gb" style="width:100%"></i></div>
</header>
<div id="board" aria-label="棋盤"></div>
<div id="info"></div>
<div id="log"></div>
<div id="bar"></div>
<div class="modal hide" id="modal"><div class="box" id="box"></div></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
'use strict';
const D=window.TACTICS_DATA,C=window.TACTICS,MID='MISSION_BC_001',SAVE_KEY='yyt_save_v2';
const SLOT_NAMES=['城門前（最前線）','右前方','左側高地','門前後排'];
let seed,acts,team,st,sel=null,showThreat=false,busy=false,inspect=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function startBattle(s,tm){seed=(s==null?(Date.now()%2147483647):s)>>>0;team=(tm||team||D.defaultTeam).slice();acts=[];st=C.createBattle(D,MID,seed,{team});sel=null;inspect=null;persist();closeModal();render();logAll(true);intro();}
function persist(){LS.set(SAVE_KEY,{v:2,mission:MID,ruleset:D.rulesetVersion,seed,acts,team});LS.set('yyt_team',team);}
function boot(){const sv=LS.get(SAVE_KEY);if(sv&&sv.mission===MID&&sv.ruleset===D.rulesetVersion&&Array.isArray(sv.acts)){try{const s2=C.replay(D,MID,sv.seed,sv.acts,{team:sv.team});seed=sv.seed;acts=sv.acts;team=sv.team;st=s2;render();logAll(true);if(!st.result)toastInfo('<b>已接續上一場</b>（第 '+st.round+' 回合）。<span class="note">存檔只記「亂數種子＋隊伍＋你的指令」，重新算一次，不會重複觸發事件。</span>');else showResult();return;}catch(e){console.warn(e);}}
 team=LS.get('yyt_team')||D.defaultTeam.slice();seed=1;acts=[];st=C.createBattle(D,MID,1,{team});render();prep();}

// ---------- 出戰編成：7 選 4 ----------
let prepPick=[];
function prep(){prepPick=(team||D.defaultTeam).slice();drawPrep();}
function drawPrep(){const all=Object.keys(D.units).filter(k=>k[0]==='P');
 modal(`<h2>出戰編成</h2><p class="note">從七個兵種隊伍選 4 隊。點選的順序＝站位：① ${SLOT_NAMES[0]}、② ${SLOT_NAMES[1]}、③ ${SLOT_NAMES[2]}、④ ${SLOT_NAMES[3]}。</p>`+all.map(k=>{const u=D.units[k],S=D.skills[u.skill],i=prepPick.indexOf(k);return `<div class="pick ${i>=0?'on':''}" onclick="togglePick('${k}')"><span class="no">${i>=0?i+1:u.glyph}</span><div><b>${esc(u.name)}</b>　<span class="note">${D.troopName[u.troop]}・生命 ${u.hp}・士兵 ${u.soldiers}・${u.dmg==='MAGICAL'?'法術 '+u.mag:'攻擊 '+u.atk}・防 ${u.def}・移動 ${u.move}・射程 ${u.rmin}–${u.rmax}</span><br><span class="say">${esc(S.name)}</span>：<span class="note">${esc(S.desc)}（冷卻 ${S.cd}）</span></div></div>`;}).join('')+
 `<p><button class="pri" ${prepPick.length===4?'':'disabled'} onclick="startBattle(null,prepPick)">出戰（${prepPick.length}/4）</button> <button onclick="prepPick=D.defaultTeam.slice();drawPrep()">推薦隊伍</button> ${acts&&acts.length&&!st.result?'<button onclick="closeModal()">回到戰場</button>':''}</p>`);}
function togglePick(k){const i=prepPick.indexOf(k);if(i>=0)prepPick.splice(i,1);else if(prepPick.length<4)prepPick.push(k);drawPrep();}

// ---------- 畫面 ----------
const selU=()=>sel&&st.units.find(v=>v.id===sel.id);
function reachOf(u){return C.reachable(D,st,u,sel&&sel.dash?{extra:D.skills.shadowStep.extraMove,ignoreZoc:true}:{});}
function normalTargets(u,to){return C.withPos(u,to,()=>C.targetsFrom(D,st,u,to));}
function cellsHi(){const H={reach:new Set(),dash:false,tgt:new Set(),ally:new Set(),zsel:new Set(),zprev:new Set(),threat:new Set(),dest:null,tsel:null};
 const u=selU();if(u){for(const k of reachOf(u).keys())H.reach.add(k);H.dash=!!sel.dash;if(sel.to){H.dest=C.key(sel.to.x,sel.to.y);
  if(sel.mode==='skill'){const S=D.skills[u.skill];const ts=C.skillTargets(D,st,u,sel.to);if(S.kind==='zone'){ts.forEach(k=>H.zsel.add(k));if(sel.at)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)H.zprev.add(C.key(sel.at.x+dx,sel.at.y+dy));}
   else if(S.kind==='ally')ts.forEach(id=>{const v=st.units.find(x=>x.id===id);H.ally.add(C.key(v.x,v.y));});else ts.forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});}
  else if(sel.dash){C.skillTargets(D,st,u,sel.to).forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});}
  else normalTargets(u,sel.to).forEach(id=>{const v=st.units.find(x=>x.id===id);if(v)H.tgt.add(C.key(v.x,v.y));});
  if(sel.target){const v=st.units.find(x=>x.id===sel.target);if(v)H.tsel=C.key(v.x,v.y);}}}
 if(inspect){const v=st.units.find(x=>x.id===inspect);if(v&&v.hp>0)for(const k of threatOf(v))H.threat.add(k);}
 if(showThreat)for(const v of C.alive(st,'E'))for(const k of threatOf(v))H.threat.add(k);
 return H;}
function threatOf(u){const out=new Set();const R=C.reachable(D,st,u);for(const k of R.keys()){const [x,y]=k.split(',').map(Number);const [a,b]=C.rangeOf(D,st,u,{x,y});for(let dy=-b;dy<=b;dy++)for(let dx=-b;dx<=b;dx++){const d=Math.abs(dx)+Math.abs(dy);if(d<a||d>b)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=st.w||ny>=st.h)continue;if(d>1&&!C.los(D,st,{x,y},{x:nx,y:ny}))continue;out.add(C.key(nx,ny));}}return out;}
function token(u,extra){const n=C.soldiers(u);const ic=[];if(u.form&&u.form!=='NONE')ic.push(`<b class="f">${esc(D.forms[u.form].name[0])}</b>`);if(u.st.gs>0)ic.push('<b>護</b>');if(u.st.root>0)ic.push('<b class="r">縛</b>');if(u.st.mark>0)ic.push('<b class="m">標</b>');if(u.guard)ic.push('<b>守</b>');
 return `<div class="u ${u.faction}${u.commander?' cmd':''}${u.usedAct&&u.faction==='P'?' acted':''}${extra||''}" title="${esc(u.name)}">${esc(u.glyph)}<div class="hp"><i style="width:${Math.round(100*u.hp/u.maxHp)}%"></i></div>${u.solMax?`<span class="sn">${n}</span>`:''}${ic.length?`<span class="ic">${ic.join('')}</span>`:''}</div>`;}
function render(){const H=cellsHi();let h='';const warnSet=new Set((st.warn||[]).map(p=>C.key(p.x,p.y)));
 for(let y=0;y<st.h;y++)for(let x=0;x<st.w;x++){const k=C.key(x,y);const t=C.tileAt(st,x,y);const T=D.terrain[t];let cls='c '+t;
  if(C.inZone(st,x,y,'P'))cls+=' zone';if(H.reach.has(k))cls+=' reach'+(H.dash?' dash':'');if(H.threat.has(k))cls+=' threat';if(H.tgt.has(k))cls+=' tgt';if(H.ally.has(k))cls+=' ally';if(H.zsel.has(k))cls+=' zsel';if(H.zprev.has(k))cls+=' zprev';if(H.tsel===k)cls+=' tgtsel';if(warnSet.has(k))cls+=' warn';if(H.dest===k)cls+=' dest';
  let inner=T.glyph?`<span class="tg">${T.glyph}</span>`:'';if(warnSet.has(k))inner+='<span class="wv">⚠1</span>';if(st.gate.x===x&&st.gate.y===y)inner+=`<span class="gatec">門</span>`;
  let u=C.unitAt(st,x,y);let ghost=false;const su=selU();
  if(su&&sel.to){if(u&&u.id===su.id&&(sel.to.x!==x||sel.to.y!==y))ghost=true;if(!u&&sel.to.x===x&&sel.to.y===y)u=su;}
  if(u)inner+=token(u,ghost?' ghost':'');
  h+=`<div class="${cls}" data-x="${x}" data-y="${y}" role="button" aria-label="${T.name} ${x},${y}${u?' '+esc(u.name):''}">${inner}</div>`;}
 $('board').innerHTML=h;
 $('rd').textContent='第 '+Math.min(st.round,D.missions[MID].roundLimit)+'／'+D.missions[MID].roundLimit+' 回合';$('ph').textContent=st.result?(st.result.win?'勝利':'失敗'):busy?'敵方行動中…':'我方回合';
 $('gb').style.width=Math.round(100*st.gate.hp/st.gate.maxHp)+'%';$('gh').textContent=st.gate.hp;renderBar();}
function skillBtn(u){if(!u.skill)return '';const S=D.skills[u.skill];const cd=u.cd[u.skill]||0;return `<button class="sk" ${cd?'disabled':''} onclick="skillMode()">${esc(S.name)}${cd?'（冷卻 '+cd+'）':''}</button>`;}
function renderBar(){let h='';const u=selU();
 if(st.result){h=`<button class="pri" onclick="showResult()">結算</button><button onclick="retry()">同一場重打</button><button onclick="prep()">換隊伍／新的一場</button>`;}
 else if(busy){h='<button disabled>敵方行動中…</button>';}
 else if(u&&sel.to&&sel.mode==='skill'){const S=D.skills[u.skill];h=(S.kind==='self'||(sel.target||sel.at)?`<button class="pri" onclick="commitSkill()">確認「${esc(S.name)}」</button>`:'')+`<button onclick="sel.mode=null;sel.target=null;sel.at=null;pickedDest()">返回</button><button class="dng" onclick="cancel()">取消</button>`;}
 else if(u&&sel.to&&sel.dash){h=(sel.target?`<button class="pri" onclick="commitDash()">確認影徑攻擊</button>`:'')+`<button onclick="commitDash(true)">影徑後待機</button><button class="dng" onclick="cancel()">取消</button>`;}
 else if(u&&sel.to){h=(sel.target?`<button class="pri" onclick="commit('ATTACK')">確認攻擊</button>`:'')+(u.skill&&u.skill!=='shadowStep'?skillBtn(u):'')+`<button onclick="formMenu()">陣形</button><button onclick="commit('WAIT')">待機</button><button onclick="commit('GUARD')">守備</button><button class="dng" onclick="cancel()">取消</button>`;}
 else if(u){h=`<button onclick="sel.to={x:selU().x,y:selU().y};pickedDest()">原地行動</button>`+(u.skill==='shadowStep'&&!(u.cd.shadowStep>0)?`<button class="sk" onclick="toggleDash()">${sel.dash?'改回一般移動':'影徑移動（+1、無視控制區）'}</button>`:'')+`<button class="dng" onclick="cancel()">取消</button>`;}
 else{const left=C.alive(st,'P').filter(v=>!v.usedAct).length;h=`<button class="pri" onclick="endTurn()">結束回合${left?'（還有 '+left+' 隊）':''}</button><button onclick="toggleThreat()">${showThreat?'隱藏':'顯示'}敵方威脅</button><button onclick="help()">規則</button><button onclick="menu()">選單</button>`;}
 $('bar').innerHTML=h;}
function toastInfo(html){$('info').innerHTML=html;}
function intro(){const M=D.missions[MID];toastInfo(`<b>${esc(M.name)}</b><br>勝利：${esc(M.win)}<br>失敗：${esc(M.lose)}<br><span class="note">點藍色隊伍 → 點藍色格移動 → 點紅框敵人攻擊，或用技能／陣形／待機／守備。點敵人可看牠打得到哪裡。數字＝士兵人數。</span>`);}
function unitCard(u){const T=D.terrain[C.tileAt(st,u.x,u.y)];const S=u.skill&&D.skills[u.skill];const stt=[];if(u.st.root>0)stt.push('束縛');if(u.st.mark>0)stt.push('標記 '+u.st.mark+' 回合');if(u.st.gs>0)stt.push('守護 '+u.st.gs+' 回合');if(u.guard)stt.push('守備中');if(C.inZone(st,u.x,u.y,u.faction))stt.push('在燈界裡');
 return `<b>${esc(u.name)}</b>　${D.troopName[u.troop]}${u.commander?'・指揮官':''}　生命 ${u.hp}/${u.maxHp}　士兵 ${C.soldiers(u)}/${C.solMaxN(u)}<br><span class="note">${u.dmg==='MAGICAL'?'法術 '+u.mag:'攻擊 '+u.atk}・防 ${u.def}・魔防 ${u.res}・移動 ${u.move}・射程 ${u.rmin}–${u.rmax}・${T.name}${T.def?'（防禦 '+(T.def>0?'+':'')+Math.round(T.def*100)+'%）':''}・${D.forms[u.form].name}${stt.length?'・'+stt.join('、'):''}</span>`+(S?`<br><span class="say">${esc(S.name)}</span><span class="note">（冷卻 ${S.cd}${u.cd[u.skill]?'，還要 '+u.cd[u.skill]+' 回合':''}）：${esc(S.desc)}</span>`:'');}

// ---------- 操作 ----------
$('board').addEventListener('click',e=>{const c=e.target.closest('.c');if(!c||busy||st.result)return;tap(+c.dataset.x,+c.dataset.y);});
function tap(x,y){const u=C.unitAt(st,x,y);const k=C.key(x,y);const su=selU();
 if(su&&sel.to&&sel.mode==='skill'){const S=D.skills[su.skill];const ts=C.skillTargets(D,st,su,sel.to);
  if(S.kind==='zone'){if(ts.includes(k)){if(sel.at&&sel.at.x===x&&sel.at.y===y){commitSkill();return;}sel.at={x,y};toastInfo(`<b>${esc(S.name)}</b>：以 (${x},${y}) 為中心的 3×3（金色）。<br><span class="note">再點一次或按確認。</span>`);render();return;}}
  else if(u&&ts.includes(u.id)){if(sel.target===u.id){commitSkill();return;}sel.target=u.id;showSkillPreview();render();return;}
  return;}
 if(su&&sel.to){const ts=sel.dash?C.skillTargets(D,st,su,sel.to):normalTargets(su,sel.to);
  if(u&&u.faction==='E'&&ts.includes(u.id)){if(sel.target===u.id){sel.dash?commitDash():commit('ATTACK');return;}sel.target=u.id;showPreview();render();return;}
  if(reachOf(su).has(k)&&!(u&&u.id!==su.id)){sel.to={x,y};sel.target=null;pickedDest();return;}
  if(u&&u.faction==='P'&&!u.usedAct){selectUnit(u);return;}cancel();return;}
 if(su){if(reachOf(su).has(k)&&(!u||u.id===su.id)){sel.to={x,y};pickedDest();return;}}
 if(u&&u.faction==='P'){if(u.usedAct){sel=null;inspect=null;toastInfo(unitCard(u)+'<br><span class="note">這回合已經行動過。</span>');render();return;}selectUnit(u);return;}
 if(u&&u.faction==='E'){sel=null;inspect=inspect===u.id?null:u.id;toastInfo(unitCard(u)+'<br><span class="note">斜線區＝牠這回合移動後打得到的範圍。再點一次收起。</span>');render();return;}
 if(st.gate.x===x&&st.gate.y===y){toastInfo(`<b>城門</b>　生命 ${st.gate.hp}/${st.gate.maxHp}<br><span class="note">只有敵人會攻擊城門。站在門前那一格，可以擋住近戰的敵人。</span>`);return;}
 const T=D.terrain[C.tileAt(st,x,y)];toastInfo(`<b>${T.name}</b>　(${x},${y})<br><span class="note">${T.pass?'移動消耗 '+T.cost:'不能通行'}${T.def?'・防禦 '+(T.def>0?'+':'')+Math.round(T.def*100)+'%':''}${T.height?'・高地：遠程射程 +1':''}${T.blockLos?'・擋住遠程視線':''}${C.inZone(st,x,y,'P')?'・燈界：我方攻防 +10%、不會被異變改寫':''}</span>`);sel=null;inspect=null;render();}
function selectUnit(u){inspect=null;sel={id:u.id,to:null,target:null,mode:null,dash:false,at:null};toastInfo(unitCard(u)+'<br><span class="note">點藍色格移動（點自己＝原地）。</span>');render();}
function toggleDash(){if(!sel)return;sel.dash=!sel.dash;sel.to=null;sel.target=null;toastInfo(unitCard(selU())+'<br>'+(sel.dash?'<span class="say">影徑：紫色格都能到，無視控制區。</span>':'一般移動。'));render();}
function pickedDest(){const u=selU();const ts=sel.dash?C.skillTargets(D,st,u,sel.to):normalTargets(u,sel.to);toastInfo(unitCard(u)+'<br>'+(ts.length?`<span class="good">紅框的目標打得到</span>，點一下看預估，再點一次攻擊。`:'<span class="note">這裡打不到人：可以用技能、換陣形、待機或守備（防禦 +30%）。</span>'));render();}
function pvText(p,name,hp){let h=`傷害 <b>${p.dmg}</b>　命中 ${Math.round(p.hit*100)}%　暴擊 5%${p.cm>1?'　<span class="good">兵種克制 ×1.2</span>':p.cm<1?'　<span class="bad">被克制 ×0.85</span>':''}${p.notes&&p.notes.length?'<br><span class="good">'+esc(p.notes.join('、'))+'</span>':''}`;
 h+=p.kill?'<br><span class="good">命中就會擊倒。</span>':p.counter?`<br><span class="bad">對方會反擊：約 ${p.counter.dmg}（命中 ${Math.round(p.counter.hit*100)}%）${p.counter.notes&&p.counter.notes.length?'〔'+esc(p.counter.notes.join('、'))+'〕':''}</span>`:'<br><span class="good">對方不會反擊。</span>';return h;}
function showPreview(){const u=selU();const t=st.units.find(v=>v.id===sel.target);const cost=reachOf(u).get(C.key(sel.to.x,sel.to.y))||0;const p=C.preview(D,st,u,sel.to,sel.target,sel.dash?{flank:D.skills.shadowStep.flank}:{charge:cost});
 toastInfo(`<b>${sel.dash?'影徑攻擊':'攻擊'} ${esc(t.name)}</b>（生命 ${t.hp}・士兵 ${C.soldiers(t)}）<br>`+pvText(p)+'<br><span class="note">傷害 70% 打士兵、30% 打隊長。再點一次目標或按確認。</span>');}
function skillMode(){const u=selU();if(!u||!sel.to)return;const S=D.skills[u.skill];sel.mode='skill';sel.target=null;sel.at=null;
 toastInfo(`<b>${esc(S.name)}</b>：${esc(S.desc)}<br><span class="note">${S.kind==='self'?'按確認發動。':S.kind==='zone'?'點金色虛線範圍裡的一格當中心。':S.kind==='ally'?'點綠框的隊友（可以是自己）。':'點紅框的敵人。'}</span>`);render();}
function showSkillPreview(){const u=selU();const S=D.skills[u.skill];const t=st.units.find(v=>v.id===sel.target);
 if(S.kind==='ally'){toastInfo(`<b>${esc(S.name)}</b> → ${esc(t.name)}：回復約 ${Math.min(t.maxHp-t.hp,Math.round(t.maxHp*S.heal))} 生命、補 ${Math.round(S.solHeal*100)}% 士兵${t.st.root||t.st.mark?'、解除束縛與標記':''}。<br><span class="note">再點一次或按確認。</span>`);return;}
 const p=C.preview(D,st,u,sel.to,sel.target,{mult:S.mult,noCounter:!!S.noCounter,area:!!S.area});let extra='';
 if(u.skill==='pierce'){const b=C.unitAt(st,t.x+(t.x-sel.to.x),t.y+(t.y-sel.to.y));extra=b&&b.faction==='E'?'<br><span class="good">後面的 '+esc(b.name)+' 也會被刺到。</span>':'<br><span class="note">後面沒有敵人。</span>';}
 if(u.skill==='markShot')extra='<br><span class="say">命中後標記 2 回合：受到傷害 +20%。</span>';if(u.skill==='bind')extra='<br><span class="say">命中後下一個回合不能移動。</span>';
 toastInfo(`<b>${esc(S.name)}</b> → ${esc(t.name)}<br>`+pvText(p)+extra+'<br><span class="note">再點一次或按確認。</span>');}
function cancel(){sel=null;inspect=null;intro();render();}
function toggleThreat(){showThreat=!showThreat;render();}
function send(a){const r=C.apply(D,st,a);if(!r.ok){toastInfo('<span class="bad">不能這樣做：'+esc(r.error)+'</span>');return false;}acts.push(a);st=r.state;sel=null;persist();addLog(r.events);flashEv(r.events);
 const left=C.alive(st,'P').filter(u=>!u.usedAct).length;toastInfo(r.events.map(e=>esc(e.txt)).join('<br>')+(st.result?'':left?'':'<br><span class="note">大家都行動完了，按「結束回合」。</span>'));render();if(st.result)setTimeout(showResult,600);return true;}
function commit(act){if(!sel||!sel.to)return;const a={type:'ACT',actorId:sel.id,to:{...sel.to},act};if(act==='ATTACK')a.target=sel.target;send(a);}
function commitSkill(){const u=selU();if(!u)return;const a={type:'ACT',actorId:u.id,to:{...sel.to},act:'SKILL',skill:u.skill};if(sel.target)a.target=sel.target;if(sel.at)a.at={...sel.at};send(a);}
function commitDash(noAtk){const u=selU();const a={type:'ACT',actorId:u.id,to:{...sel.to},act:'SKILL',skill:'shadowStep'};if(!noAtk&&sel.target)a.target=sel.target;send(a);}
function formMenu(){const u=selU();modal(`<h2>陣形：${esc(u.name)}</h2><p class="note">一次只能一種；換陣會用掉這一隊這回合的行動（可以先移動）。現在：${esc(D.forms[u.form].name)}</p>`+Object.entries(D.forms).filter(([k])=>k!==u.form).map(([k,f])=>`<p><button onclick="closeModal();commitForm('${k}')">${esc(f.name)}</button> <span class="note">${esc(f.desc)}</span></p>`).join('')+'<button onclick="closeModal()">不換</button>');}
function commitForm(f){if(!sel||!sel.to)return;send({type:'ACT',actorId:sel.id,to:{...sel.to},act:'FORM',form:f});}
function endTurn(){const left=C.alive(st,'P').filter(u=>!u.usedAct).length;if(left&&!confirm('還有 '+left+' 隊沒有行動，確定結束回合？'))return;
 const before=st;const a={type:'END_PHASE'};const r=C.apply(D,st,a);if(!r.ok)return;acts.push(a);persist();sel=null;inspect=null;busy=true;
 const frames=(r.state.frames||[]);let i=0;const shown=C.clone(before);
 const step=()=>{if(i>=frames.length){busy=false;st=r.state;render();addLog(r.events.filter(e=>!frames.some(f=>f.events.includes(e))));const says=r.events.filter(e=>['say','spawn','end','stabilize'].includes(e.t));toastInfo(says.length?says.map(e=>'<span class="say">'+esc(e.txt)+'</span>').join('<br>'):'<b>我方回合</b>');if(st.result)setTimeout(showResult,600);return;}
  const f=frames[i++];for(const [id,x,y,hp,sol] of f.units){const u=shown.units.find(v=>v.id===id);if(u){u.x=x;u.y=y;u.hp=hp;u.sol=sol;}}shown.gate.hp=f.gate;const keep=st;st=shown;render();st=keep;addLog(f.events);flashEv(f.events,shown);toastInfo(f.events.map(e=>esc(e.txt)).join('<br>'));setTimeout(step,560);};
 render();setTimeout(step,200);}
function flashEv(evs,S){S=S||st;for(const e of evs){if(e.t!=='hit')continue;const p=e.d==='GATE'?S.gate:S.units.find(v=>v.id===e.d);if(!p)continue;const c=document.querySelector(`.c[data-x="${p.x}"][data-y="${p.y}"]`);if(c){c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash');}}}
function addLog(evs){const L=$('log');for(const e of evs){const d=document.createElement('div');d.className=['say','spawn','stabilize'].includes(e.t)?'s':e.t==='end'?'e':'';d.textContent=e.txt;L.appendChild(d);}L.scrollTop=L.scrollHeight;}
function logAll(reset){if(reset)$('log').innerHTML='';addLog(st.eventLog);}
function retry(){startBattle(seed,team);}
function closeModal(){$('modal').classList.add('hide');}
function modal(h){$('box').innerHTML=h;$('modal').classList.remove('hide');}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&acts&&acts.length)closeModal();});
function showResult(){if(!st.result)return;const M=D.missions[MID];const g=st.gate.hp;const P=st.units.filter(u=>u.faction==='P');const lost=P.filter(u=>u.hp<=0).map(u=>u.name);const solLeft=P.reduce((s,u)=>s+C.soldiers(u),0),solAll=P.reduce((s,u)=>s+C.solMaxN(u),0);
 let oc;if(!st.result.win)oc=M.outcomes.find(o=>o.id==='DEFEAT');else if(g>=200)oc=M.outcomes.find(o=>o.id==='HOLD_CLEAN');else if(g<150)oc=M.outcomes.find(o=>o.id==='BROKEN_WALL');
 modal(`<h2>${st.result.win?'勝利':'失敗'}</h2><p>${esc(st.result.reason)}。</p><p>城門剩 ${g}／${st.gate.maxHp}・倒下的隊伍：${lost.length?esc(lost.join('、')):'沒有'}・士兵剩 ${solLeft}／${solAll}・第 ${Math.min(st.round,M.roundLimit)} 回合</p>
 <p><b>世界後果預覽</b>（P2 才會真的寫入世界，現在只顯示）<br>${oc?esc(oc.when)+' → '+esc(oc.world)+'；'+esc(oc.next):'城門 150～199：沒有額外後果。'}</p>
 <p class="note">種子 ${seed}・指令 ${acts.length} 筆・狀態碼 ${C.hash(st)}</p>
 <button class="pri" onclick="retry()">同一場重打</button> <button onclick="prep()">換隊伍／新的一場</button> <button onclick="closeModal()">看棋盤</button>`);}
function menu(){modal(`<h2>選單</h2><p><button onclick="if(confirm('重新開始這一場（同隊伍、同種子）？'))retry()">同一場重打</button></p><p><button onclick="prep()">換隊伍／新的一場</button></p>
 <p class="note">種子 ${seed}・指令 ${acts.length} 筆・狀態碼 ${C.hash(st)}・規則版本 ${D.rulesetVersion}</p><p class="note">原型 P1：兵隊、七個兵種的測試技能、軍陣。污染擴散、妖化、恐懼士氣、世界記憶在後面的階段。所有名稱與數值都是測試提案。</p><button onclick="closeModal()">關閉</button>`);}
function help(){const tr=Object.entries(D.terrain).map(([k,t])=>`<tr><td><i class="${k}" style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle"></i> ${t.name}</td><td>${t.pass?t.cost:'不能走'}</td><td>${t.def?(t.def>0?'+':'')+Math.round(t.def*100)+'%':'—'}</td></tr>`).join('');
 modal(`<h2>規則</h2><p><b>回合：</b>每一隊可以「移動一次＋行動一次」（攻擊、技能、換陣、待機或守備），全部動完按結束回合，敵人照同樣規則行動。</p>
 <p><b>兵隊：</b>每隊是一位隊長帶 5 名士兵。受到的傷害 70% 打士兵、30% 打隊長；士兵打光後全打隊長；隊長倒下整隊潰散。士兵越多攻防越高（滿編 +20%）。</p>
 <p><b>控制區：</b>走進敵人旁邊那一格就要停下。不能穿過任何單位。</p>
 <p><b>攻擊：</b>傷害＝攻擊×士兵加成×兵種×情境 − 防禦×(1＋地形等)×0.5，最少 1。命中基礎 90%，暴擊 5%（×1.5）。被打的一方活著、打得到你，就反擊一次。</p>
 <p><b>兵種克制（×1.2／被克 ×0.85）：</b>步兵→槍兵→騎兵→弓兵、法術兵；法術兵→步兵。騎兵走 3 格以上再攻擊有衝鋒 +20%。</p>
 <table><tr><th>技能</th><th>效果</th></tr>${Object.values(D.skills).map(s=>`<tr><td>${esc(s.name)}<br><span class="note">冷卻 ${s.cd}</span></td><td>${esc(s.desc)}</td></tr>`).join('')}</table>
 <table style="margin-top:8px"><tr><th>陣形</th><th>效果</th></tr>${Object.values(D.forms).filter(f=>f.name!=='無陣').map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.desc)}</td></tr>`).join('')}</table>
 <table style="margin-top:8px"><tr><th>地形</th><th>移動</th><th>防禦</th></tr>${tr}</table>
 <p class="note">小圖示：數字＝士兵、護＝守護、縛＝束縛、標＝標記、守＝守備、陣形第一個字（堅／長／散／突）。紫框 ⚠＝下回合會變化的格子；金色＝燈界。</p><button onclick="closeModal()">關閉</button>`);}
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('sw',e)));
boot();
</script>
</body>
</html>
