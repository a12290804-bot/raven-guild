<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0907">
<title>渡鴉公會｜無字地窖</title>
<style>
:root{--ink:#efe4d2;--dim:#a99a85;--gold:#e2b56c;--red:#c4574a;--bg:#0b0907;--glass:#120d0ab8;--line:#e2b56c40}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{position:relative;max-width:560px;height:100vh;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#000;box-shadow:0 0 60px #000}
header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:linear-gradient(#0b0907f0,#0b090700)}
.brand{font-weight:800;letter-spacing:.2em;font-size:15px;color:var(--gold);text-shadow:0 1px 6px #000}.brand small{display:block;font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:400}
.res{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);text-shadow:0 1px 4px #000}.res b{color:var(--ink)}.res img{width:18px;height:18px;border-radius:4px;vertical-align:-4px}
.ibtn{border:1px solid var(--line);background:#0008;border-radius:8px;min-width:32px;min-height:30px;font-size:13px}
.ibtn[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 55%,#000d 100%)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.chip{align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;line-height:1.6;max-width:100%;backdrop-filter:blur(2px)}
.chip b{color:var(--gold)}
.tabs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#0009;border-radius:14px;padding:3px 10px;font-size:12px;min-height:28px}
.tab.on{border-color:var(--gold);color:var(--gold);background:#3a2a16cc}.tab:disabled{opacity:.45}
.npcs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.npc{position:relative;width:72px;border:0;background:none;padding:0;text-align:center;font-size:11px;color:var(--ink);text-shadow:0 1px 4px #000}
.npc img,.npc .ph{width:60px;height:60px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid var(--line);display:block;margin:0 auto 3px;background:#000}
.npc .ph{display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(#3a2c22,#120d0a);color:var(--gold)}
.npc.visit img,.npc.visit .ph{border-color:#9fc0e6}
.npc .badge{position:absolute;top:0;right:4px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
.bar4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#1c140ee0;padding:6px;font-size:13px}
.btn.primary{background:#5a3f1ff0;border-color:var(--gold);color:#ffe9c4}.btn:disabled{opacity:.4}
.btn.small{min-height:32px;font-size:12px;padding:4px 8px}
.mapwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:54px 8px calc(10px + env(safe-area-inset-bottom));gap:7px}
.grid{display:grid;gap:2px}
.cell{width:var(--c);height:var(--c);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.42);border:1px solid transparent;padding:0;background:none}
.cell.fog{background:#0008}.cell.wall{background:#0a080670}.cell.floor{background:#2b231b55;border-color:#e2b56c22}
.cell.path{background:#e2b56c33}.cell.me{background:#5a3f1fd0;border-color:var(--gold)}
.cell.m{color:#ff9b88;text-shadow:0 0 6px #000}.cell.b{color:#ff8f6f;font-weight:800;text-shadow:0 0 8px #c4574a}.cell.c{color:var(--gold)}.cell.e{color:#9fc0e6}.cell.f{color:#ffe0a0;text-shadow:0 0 10px #ffb35c}.cell.d{color:#b9a6d6}
.strip{display:flex;gap:6px;justify-content:center}
.pmini{width:58px;text-align:center;font-size:10px;color:var(--ink);text-shadow:0 1px 3px #000}.pmini img{width:50px;height:50px;object-fit:cover;object-position:50% 15%;border-radius:50%;border:1px solid var(--line)}
.hpb{height:5px;background:#3a2c22;border-radius:4px;overflow:hidden;margin-top:2px}.hpb i{display:block;height:100%;background:var(--red);transition:width .25s}
.hpb.xp i{background:var(--gold)}
.battle{position:absolute;inset:0;display:flex;flex-direction:column;background:#000 center/cover;z-index:20;padding-top:40px}
.foes{position:relative;flex:1;display:flex;justify-content:center;align-items:center;min-height:0;padding:6px}
.foe{position:relative;height:100%;width:min(98%,360px);max-width:98%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.foe > img{max-width:100%;max-height:calc(100% - 52px);object-fit:contain;-webkit-mask-image:radial-gradient(ellipse at center,#000 64%,transparent 84%);mask-image:radial-gradient(ellipse at center,#000 64%,transparent 84%);transition:filter .3s}
.foe .bars{width:72%;display:flex;flex-direction:column;gap:3px}.foe .nm{font-size:12px;color:var(--dim);margin-top:2px}
.fst{font-size:12px;min-height:16px;text-align:center}
.sb{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;margin:1px;padding:0 2px;border-radius:5px;font-size:11px;font-weight:700;line-height:1;color:#fff;border:1px solid;vertical-align:middle}.sb.si{padding:0 1px 0 0}.sb.si img{width:15px;height:15px;border-radius:3px;margin-right:1px}
.cln{display:block;font-size:9px;line-height:1.1;opacity:.85;letter-spacing:1px;color:#cfc3a0}.cln.c-shield,.cln.c-warrior,.cln.c-lancer{color:#ffb08a}.cln.c-mage,.cln.c-curser{color:#c9a6ff}.cln.c-healer,.cln.c-shifter{color:#9be39b}.cln.c-archer,.cln.c-assassin,.cln.c-weaver{color:#8fd0ff}
.fxw{position:absolute;inset:8% 0 18%;overflow:hidden;pointer-events:none;z-index:4;border-radius:inherit}
.fxi{position:absolute;left:50%;top:50%;width:95%;height:95%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 6px #fff6);pointer-events:none;z-index:4;animation:fxi .85s ease-out forwards}
@keyframes fxi{0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(var(--r,0deg))}25%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) rotate(calc(var(--r,0deg) * -1))}}
.skillname img{width:20px;height:20px;border-radius:4px;vertical-align:middle;margin-right:5px}
.cutin{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0008,#000d);animation:cutin 1.5s ease forwards}
.cutin img{height:72%;max-width:92%;object-fit:contain;border-radius:10px;box-shadow:0 0 40px #000;animation:cutimg 1.5s ease forwards}
.cutin b{position:absolute;bottom:12%;left:0;right:0;text-align:center;color:var(--gold);font-size:22px;letter-spacing:4px;text-shadow:0 0 10px #000,0 0 4px #000}
@keyframes cutin{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cutimg{0%{transform:translateX(30px) scale(1.05)}100%{transform:translateX(-20px) scale(1)}}
.sb sub{font-size:8px;font-weight:400;margin-left:1px;opacity:.9}.sb.b{background:#1f4a35;border-color:#5fd39a}.sb.d{background:#4a1f2a;border-color:#ff7b8f}.sb.f{background:#5a2a10;border-color:#ff9a4a}.sb.p{background:#2e3d12;border-color:#a6d64a}.sb.r{background:#5a1218;border-color:#ff4a5a}.sb.i{background:#13385a;border-color:#7cc8ff}.stt{display:inline-block;margin:0 1px;font-size:12px;text-shadow:0 0 3px #000}.stt sub{font-size:9px;color:var(--ink)}
.allies{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 8px}
.ally{position:relative;text-align:center;font-size:11px}
.ally .pic{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:#000}
.ally .pic > img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;transition:filter .3s}
.ally .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#0000,#000d);padding:10px 2px 2px;font-size:11px}
.ally .st{position:absolute;top:2px;left:2px;right:2px;display:flex;flex-wrap:wrap;gap:1px;z-index:2}
.ally.act .pic{outline:2px solid var(--gold)}.ally.dead .pic img{filter:grayscale(1) brightness(.5)}
.blog{height:64px;overflow:auto;font-size:12px;line-height:1.55;color:var(--dim);padding:4px 12px;border-top:1px solid var(--line);background:#000a}
.blog div:first-child{color:var(--ink)}
.bctrl{display:flex;gap:8px;justify-content:center;padding:4px 8px calc(8px + env(safe-area-inset-bottom));background:#000a}
.dmg{position:absolute;left:50%;top:28%;transform:translate(-50%,0);font-weight:800;font-size:22px;color:#ff9b80;text-shadow:0 2px 6px #000;pointer-events:none;animation:up .8s ease-out forwards;z-index:5;white-space:nowrap}
.dmg.heal{color:#9be39b}.dmg.dot{color:#d6a0ff;font-size:17px;top:45%}
@keyframes up{to{transform:translate(-50%,-40px);opacity:0}}
.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}

.fx.cleave{background:linear-gradient(90deg,transparent 40%,#fff 49%,#ffd28c 51%,transparent 60%);animation:sweep .4s ease-out forwards}
@keyframes slash{from{transform:translate(-40%,-20%);opacity:1}to{transform:translate(40%,20%);opacity:0}}
@keyframes sweep{from{transform:translateX(-60%) skewX(-20deg);opacity:1}to{transform:translateX(60%) skewX(-20deg);opacity:0}}
.fx.fire{background:radial-gradient(circle at 50% 50%,#fff3c0 0,#ffb35c 18%,#c4574a 38%,transparent 62%);animation:burst .5s ease-out forwards}
.fx.ice{background:radial-gradient(circle at 50% 50%,#e8f6ff 0,#8fc3ff 22%,transparent 60%);animation:burst .45s ease-out forwards}
.fx.arrow{background:linear-gradient(90deg,transparent 30%,#ffe9c4 48%,transparent 52%);animation:slash .25s linear forwards}
.fx.poison{background:radial-gradient(circle at 50% 60%,#c6ff9a 0,#5aa04888 30%,transparent 65%);animation:burst .6s ease-out forwards}
.fx.shadow{background:radial-gradient(circle at 50% 50%,#000 0,#2a1a3acc 30%,transparent 65%);animation:burst .45s ease-out forwards}
.fx.thrust{background:linear-gradient(0deg,transparent 46%,#fff 50%,transparent 54%);animation:thrust .3s ease-out forwards}

.fx.shield{border:3px solid var(--gold);border-radius:10px;box-shadow:inset 0 0 18px #e2b56c,0 0 18px #e2b56c;animation:fade .7s ease-out forwards}
.fx.web{background:repeating-radial-gradient(circle at 50% 50%,transparent 0 10px,#ffffff55 11px 12px);animation:fade .6s ease-out forwards}
.fx.wax{background:radial-gradient(circle at 50% 30%,#ffd28c 0,#c47a3a66 35%,transparent 65%);animation:burst .6s ease-out forwards}
.fx.stun{background:radial-gradient(circle at 50% 20%,#fff59a 0,transparent 30%);animation:fade .6s forwards}
.fx.heal{background:radial-gradient(ellipse at 50% 100%,#9be39b55,transparent 70%);animation:fade .9s forwards}
.spark{position:absolute;bottom:0;width:6px;height:6px;border-radius:50%;background:#d4ffd8;box-shadow:0 0 8px #7fdc8f;animation:rise .9s ease-out forwards;pointer-events:none;z-index:4}
@keyframes rise{to{transform:translateY(-110px);opacity:0}}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes fade{from{opacity:1}to{opacity:0}}
.skillname{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:2px 10px;font-size:13px;z-index:6;animation:fade 1.1s ease-in forwards;white-space:nowrap}
.modal{position:absolute;inset:0;z-index:40;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:10px}
.modal.hide{display:none}
.box{width:100%;max-width:520px;max-height:86%;overflow:auto;background:linear-gradient(160deg,#241a12f5,#120d0af5);border:1px solid var(--gold);border-radius:14px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.box h2{margin:0 0 6px;color:var(--gold);font-size:18px}
.box .por{float:right;width:118px;height:158px;cursor:zoom-in;object-fit:cover;object-position:50% 18%;border-radius:10px;margin:0 0 6px 10px;border:1px solid var(--line)}
.box .phbig{float:right;width:70px;height:70px;border-radius:50%;margin:0 0 6px 10px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold);background:radial-gradient(#3a2c22,#120d0a);border:1px solid var(--line)}
.box p{font-size:13px;line-height:1.75;margin:5px 0}
.say{color:#f6dcc8}.note{font-size:11px!important;color:var(--dim)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hero{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;margin:6px 0;background:#0e0b08aa}
.hero img{width:64px;height:86px;object-fit:cover;object-position:50% 18%;border-radius:6px}
.hero .info{flex:1;min-width:0;font-size:12px;color:var(--dim)}.hero .info b{color:var(--ink);font-size:13px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:1px 6px;color:var(--gold);white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.slot{border:1px dashed var(--line);border-radius:8px;padding:6px;font-size:11px;min-height:54px;background:#0006;text-align:left}
.slot b{display:block;color:var(--gold);font-size:10px}
.skillsel{display:flex;flex-direction:column;gap:5px}
.sk{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;background:#0006;text-align:left}
.sk.on{border-color:var(--gold);background:#3a2a16aa}.sk.lock{opacity:.45}
.sk b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0;text-align:center;font-size:11px;color:var(--dim)}
.stats div{border:1px solid var(--line);border-radius:6px;padding:3px}.stats b{display:block;font-size:15px;color:var(--ink)}
.up{color:#9be39b}
.r1{color:#cfc6b6}.r2{color:#8fd18f}.r3{color:#8fbfff}.r4{color:#e2b56c}
.q{border-top:1px solid var(--line);padding:8px 0}.q:first-child{border-top:0}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#241a12f2;border:1px solid var(--gold);border-radius:10px;padding:7px 12px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}
.ally.hit .pic::after{content:"";position:absolute;inset:0;background:radial-gradient(#ff3a2a00 30%,#ff3a2acc);animation:fade .45s forwards;z-index:4;pointer-events:none}
.ally.shake{animation:hitshake .35s}
@keyframes hitshake{15%{transform:translate(-7px,2px) rotate(-2deg)}35%{transform:translate(6px,-2px) rotate(2deg)}55%{transform:translate(-4px,1px)}75%{transform:translate(3px,0)}}
.battle.quake{animation:quake .45s}

.dmg.crit{color:#ffd24a;font-size:28px;text-shadow:0 0 8px #c4574a,0 2px 6px #000}
.dmg.miss{color:#cfd8e6;font-size:16px}
.cell.el{color:#ffcf6b;text-shadow:0 0 8px #c4574a}.ch{color:#ff6b6b;text-shadow:0 0 10px #ff2a2a;font-weight:700}
.stats.s5{grid-template-columns:repeat(5,1fr)}
.box .por.sm{width:96px;height:128px}.hdpor{max-width:78%;max-height:46vh;border-radius:12px;border:1px solid var(--line);object-fit:contain;cursor:zoom-in;animation:vin .45s ease}.zoomv{position:fixed;inset:0;z-index:300;background:#000e;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:vin .25s ease}.zoomv img{max-width:96vw;max-height:94vh;object-fit:contain;border-radius:10px}.zoomable{cursor:zoom-in}
.hpt{font-size:11px}
.fx{--c:#fff}
.fx.shock{border-radius:50%;border:4px solid var(--c);box-shadow:0 0 22px var(--c),inset 0 0 22px var(--c);animation:ring .5s ease-out forwards;inset:20%}
@keyframes ring{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.fx.thrust{background:linear-gradient(0deg,transparent 46%,var(--c) 49%,#fff 50%,var(--c) 51%,transparent 54%)}
.fx.fireball{background:radial-gradient(circle at 50% 50%,#fff 0,var(--c) 14%,transparent 34%);animation:fly .45s ease-in forwards}
@keyframes fly{0%{transform:translate(0,90%) scale(.4);opacity:1}70%{transform:translate(0,0) scale(1);opacity:1}100%{transform:scale(2);opacity:0}}
.fx.arrowfly{background:linear-gradient(0deg,transparent 30%,var(--c) 30%,#fff 45%,transparent 46%);clip-path:polygon(48% 0,52% 0,52% 100%,48% 100%);animation:arrowup .35s ease-in forwards}
@keyframes arrowup{from{transform:translateY(100%);opacity:1}to{transform:translateY(-10%);opacity:0}}
.fx.potion{background:radial-gradient(circle at 50% 55%,var(--c) 0,transparent 45%);filter:blur(4px);animation:burst .6s ease-out forwards}

function mkSet(id,slot,T){const X=SETS[id];let it;if(X.parts){const sl=slot||pick(Object.keys(X.parts));it=genItem(id==='wanx'?X.t:Math.max(X.t,storyTier()),200,sl);it.atk=Math.round(it.atk*1.1);it.def=Math.round(it.def*1.1);if(sl==='o'&&it.ok!=='tome'){delete it.blk;it.def=0;it.at={int:X.t};it.ok='tome';it.pw=+(.04*X.t).toFixed(2)}it.r=Math.max(it.r,3);it.n=X.parts[sl]}else{const sl=slot||pick(['s','g','f','r','n']);it=genItem(T||1,75,sl);it.r=Math.max(it.r,1);it.n=X.n+'・'+it.n}it.set=id;return it}
function ownedParts(id){const all=[...S.bag,...S.heroes.flatMap(h=>Object.values(h.eq||{})),...(RUN?RUN.loot.gear:[])];return new Set(all.filter(it=>it&&it.set===id).map(it=>it.s))}
function setCount(eq){const c={};const seen={};for(const s of SLOTS){const it=eq[s];if(it&&it.set&&SETS[it.set]){const key=it.set+'|'+it.n;if(seen[key])continue;seen[key]=1;c[it.set]=(c[it.set]||0)+1}}return c}
function setLine(eq){const c=setCount(eq);const ks=Object.keys(c);if(!ks.length)return '';return '<div class="q">'+ks.map(k=>{const X=SETS[k],n=c[k],full=X.b6?6:X.parts?4:2;return `<b style="color:#7fe0c9">【${X.n}】${n}/${full}</b><br><span class="note" style="${n>=2?'color:#bfeee2':''}">2件：${X.b2}</span>${X.parts?`<br><span class="note" style="${n>=4?'color:#bfeee2':''}">4件：${X.b4}</span>`:''}${X.b6?`<br><span class="note" style="${n>=6?'color:#bfeee2':''}">6件：${X.b6}</span>`:''}`}).join('<br>')+'</div>'}

function mkUQ(id){const U=UQ[id];const sty=U.story||id.startsWith('kq_')||id==='fox';const it=genItem(sty?storyTier():Math.max(U.t,storyTier()),sty?0:200,U.s);if(sty)it.story=1;it.r=U.ep?4:3;if(U.ep){it.atk=Math.round(it.atk*1.25);it.def=Math.round(it.def*1.25);for(const k in it.at)it.at[k]+=2}it.n=U.n;it.uq=id;if(U.s==='o'){delete it.blk;it.def=0;it.at={int:U.t};it.ok='tome';it.pw=+(.04*U.t).toFixed(2)}if(id==='throat')ATR.forEach(k=>it.at[k]=(it.at[k]||0)+3);if(id==='weight')it.at.int=(it.at.int||0)+2;return it}

function gearDesc(it,sh){const p=[];if(it.atk)p.push('攻擊 +'+it.atk);if(it.def)p.push('防禦 +'+it.def);for(const k of ATR)if(it.at[k])p.push(ATN[k]+(it.at[k]>0?' +':' ')+it.at[k]);if(it.blk)p.push('格擋 '+Math.round(it.blk*100)+'%');if(it.pw)p.push('技能 +'+Math.round(it.pw*100)+'%');if(it.wk==='2h')p.push('佔用副手');if(it.wk==='dual')p.push('普攻 50% 打兩下・佔用副手');if(it.x)for(const k in XN)if(it.x[k])p.push(XN[k]+' +'+Math.round(it.x[k]*100)+'%');let t=p.join('・');if(it.uq&&UQ[it.uq]){t+=`<br><span class="uqd">✦ ${UQ[it.uq].d}</span>`;if(UQ[it.uq].lore&&!sh)t+=`<br><span class="lore">${UQ[it.uq].lore}</span>`}if(it.tem&&TEMPER[it.tem])t+=`<br><span class="uqd">◈ 淬煉・${TEMPER[it.tem][0]}：${TEMPER[it.tem][1]}</span>`;if(it.mem&&!sh)t+=`<br><span class="lore">${esc(it.mem)}</span>`;if(it.set&&SETS[it.set]){const X=SETS[it.set];t+=sh?`<br><span class="setd">【${X.n}】套裝</span>`:`<br><span class="setd">【${X.n}】2件：${X.b2}${X.parts?'／4件：'+X.b4:''}</span>`}return t}

function fixItem(o){if(!o)return null;if(o.s==='c')o.s='r';if(!ITYPES.includes(o.s))return null;const it={u:n0(o.u,0),s:o.s,t:Math.min(5,Math.max(1,n0(o.t,1))),r:Math.min(4,n0(o.r,0)),n:String(o.n||'舊物').slice(0,16),atk:Math.min(250,n0(o.atk,0)),def:Math.min(200,n0(o.def,0)),at:{}};for(const k of ATR)if(o.at&&o.at[k])it.at[k]=Math.max(-5,Math.min(40,Math.round(+o.at[k]||0)));if(WTN[o.wt])it.wt=o.wt;if(WKN[o.wk])it.wk=o.wk;if(OKN[o.ok])it.ok=o.ok;if(o.blk)it.blk=Math.min(.3,+o.blk||0);if(o.pw)it.pw=Math.min(.3,+o.pw||0);if(o.x&&typeof o.x==='object'){it.x={};for(const k in XN)if(o.x[k])it.x[k]=Math.min(.5,Math.max(0,+o.x[k]||0))}if(o.uq&&UQ[o.uq]){it.uq=o.uq;it.n=UQ[o.uq].n}if(o.set&&SETS[o.set])it.set=o.set;const e=Math.min(10,n0(o.e,0));if(e){it.e=e;if(o.e7)it.e7=1;if(o.b)it.b={atk:Math.min(250,n0(o.b.atk,0)),def:Math.min(200,n0(o.b.def,0))};if(ATR.includes(o.ea))it.ea=o.ea;if(XN[o.e5k]){it.e5k=o.e5k;it.e5v=Math.min(.3,+o.e5v||0)}if(XN[o.e8k]){it.e8k=o.e8k;it.e8v=Math.min(.3,+o.e8v||0)}if(XN[o.e10k]){it.e10k=o.e10k;it.e10v=Math.min(.4,+o.e10v||0)}}if(o.story)it.story=1;if(typeof o.mem==='string'&&ENH_MEM.includes(o.mem))it.mem=o.mem;if(['wick2','clapper','crowEye','rightLine','unsigned'].includes(o.tem))it.tem=o.tem;return it}

 leech:{name:'管線水蛭',g:'蛭',art:'m_widow',units:2,ntaunt:1,hp:4300,atk:315,def:14,spd:8,xp:150,pts:[12,18],drop:['seal',0,1],tint:'grayscale(.6) brightness(1.25) hue-rotate(160deg) contrast(1.1)',ev:{in:'頭頂滾燙的蒸汽管縫隙裡，滑下來幾條手臂粗、半透明的膠質水蛭。牠們肚子裡沒有血，反而塞滿了一團團從舊名牌上吸下來的黑墨字跡！',atk:'管線水蛭猛地彈射過來。吸盤大口不咬皮肉，而是死死貼在你們的盾牌紋章和公會徽章上，拼命抽吸上面刻著的名字筆畫！',hurt:'火光和利刃劃開水蛭滑膩的表皮，裡頭還沒消化的偏旁部首混著滾燙的蒸汽漏了出來。牠痛得劇烈蜷縮，吸盤再也貼不穩。',down:'最後一條水蛭被重重釘在石板上，身體像戳破的水袋一樣癟了下去，只剩下一灘帶著陳年墨臭味的白灰。',end:'你們用乾布擦掉徽章上的黏液。還好動手夠快，名牌上的刻字只被吸淡了一點點邊角。'}},
 dutyghost:{name:'停擺的值班員',g:'值',art:'m_scribe',units:1,ntaunt:1,hp:7500,atk:340,def:26,spd:5,xp:165,pts:[14,20],drop:['seal',1,1],tint:'grayscale(1) brightness(1.4) opacity(.85) contrast(1.1)',ev:{in:'走廊盡頭晃過兩道半透明的灰白職員殘影。他們手裡拎著早就鏽死的生鐵打卡鐘，嘴裡機械地唸叨著「遲到了、要扣薪水了」，一步步堵住了去路。',atk:'停擺的值班員舉起沉重的打卡鐘當頭砸下，同時伸出冰冷的虛影手指，硬把一張印著「曠職註銷」的紅單子往你們臉上貼！',hurt:'攻擊穿過值班員半透明的胸口，把他懷裡揣著的舊考勤表震碎了一半。他的身形一陣閃爍，連手裡的打卡鐘都拿不穩了。',down:'打卡鐘被一擊砸碎，值班員愣愣地看了一眼掉在地上的指針，像是終於等到了下班鈴聲，鬆了一口氣，化作白霧散去。',end:'地上只留下一張寫著二十年前日期的考勤卡。上面的「下班」欄，終於被你們替他補上了一個勾。'}},
 courier:{name:'蒸氣信差',g:'信',art:'m_skel',units:1,hp:40000,atk:235,def:20,spd:7,xp:900,pts:[180,180],drop:['seal',4,4],boss:1,tint:'sepia(1) saturate(2.2) hue-rotate(-15deg) contrast(1.25)',ev:{in:'沉重的鐵輪輾過石板，一具只剩上半身的巨大黃銅人偶，推著裝滿沸騰鍋爐的裝甲郵車衝了出來！牠胸口的擴音器大聲嘶吼：「早報——二十年前的加急早報！全村必讀，拒收違法！」',atk:'蒸氣信差猛推滾燙的郵車發起衝撞，同時雙手像風車一樣甩出幾十份邊緣鋒利如鐵片的二十年前舊報紙，鋪天蓋地地割向全隊！',hurt:'重擊砸裂了郵車後方的蒸汽鍋爐，高壓白煙呼嘯而出。蒸氣信差的一條黃銅手臂脫了臼，衝撞的速度頓時慢了一大截。',down:'胸口的核心齒輪箱被徹底貫穿。蒸氣信差推著郵車往前滑出兩步，顫抖著把最後一份發黃的舊報紙遞向半空，隨後「哐啷」一聲散架熄火。',end:'滾燙的蒸汽慢慢散盡。你們看了一眼掉在地上的舊報紙，頭版上的村莊新聞早已被水泡糊，只剩下一行「今日天氣晴朗」還認得出來。'}},
 clocktower:{name:'倒轉鐘塔',g:'鐘',art:'m_turtle',units:1,hp:44000,atk:260,def:24,spd:6,xp:1000,pts:[200,200],drop:['seal',4,4],boss:1,tint:'sepia(1) saturate(1.6) hue-rotate(10deg) brightness(.95) contrast(1.3)',ev:{in:'第十八層中央立著一座高達兩丈的六面黃銅鐘塔，六個鐘面的指針全部釘在同一個時刻。你們一靠近，鐘塔內部的巨型擒縱輪就猛然發出刺耳的倒轉摩擦聲！',atk:'「噹——！」倒轉鐘塔敲響一記震耳欲聾的逆時鐘鳴，六根巨大的黃銅長針像橫掃的長槍一樣逆時針狂轉，硬是把你們身上剛凝聚起來的加成和氣勢撥回原點！',hurt:'你們聯手斬斷了鐘塔外側的兩根主配重鐵鍊，三個鐘面的玻璃轟然炸裂。倒轉的指針卡在齒輪縫裡，發出令人牙酸的悲鳴。',down:'鐘塔最核心的擺錘被一擊轟斷，整座塔劇烈搖晃了三下。所有逆行的指針同時崩飛，龐大的塔身轟然坍塌成一座廢銅山。',end:'停滯了二十年的時間，終於不再往回拽人了。碎裂的鐘盤底下，通往第十九層總分揀室的大門緩緩打開。'}},
 qianhao:{name:'總分揀機・千號',g:'千',art:'b_wusign',units:1,hp:31000,atk:120,def:22,spd:6,xp:1600,pts:[320,320],drop:['seal',6,6],boss:1,tint:'sepia(1) saturate(2.4) hue-rotate(-20deg) brightness(1.05) contrast(1.3)',ev:{in:'震耳欲聾的蒸汽氣閥咆哮聲中，千號胸口上千個黃銅抽屜同時鎖死。數十隻從天花板垂下的巨型分揀鐵臂結成密不透風的金屬荊棘，把整座大廳徹底封鎖！',atk:'千號頂端的播音管念出一連串冰冷的門牌編號。數隻巨型分揀臂像攻城槌一樣從頭頂連續砸落，同時噴出滾燙的封蠟蒸汽和鎖名鐵鍊，想把隊員直接拖進牠胸口的抽屜牆裡！',hurt:'你們砍斷了千號正面過半的分揀臂，牠胸口的護甲板轟然剝落，露出被死死護在最中央的一卷老舊錄音蠟筒。唱針落了下來，播音管裡不再是冰冷的機器音，而是炸開了二十年前老站長帶著哭腔和喘息的錄音——「這裡是暮簡地底分站。全員撤離。千號，你留下。保管好每一個名字。不要讓下面的東西拿走。……對不起。」',down:'最後一記重擊貫穿了千號的主蒸汽爐芯。這台獨自運轉了二十年的機器沒有再反擊，牠甚至在倒下前，主動收回了差點砸中你們的斷臂。播音管冒出最後一縷白煙，傳出越來越輕的機械低語：「總分揀機……千號……最後回報：老站長……抽屜鎖不住了……對不起……我沒能……把大家的名字……留到明天……」',end:'千號胸口最後一盞微弱的黃銅燈暗了下去。成千上萬個抽屜在死寂中同時彈開，二十年的孤獨看守，就此落幕。'}},

 e_rat:{name:'抱蠟苔鼠群',g:'鼠',art:'m_rats',units:3,hp:110,atk:14,def:2,spd:7,xp:24,pts:[3,5],drop:['wax',1,1],ev:{in:'四五隻背上頂著滾燙蠟塊的苔鼠從石縫裡竄出，後頭跟著一頭渾身裹滿濕苔與碎石骨的護根獸，堵死了退路。',atk:'苔鼠群吱吱尖叫著跳起來咬向靴筒，護根獸甩動背上的燭苔，潑出一大片黏稠滾燙的酸蠟油！',hurt:'兵刃劈開護根獸的苔殼，綠汁與碎石四濺，幾隻苔鼠被震得翻滾出去，背上的蠟火暗了一大半。',down:'最後一記重擊砸碎了護根獸的石殼核心，牠發出一聲沉悶的落石響動縮成一團，剩下的苔鼠一哄而散。',end:'戰場安靜下來。你們撿起盒蓋被砸扁一角的鐵飯盒，裡頭的燭淚蠟和骨片還能拿回去交差。'}},
 e_crab:{name:'盲眼啃骨蟹',g:'蟹',art:'m_turtle',units:2,hp:420,atk:16,def:10,spd:3,xp:30,pts:[3,6],drop:['bone',2,3],tint:'hue-rotate(-30deg) saturate(.5) brightness(1.1)',ev:{in:'兩隻磨盤大小的灰白石蟹從暗渠水底立起身子，殼上長滿鈣化骨刺，大螯一張一合擋在石階中央。',atk:'啃骨蟹貼著濕滑的石階橫向猛衝，碗口大的石螯像攻城剪一樣夾向你們的小腿骨！',hurt:'重擊砸在堅硬的背殼上，震落大片白色骨粉與苔絨。牠吐出一串腥臭的水泡，橫爬的速度慢了下來。',down:'關節處一記精準穿刺，啃骨蟹龐大的身軀翻倒在淺水裡，幾條石腿抽搐兩下便僵硬了。',end:'暗渠的水開始往上漲。你們撈起郵差包和螃蟹掉下的硬骨片，退回乾燥的高處。'}},
 e_worm:{name:'護墨書蠹',g:'蠹',art:'m_moth',units:3,hp:260,atk:24,def:3,spd:6,xp:34,pts:[3,6],drop:['ink',1,2],tint:'grayscale(.7) brightness(.85)',ev:{in:'無數寫滿錯字的廢紙條捲成三條灰白的巨大書蟲，口器是生鏽的鐵書釘與斷筆尖拼成的，身後拖著長長的墨跡。',atk:'書蠹猛地彈起前半截身子，張開鐵釘口器咬向護腕，同時噴出一股能糊住眼睛的濃稠黑墨！',hurt:'刀劍斬斷書蠹身上的紙環，腥臭的老墨水混著碎紙片灑了一地，牠痛得扭成一團，身形縮小了一圈。',down:'最後一擊把核心處的舊書脊劈成兩半，書蠹發出紙張撕裂的脆響，散成滿地不會動的廢紙屑。',end:'抄寫台上的禿毛筆已經斷成兩截。你們把硯台裡剩下的墨刮進瓶子，甩掉刀上的墨漬繼續趕路。'}},
 e_dog:{name:'巡廊退件犬',g:'犬',art:'m_hyena',units:3,hp:300,atk:26,def:4,spd:9,xp:36,pts:[4,7],drop:['bone',2,2],tint:'sepia(.6) saturate(1.4) hue-rotate(-20deg)',ev:{in:'渾身纏滿紅白封條的紙骨獵犬弓起背脊，書霧裡又鑽出兩隻叼著爛信封的同類，呈品字形包圍了隊伍。',atk:'退件犬如離弦之箭撲上來，滿嘴生鏽的封箱鐵釘咬向前臂，身上的長封條像鞭子一樣抽向後排！',hurt:'利刃劈開牠硬紙板與枯骨拼成的前胸，陳年退件信嘩啦啦散落一地。牠低吼一聲，動作慢了半拍。',down:'脖子上的主封條被徹底撕裂，退件犬像漏了氣的紙紮偶般癟了下去，散成一堆碎骨與廢紙。',end:'你們把碎紙踢開，拆開那封搶來的催租單。裡頭除了廢紙，還夾著一小塊凝固的書霧墨與半截舊鑰匙坯。'}},
 e_shade:{name:'尋字褪名影',g:'褪',art:'m_skel',units:3,hp:520,atk:40,def:8,spd:5,xp:50,pts:[5,9],drop:['bone',2,3],tint:'grayscale(1) brightness(1.4) opacity(.8)',ev:{in:'摔碎的石碑周圍捲起一陣冰冷的灰風，三道沒有五官、手指長滿鋒利石片的褪名影從紙灰中拔地而起！',atk:'褪名影不顧死活地撲向你們胸口的渡鴉徽章，想用石片指甲把刻在鐵片上的名字硬摳下來！',hurt:'帶著火光的兵刃劈開褪名影的胸膛，飛出一團團沒有字跡的白灰。牠發出漏風般的嘶吼，撲擊弱了下去。',down:'最後一道褪名影被轟碎了凝聚核心，不甘心地抓了一把空氣，散作一地冰涼的石粉與白灰。',end:'你們踩熄地上亂飄的紙灰，從碎石碑底座下翻出一點骨片與陳年墨塊。'}},
 e_crow:{name:'缺字紙鴉群',g:'鴉',art:'v_bird',units:3,hp:480,atk:42,def:5,spd:10,xp:54,pts:[6,10],drop:['ink',2,3],tint:'brightness(.75) contrast(1.2)',ev:{in:'五六隻翼展超過一米、羽毛是鋒利硬紙片的缺字紙鴉從穹頂俯衝而下，捲起一陣夾著黑墨的狂風！',atk:'紙鴉群在半空盤旋疾掠，用沾滿腐蝕古墨的鐵喙猛啄握著郵袋的手臂，紙羽像飛刀般成片射落！',hurt:'火光與利刃斬落大片黑色紙羽，被砍中的紙鴉在空中翻滾，流出的不是血，而是發臭的黑墨汁。',down:'領頭那隻最大的紙鴉被一擊釘死在石柱上，整群同時發出刺耳的悲鳴，化作漫天破碎的空白紙片。',end:'纏在手腕上的空白信封都變成了死紙。你們抖開郵袋，把裡頭的書霧墨、骨片與舊徽章碎片收進行囊。'}},

const EVB={"gate": {"in": "地址之門前，成百上千頁泛黃的舊戶籍冊從地面和穹頂同時掀開。紙頁之間，無數張看不見臉的嘴整齊列隊，幾十道男女老少重疊的嗓音一起翻開了點名簿：「一戶一冊，對不上姓氏的人，不準過這扇門！」", "atk": "合唱體齊聲唱出一段走調卻震耳欲聾的點名曲。漫天的戶籍殘頁像刀片一樣捲過來，想把你們胸口名牌上的筆畫硬生生拆開，重組進牠們錯亂的家譜裡！", "hurt": "你們撕開了合唱體最外層的空白書皮。原本整齊的點名聲一下子亂了拍子，好幾道聲音開始互相爭吵：「你唱錯行了！那個偏旁不是我們家的！」", "down": "最中央那本厚重的總戶籍冊被一擊劈開書脊，幾十道嗓音同時停在最後一個音節上，發出一聲如釋重負的長嘆：「……點名完畢，全數放行。」漫天紙頁像雪一樣，安安靜靜地落回地面。", "end": "散落的戶籍紙頁在門前鋪成一條白路，再也沒有聲音攔著你們。"}, "tkeeper": {"in": "沉重的石盤摩擦聲在迴廊裡迴盪。一尊背著巨大青石日晷的佝僂怪影慢慢轉過身。牠背上的銅晷針正逆著光影瘋狂倒轉，連周圍飄落的灰塵，都被拽著往天上飛！", "atk": "守時者猛然壓低背上的日晷，倒轉的晷針投出一道冰冷的扇形暗影橫掃全場。被影子掃過的傷口和步伐，被硬生生往回拖！", "hurt": "重擊在日晷盤面上砸出一道貫穿子午線的裂痕。倒走的銅針卡在裂縫裡劇烈顫抖，守時者發出齒輪崩牙一樣的刺耳嘶鳴。", "down": "倒轉的銅晷針被硬生生折斷，背上的石盤轟然碎成十二塊。牠伸手想去抓地上漏走的影子，卻連同自己的身體一起，化成了定格的石粉。", "end": "碎掉的日晷不再倒轉，迴廊裡停住的空氣，重新開始往前流。"}, "emptypost": {"in": "迴廊中央，筆直地站著一套深綠色的舊郵差制服。領口上方空蕩蕩的，沒有頭；袖管裡也沒有手。胸口原本縫著名字的布條，被撕得只剩幾根白線頭。只有肩上那只空帆布郵袋，被看不見的骨架撐得鼓鼓的。", "atk": "空制服邁開無聲的步子，兩隻空袖管像長鞭一樣抽過來，同時把肩上沉重的郵袋掄圓了當頭罩下——想把活人也當成漏寄的信，塞進袋底！", "hurt": "刀刃劃開了制服的前襟。裡面沒有流出一滴血，只有一團團褪了色的舊郵戳印記和冷風從破口漏出來。整套制服晃了兩晃，像被風吹皺的空布袋。", "down": "最後一擊挑斷了掛在空肩膀上的郵袋皮扣。少了郵袋的重量，那套硬撐著站著的制服一下子沒了力氣，輕飄飄地垂落在地，像一件終於被人換下來、疊好的舊衣裳。", "end": "地上只剩一套乾乾淨淨、沒有主人的空制服。你們把散在旁邊的郵戳收起來，繞過那件衣服，繼續往前走。"}};for(const k in EVB)FOES[k].ev=EVB[k];

const DLG={"A01_MEET_01":["「擦乾鞋底再進來，別把外頭的泥帶到地板上。……你就是今天來報到的新人？表格在右手邊，名字寫清楚，別連自己的姓都塗得認不出來。寫完去領徽章，暮簡村不養閒人，但只要按規矩辦事，總有你一口熱飯吃。」","頭也沒抬地用指甲刮掉桌角乾掉的封蠟，直到說完前半句才掀起眼皮，目光在玩家臉上停了兩秒，隨即把一枚鐵質徽章推過桌面。"],"A01_MEET_02":["「這鐘點才到？我還以為你半路改行去餵林子裡的野狗了。行了，先把濕斗篷掛門後，別滴在我的帳本上。徽章拿去，今晚先認清床位跟找幾個靠得住的搭檔，有什麼本事，明早下地窖再拿出來看。」","正準備吹熄桌上的矮油燈，聽見開門聲後動作一頓，皺著眉頭重新把燈芯撥亮，順手從抽屜底層摸出備用徽章扔在桌上。"],"A01_IDLE_01":["「公會配發的火絨受潮了，這兩天領物資時自己留個心眼，挑壓在箱子底下那批拿。」","用指節敲了敲木桌邊緣，眼神示意角落的補給木箱。"],"A01_IDLE_02":["「地窖頭幾層的濕苔滑得很，鞋底磨平了就去鎮上補，別省那幾枚銅板，摔斷腿更花錢。」","低頭翻閱損耗紀錄，手裡的炭筆在紙上重重畫了一道槓。"],"A01_IDLE_03":["「許茉那丫頭要是把你的委託單釘歪了，自己跟她說，別拿來煩我。她心不壞，就是手比腦子急。」","揉了揉眉心，朝櫃檯方向努了努下巴，語氣裡聽不出什麼真火氣。"],"A01_IDLE_04":["「餓了就去老陳那裡叫碗熱湯，別在站裡啃乾糧掉一地渣。記自己帳上，別想報公帳。」","吹開帳冊上的灰塵，眼皮都沒抬一下。"],"A01_IDLE_05":["「余巷那小子不在，村裡好幾條舊線的雜活都堆著。……算了，跟你這剛來的人提這個也沒用。」","視線掃過牆角一只蒙灰的舊郵袋，停頓半秒後收回目光，把桌上的印章擺正。"],"A01_IDLE_06":["「地底撿上來的東西，該交公的交公，該銷毀的別私藏。有些舊紙片看多了，晚上睡不踏實。」","雙手抱胸靠在椅背上，盯著玩家的背包看了一眼。"],"A01_IDLE_07":["「一到陰天左邊肩膀就發酸。你要是趁年輕不多穿件內襯，再過二十年就知道是什麼滋味了。」","單手按住左肩轉了兩圈，發出一聲極輕的骨頭悶響。"],"A01_IDLE_08":["「偶爾會有穿黑羽兜帽的人在站外落腳，別去套近乎，也別攔著。人家的事不歸地方站管。」","壓低了點聲音，順手把窗縫拉掩上大半。"],"A01_QUEST_DONE_01":["「單子給我看一眼。……行，字跡和印記都對，沒弄出多餘的亂子。報酬去找許茉領。」","接過委託單對著光看了一遍，乾脆利落地蓋下核准章。"],"A01_QUEST_DONE_02":["「比我預想的快了半天。看來你招的那幾個隊友還算管用，拿了錢分一分，別讓人家白出力。」","稍微挑起一邊眉毛，把核銷單放進左側木盒，嘴角幾不可察地鬆動了一點。"],"A01_QUEST_DONE_03":["「村裡人有時候就是愛鑽牛角尖，你能耐著性子辦完，算你有本事。去歇著吧，今天別再接粗活了。」","合上登記簿，端起桌上的粗陶冷水杯喝了一口。"],"A01_RETURN_01":["「把血擦乾淨再喘氣，後頭木櫃第二格有止血粉。地窖不會長腳跑掉，命只有一條，下次再硬撐著不撤退，我就扣你半個月的派單。」","猛地站起身，從櫃子裡抓出一罐藥粉重重拍在桌上，臉色鐵青但動作沒有半點遲疑。"],"A01_RETURN_02":["「回來了？去火爐邊烤烤手，把地底那股冷苔味烘掉。人數和裝備清點完，沒少東西就去吃飯。」","抬頭往玩家身後的隊伍掃視一圈，在心裡默數完人數後才重新坐回原位。"],"A01_CH1_END_01":["「那本舊站籍我鎖進鐵匣子了。紙上的字能褪掉，但那個缺口還在，誰也別想拿句『沒這個人』就把我糊弄過去。」","手指按在桌下上鎖的抽屜位置，眼神沉得像結了冰的井水。"],"A01_CH1_END_02":["「別在許茉面前硬提那個名字，她記不起來只會自己跟自己過不去。……你手裡那些舊信和徽章收好，那是唯一不會跟著犯糊塗的東西。」","看了一眼正在整理櫃檯的許茉，聲音壓得極低，從煙盒裡抽出一根乾草梗咬在齒間卻沒點燃。"],"A01_CH1_END_03":["「桑沐那老頭子嘴上總說沒事，心裡比誰都清楚舊地圖動過手腳。去查可以，手腳放乾淨點，別把整個村子都驚動了。」","將一張邊角磨損的村莊草圖往玩家面前推了半寸，隨即又用鎮紙壓住一角。"],"A01_REACT_FRIENDLY_01":["「少來這套。有空關心我的老骨頭，不如把你自己的刀磨利一點。……不過，那壺熱茶放著吧，我晚點喝。」","不自在地偏過頭咳了一聲，把桌上的文件撥開一小塊空位。"],"A01_REACT_FRIENDLY_02":["「還算有點眼力見。這幾捆舊報表幫我搬去後頭倉庫，放最上面那層，別讓老鼠啃了。」","緊繃的肩膀稍微放平，眼角的皺紋舒展開一點。"],"A01_REACT_COLD_01":["「話少好，省得浪費口水。單子拿了就走，天黑前記得回來銷帳。」","毫不在意地點了點頭，立刻低頭繼續批閱手頭的公文。"],"A01_REACT_COLD_02":["「我不問你的私事，你也別誤了公會的差事。咱們就按這個規矩處，誰也不累。」","把羽毛筆插回墨水瓶，做了一個送客的手勢。"],"A01_REACT_RUDE_01":["「把你剛才那句話嚥回去。在暮簡村，沒人慣著你這身臭毛病，想耍威風，去地窖底下跟石頭耍。」","手掌「啪」一聲按在桌面上，眼神冷厲地直視玩家，連周圍的空氣都沉了下來。"],"A01_REACT_RUDE_02":["「嫌這裡廟小？大門在後面，徽章留下你隨時能走。但只要你還掛著渡鴉的名字，就給我把嘴巴放乾淨點。」","冷笑一聲，抱起手臂往後一靠，半點退讓的意思都沒有。"],"A02_MEET_01":["「啊、等等！別踩到地上那張——呼，還好只是去年的舊公告！你好，我是許茉，負責委託登記跟後勤核銷！柏燼叔說話比較兇，但其實他人很好的。來，這裡簽個名，從今天起你的委託單和報酬都歸我管啦！」","手忙腳亂地彎腰撿起滑落櫃檯的紙張，起身時差點撞到桌角，揉著額頭對玩家露出一個又急又燦爛的笑容。"],"A02_MEET_02":["「咦？你是新來的冒險者？歡迎來到暮簡村！……啊，不對，我這個人真是的，還沒拿到柏燼叔的核准章不能先建檔！我是許茉，你先去裡面那張大桌子找站長報到，我先把你的空白檔案袋準備好，快去快回喔！」","原本已經拿起沾水筆準備紀錄，看見玩家兩手空空才猛然拍了一下自己的臉頰，吐了吐舌頭指向柏燼叔的方向。"],"A02_IDLE_01":["「今天有幾張新貼上去的單子，我用紅線標了緊急程度。喔對了，千萬別接錯行，上禮拜有人把找貓跟清地窖看反了！」","踮起腳尖把委託板最上方的一枚圖釘按緊，轉過身來拍了拍手上的木屑。"],"A02_IDLE_02":["「陳大叔今天熬了加了白蘿蔔的骨頭湯，香味一直從街角飄進來……可惡，要不是還沒到換班時間，我現在就拿木碗衝過去了。」","用力吸了吸鼻子，雙手捧著臉頰趴在櫃檯上，眼神充滿怨念地望向大門。"],"A02_IDLE_03":["「余巷哥已經三個月沒消息了……他的郵差格我每天都有幫忙擦乾淨，總覺得要是積了灰塵，他回來看到一定會笑我偷懶。」","拿著抹布的手停在半空，轉頭看向櫃檯後方標著『余巷』的木格，神情有些落寞。"],"A02_IDLE_04":["「桑沐村長早上又來問了一圈地窖的動靜，走的時候一直搓著手說『沒事的、沒事的』。每次他這樣講，我心裡反而更毛耶……」","模仿著村長搓手的動作，縮了縮脖子，小聲地跟玩家咬耳朵。"],"A02_IDLE_05":["「奇怪，今天早上開門的時候，櫃檯上又多了一盞摺得很工整的紙燈，旁邊的備忘錄角落還有一枚像狐狸尾巴的墨點……到底是誰半夜進來幫忙整理帳目的呀？」","舉起一張字跡工整卻帶著俏皮墨漬的便條紙，歪著腦袋左看左看，滿臉困惑。"],"A02_IDLE_06":["「聽說地窖再往下走，會有像霧一樣的書頁飄來飄去。要是看到上面寫著奇怪的名字，千萬別大聲唸出來喔！」","食指抵在嘴唇上做了一個「噓」的動作，眼睛睜得圓圓的。"],"A02_IDLE_07":["「三百銅板加七百五、再扣掉兩份口糧折算的公會積分……唔，別跟我說話，我剛才算到哪裡去了啦！」","手指在算盤上撥得啪啪作響，一抬頭看到玩家，瞬間忘記數字，抓著頭髮發出一聲哀號。"],"A02_IDLE_08":["「最近雨水特別多，村子外圍那幾塊木頭路牌都泡得發脹了。有些字跡糊得連我都快認不出來，得找時間讓人去修一修才行。」","望著窗外屋簷滴落的水珠，手指無意識地在桌面上描繪著筆畫。"],"A02_QUEST_DONE_01":["「辛苦啦！我就知道這件委託交給你準沒錯！來，這是你的報酬，我算過兩遍了，這次絕對沒有少給！」","雙手捧著裝有報酬的小布袋遞過來，眼睛彎成兩道月牙，像是在等待誇獎。"],"A02_QUEST_DONE_02":["「剛才委託人特地跑來櫃檯誇了你一頓呢！連柏燼叔聽了都沒皺眉頭——這在我們站裡已經算是最高讚美了喔！」","一邊在登記簿上畫下一顆小小的星星記號，一邊壓低聲音興奮地對玩家比了個大拇指。"],"A02_QUEST_DONE_03":["「今天已經蓋了第三個完成章了！你跟隊友們要不要先歇一會兒？我這裡有剛泡好的薄荷茶，雖然茶葉碎了點，但很解乏的！」","熟練地蓋下印章後，轉身從櫃檯下方端出幾只粗陶茶杯推到玩家面前。"],"A02_RETURN_01":["「天啊、怎麼流了這麼多血！快坐下別動，我馬上去拿乾淨的布和熱水——報表什麼的明天再填就好，人平安回來才是最重要的！」","臉色瞬間煞白，連手裡的羽毛筆掉在地上都顧不上撿，慌慌張張地掀開櫃檯木板衝出來扶人。"],"A02_RETURN_02":["「歡迎回來！聽見門響我就知道是你們。地底下很冷吧？火爐我剛剛才添過柴，快去暖和一下！」","原本正對著門口張望，一見到玩家的身影立刻鬆了口氣，臉上重新浮現明亮的笑意。"],"A02_CH1_END_01":["「咦？後面那個空木格嗎？奇怪……我每天都會順手擦一遍，但那裡以前有放過誰的東西嗎？大概是我記錯了吧，哈哈……」","拿著抹布擦拭原本屬於余巷的木格，手指在空白的名牌框上停頓了一下，露出有些迷茫卻又很快被自己帶過去的微笑。"],"A02_CH1_END_02":["「『簷下路九號』？村子裡從來沒有這條路呀。不過……這兩天我對帳的時候，總覺得好像少算了一個人的份，算盤怎麼撥都不對勁，頭好痛喔……」","皺著眉頭翻看手邊的舊名冊，手指按著太陽穴，神情裡帶著一股說不出的焦躁與困惑。"],"A02_CH1_END_03":["「你跟柏燼叔最近看我的眼神都怪怪的，是不是我又把哪份文件弄丟了？如果我真的忘了什麼重要的事……你一定要提醒我喔，別讓我一個人蒙在鼓裡。」","雙手扒著櫃檯邊緣，微微仰起臉看著玩家，語氣裡帶著一絲小心翼翼的不安。"],"A02_REACT_FRIENDLY_01":["「嘿嘿，真的嗎？我也覺得我今天沒有把印泥蓋反很厲害！下次有報酬豐厚的好差事，我一定第一個留給你！」","臉頰微微泛紅，開心地把懷裡的登記板抱緊，連說話的尾音都跟著揚了起來。"],"A02_REACT_FRIENDLY_02":["「這點忙算不上什麼啦！只要看到大家平平安安從地窖走出來，我就算抄十本帳冊都不覺得累。」","用力搖了搖頭，眼神清澈而認真地望著玩家。"],"A02_REACT_COLD_01":["「啊、好的！對不起，我不該拉著你多嘴……這是你的單據，請收好。」","笑容稍微收斂，連忙低頭加快手上的蓋章速度，雙手規規矩矩地把單據遞出。"],"A02_REACT_COLD_02":["「嗯，我知道你們下地窖的人都很累，不想說話也沒關係。有需要幫忙的地方，隨時叫我就好。」","安靜地退開半步，替玩家留出空間，眼神裡依然帶著溫和的體諒。"],"A02_REACT_RUDE_01":["「我、我知道我有時候動作慢了點，但每一筆登記我都有認真核對！你就算生氣，也不能這樣糟蹋人家的心意……」","眼眶一下子紅了，手指死死捏著衣角，雖然聲音有些發抖，卻還是倔強地沒有掉眼淚。"],"A02_REACT_RUDE_02":["「……手續已經辦完了。如果你對地方站的窗口有意見，請直接去找柏燼叔申訴，我還有別的公文要處理。」","深吸了一口氣，把桌上的紙筆全部收進抽屜鎖好，抿緊嘴唇別過頭去不再看玩家。"],"A03_MEET_01":["「買乾糧往左邊貨架挑，喝湯找張空桌子坐，別擋在門口把冷風放進來。……瞧你領口別著新徽章，柏燼那邊剛收的新人吧？叫我老陳就行。先說好，我這店裡小本生意，公會那幫小子誰來都不給賒帳，但你要是點碗熱湯，蘿蔔可以多給你杓兩塊。」","手裡握著一塊洗得發白的麻布，頭也不抬地把一只玻璃杯擦得吱吱作響，直到把杯子舉到光下檢查完沒有水漬，才往吧檯上一放，朝裡頭的木桌抬了抬下巴。"],"A03_IDLE_01":["「杯子不擦乾，倒進去的麥酒就會帶股水腥味。這人呐，日子過得再糙，吃進嘴裡的東西也得講究個乾淨。」",""],"A03_IDLE_02":["「許茉那丫頭每次來都盯著鍋底的軟骨看。我故意留了兩塊在底下，你待會兒要是回站裡，別跟她說是我特地留的，省得她又大驚小怪。」",""],"A03_MEET_02":["「喲，這不是地方站新來的面孔嗎？外頭濕氣重，先把武器解下來靠牆放，別磕壞了我剛上過油的桌角。這鐘點大鍋裡還溫著骨頭湯，看你是剛開工要墊肚子，還是下完地窖上來緩口氣？坐吧，第一碗湯算我給你接風，加不加蔥花自己吭聲。」","正用長柄木杓在冒著白煙的鐵鍋裡攪拌，聽見門鈴響，隔著水蒸氣打量了玩家一眼，順手把擦杯布搭上肩膀，拎起一只厚實的粗陶碗。"],"A03_IDLE_03":["「柏燼那老傢伙又拿冷水配乾餅了吧？他那胃就是年輕時在底下落下的毛病，偏偏嘴硬得很，誰勸都當耳邊風。」",""],"A03_IDLE_04":["「這幾天下雨路滑，外頭拉鹽巴和麥粉的馬車晚了兩天。雜貨架上的粗鹽剩不多，你要是常在野外生火，先買兩包備著。」",""],"A03_IDLE_05":["「余巷那小子以前跑完早班郵路，總愛坐在靠門那張位子上，一口氣喝光一整碗辣肉湯。這都三個月了，那罐辣油我都還沒換新的。」",""],"A03_IDLE_06":["「桑沐村長這陣子買安神草買得勤，嘴裡老唸叨著『沒事的』，結果給錢的時候手抖得把銅板撒了一地。當村長的，心事重啊。」",""],"A03_IDLE_07":["「前天打烊收桌子的時候，角落那桌留了一枚壓在酒杯底下的黑羽毛，帳倒是結得分毫不差。這村子偶爾就是會有這種來無影去無蹤的怪客。」",""],"A03_IDLE_08":["「我不管地窖底下藏著什麼老古董，只要你們這幫人推開我這扇門，就得按活人的規矩好好吃飯。天塌下來，也得等把碗裡的湯喝完再說。」",""],"A03_QUEST_DONE_01":["「辦得漂亮！我就看你這人手腳俐落，不是那種只會耍嘴皮子的生瓜蛋子。來，這碗剛出鍋的燉肉算我請的，趁熱吃！」",""],"A03_QUEST_DONE_02":["「這下我心裡那塊大石頭總算落了地。做生意最怕帳目不清不楚，你幫了我個大忙，以後買乾糧跟火油，我都給你按熟客價算。」",""],"A03_QUEST_DONE_03":["「聽站裡的人說你今天立了功？行啊，年輕人有拚勁是好事。今晚別喝冷水了，我給你溫半壺甜麥酒，解解身上的乏氣。」",""],"A03_RETURN_01":["「嘖，怎麼弄成這副鬼樣子回來！別往酒桌湊了，去火爐邊那張鋪了厚毯子的長椅坐著！我給你切兩片老薑熬紅糖水，先把身子骨暖過來再說！」",""],"A03_RETURN_02":["「一身的地底潮氣，聞著就知道剛從下面上來。快坐下吧，大鍋裡的湯一直溫著呢，喝兩口把肚子裡的寒氣逼出來。」",""],"A03_CH1_END_01":["「奇怪……我這吧檯上怎麼單獨擺著一罐紅椒辣油？村裡人都嫌這味兒太嗆，平時到底是有誰常來點辣肉湯來著……怎麼偏偏想不起來呢？」",""],"A03_CH1_END_02":["「帳本上確實記著有幾筆外送的熱湯沒結清，上頭寫的地址……怪了，這是我自己寫的字沒錯，可咱們村裡哪有這條街？難道是我前陣子老眼昏花記錯了？」",""],"A03_CH1_END_03":["「最近大夥兒來店裡吃飯，話都變少了，有時候聊著聊著還會突然卡殼。……算了，不想那些邪門事，不管忘記啥，人總不能忘了吃飯。來，碗拿穩。」",""],"A03_REACT_FRIENDLY_01":["「哈哈，算你嘴刁識貨！這鍋湯我可是天沒亮就起來守著火熬的。愛喝就多喝點，鍋裡管夠！」",""],"A03_REACT_FRIENDLY_02":["「有心啦。你們在外頭出生入死比我累多了，坐著歇你的就行。這碟滷豆乾是剛出鍋的，拿去配酒吃。」",""],"A03_REACT_COLD_01":["「行，乾脆點好。乾糧三包、火油兩瓶，都在這兒了，銅板放桌上就行。」",""],"A03_REACT_COLD_02":["「不想說話就安安靜靜吃你的飯，我這店裡不講究應酬。有事需要添水自己敲敲碗。」",""],"A03_REACT_RUDE_01":["「嫌我這兒的湯水不合胃口？那你可找錯地方撒野了。我老陳開門做生意講究和氣，但誰要是敢在店裡砸場子，我這根擀麵棍可不認得什麼公會徽章。」",""],"A03_REACT_RUDE_02":["「今兒個我不做你這筆買賣了，把你的銅板收回去，門在那邊，慢走不送。等哪天學會怎麼跟活人好好說話再進來。」",""],"A04_MEET_01":["「喔、喔！你就是柏燼站長提過的那位新來的冒險者吧？歡迎、歡迎來到暮簡村！我是這裡的村長桑沐。咱們村子雖然靠著那個……呃，靠著地窖，但平時還是很安寧的，對，沒事的，什麼大事都沒有！你平時在村裡走動，按著新發的村莊地圖走就成了，老舊的偏僻角落路不好，就別去費心啦。」",""],"A04_IDLE_01":["「今天村裡也是順順當當的。東頭老李家的雞找回來了，西頭的屋頂也補好了……嗯，沒事的，這樣就很好。」",""],"A04_MEET_02":["「哎呀，嚇我一跳……原來是地方站新來的年輕人啊。沒事的、沒事的，我只是出來看看街燈點上了沒有。我是村長桑沐，你們公會的人願意駐守在暮簡村，大夥兒心裡都踏實得很。只要地面上的日子平平順順，地底下的動靜……咱們少去招惹，總會沒事的，你說是不是？」","原本正對著一塊模糊的路牌發呆，聽見腳步聲猛地縮了下肩膀，轉過身後連忙搓著手掌乾笑兩聲，額角還帶著細汗。"],"A04_IDLE_02":["「村公所前陣子剛換了新版地圖，畫得又清楚又好看。以前那些沒人住的廢棄小巷子，留著也是讓人看了心慌，塗掉重畫乾乾淨淨的，多好。」",""],"A04_IDLE_03":["「柏燼站長是個嘴硬心軟的實誠人，有他在地方站坐鎮，我這把老骨頭晚上才睡得著覺……雖然他每次看我的眼神都像能把人看穿似的。」",""],"A04_IDLE_04":["「余巷那孩子……唉，年輕人腿腳快，說不定只是去外鎮送急件耽擱了。沒事的，等過陣子天放晴了，人自然就回來了，別在村裡亂傳讓人心慌的話啊。」",""],"A04_IDLE_05":["「這雨再下下去，村尾那幾塊老木牌都要爛透了。爛了也好、爛了也好，換上新木頭，省得大家看著舊字又想起以前那些不痛快的事。」",""],"A04_IDLE_06":["「老陳的酒館熱鬧點好啊。大家聚在一塊兒喝碗熱湯、聊聊柴米油鹽，就不會去胡思亂想地底下的怪事了。」",""],"A04_IDLE_07":["「夢途驛那邊的蘇眠砂姑娘，平時話不多，但看那些怪信的本事連我都摸不透。要是真遇到什麼邪門的信件……你悄悄拿去給她看就好，千萬別在街上張揚。」",""],"A04_IDLE_08":["「前幾晚我忘了鎖村公所的窗戶，隔天桌上居然多了一盞白紙燈，舊地圖缺角的旁邊還落了一枚像狐狸尾巴似的墨點……沒事的、肯定是哪個孩子惡作劇，對吧？」",""],"A04_QUEST_DONE_01":["「哎呀，太感謝你了！我就說嘛，只要有你們渡鴉公會幫忙，什麼小風小浪都能平息下去。沒事了、這下大夥兒都能安心過日子了！」",""],"A04_QUEST_DONE_02":["「這件事你辦得真穩妥，街坊鄰居一點風聲都沒聽見。當村長的沒別的盼頭，就盼著大家別受驚嚇，這份人情我記在心裡了。」",""],"A04_QUEST_DONE_03":["「現在村裡人提起你，個個都豎大拇指呢。有你在暮簡村跑動，連我這幾晚喝安神茶的次數都少了一半，真是辛苦你啦。」",""],"A04_RETURN_01":["「老天爺啊，怎麼傷成這樣！快、快走後巷回地方站去，別讓街上的孩子們瞧見了嚇著……啊，我不是嫌棄你們，我是怕、怕大家心裡發毛！這是村公所備著的草藥，你快拿去敷上！」",""],"A04_RETURN_02":["「上來了？人齊全就好、人齊全就好！底下沒什麼會跑上來的怪東西吧？嗯，沒事的、沒事的，快去老陳那裡喝碗熱湯暖暖身子吧。」",""],"A04_CH1_END_01":["「我當初……我當初只是讓人把新版地圖上的舊路名塗掉而已啊！我只是怕大家老想著那邊沒人住的空房子會害怕……我真的不知道為什麼連整個人的名字都會不見、連我自己都快想不起他的臉了……」",""],"A04_CH1_END_02":["「沒事的……不，我騙不了你，這次真的有事了。當初被我收起來的舊地圖底稿，就壓在村公所書櫃最底下的暗格裡。你要查就拿去吧，是我老糊塗，以為把眼睛閉上就什麼都不會發生。」",""],"A04_CH1_END_03":["「你看大夥兒現在笑得多輕鬆，一點都不記得少了一個人……這明明是我以前最希望看到的『安寧』，可為什麼我現在看著，後背卻一陣一陣地發涼呢？」",""],"A04_REACT_FRIENDLY_01":["「謝謝你願意體諒我這把老骨頭……當家難呐，幾十戶人家的吃穿冷暖都在肩上，我也是實在沒辦法，只能盼著少出點亂子。」",""],"A04_REACT_FRIENDLY_02":["「哎呀，有你這句話，我今晚總算能踏實睡個好覺了！沒事的，只要咱們好好配合，暮簡村一定能平平安安的。」",""],"A04_REACT_COLD_01":["「呃、也是，你們公會的人辦事講究效率，是我老頭子話太多了。你忙你的、忙你的，沒事的。」",""],"A04_REACT_COLD_02":["「好、好，我知道的都告訴你就是了，你別用那種眼神盯著我看，怪瘮人的……」",""],"A04_REACT_RUDE_01":["「你、你這年輕人怎麼說話這麼衝！我也是為了村子好！難道要我敲鑼打鼓告訴大家地底下有古怪、連路名都不對勁，看著全村人連夜逃荒嗎？！」",""],"A04_REACT_RUDE_02":["「算了、算了……我跟你們這些拿刀動槍的人說不清楚。你有什麼事直接去找柏燼站長談吧，我村公所還有事，先走了。」",""],"A05_MEET_01":["「把門帶上，外頭的濕氣會讓舊信封受潮。……你是渡鴉公會新來的？我是蘇眠砂，看管夢途驛的人。普通家書歸地方站郵務管，但如果你在村裡或地底下撿到沒有寄件人、沒有郵戳，或者摸起來比冰塊還冷的信，直接拿來這張桌子上，別用手指直接碰上面的封蠟。」","戴著一雙薄薄的灰布手套，正用骨製拆信刀挑開一封焦黑信件的邊角。聽見腳步聲後只微微側過臉，冷靜的目光在玩家腰間的徽章上停了一瞬。"],"A05_MEET_02":["「這鐘點還來敲夢途驛的門，看來你手裡拿著讓人睡不著覺的東西。我是蘇眠砂。先別急著說話，站到那盞風燈底下讓我聞聞——嗯，你袖口沾了燭苔區的濕泥味，還有舊紙發霉的氣息。把東西放進托盤裡吧，我替你看看它是從哪個年頭飄過來的。」","手裡端著一盞青銅小香爐，撥開垂落的門簾走出來，在微弱的燈光下微蹙眉頭輕嗅了一下空氣，隨即指了指櫃檯上的木製托盤。"],"A06_MEET_01":["「喂，你也是來抓紅殼蝸牛的嗎？不對，你身上有鐵片片的聲音，你是地方站新來的冒險者！我叫小穗！我跟你說一個祕密喔，村口那塊大石碑上其實密密麻麻全是字，還會像小蟲子一樣擠來擠去，可是桑沐爺爺跟老陳叔都說我睡迷糊了。你蹲下來看，你看得見對不對？」","蹲在青苔石階上，手裡捏著一根狗尾草，仰起沾了一點泥巴的小"],"A06_MEET_02":["「噓——你走路太大聲啦，會把水窪裡的名字踩碎的！我是小穗，你就是許茉姊姊說的新人嗎？每次下過雨，石頭縫裡就會冒出好多沒人要的舊名字，我想用樹葉把牠們撈起來，可是大人都叫我別玩髒水。你的鞋子那麼厚，一定不怕水對不對？」","穿著一雙大了一號的舊木屐，正小心翼翼地用一片大芋頭葉去"],"A05_IDLE_01":["「紙比人誠實。人會撒謊，但受過潮的麻紙、摻了石粉的墨水不會。它從哪裡來，上面都寫著。」","舉起放大鏡對著半張殘破的信紙邊緣端詳，連呼吸都放得很輕。"],"A05_IDLE_02":["「許茉今天又把兩封只是字跡潦草的普通情書當成異常夢郵送來了。不過她很細心，每次都會用油紙包好，沒讓雨水淋濕半個字。」","將兩封綁著紅線的信件單獨挑出來放進退回籃，眼底掠過一絲極淡的笑意。"],"A05_IDLE_03":["「余巷失蹤前，每隔五天會來我這裡核對一次死信名冊。他認得村裡每一塊快要磨平的門牌，他不在，很多信就真的只能躺在抽屜裡發涼了。」","手指輕輕拂過一本封面寫著「待查」的厚重名冊，指尖在停留在三個月前的最後一行簽名上。"],"A05_IDLE_04":["「從地底下飄上來的信，封口通常不是用火漆，而是用乾涸的苔汁或灰燼黏住的。在下面看到那種信，別隨便替人拆開，那等於替人簽收。」","用鑷子夾起一小塊灰白色的乾硬封泥放進玻璃瓶中封存，語氣嚴肅。"],"A05_IDLE_05":["「桑沐村長把西邊的舊街改叫『西風巷』、新地圖印出來以後，退回來的死信多了三成。路名改得掉，但寄信人腦子裡記著的舊門牌可不會跟著改。」","看了一眼牆上並排掛著的新舊兩張郵路簡圖，冷淡地搖了搖頭。"],"A05_IDLE_06":["「覺得屋裡苦艾草的味道太重？忍一忍吧。舊信堆久了會招書蠹，也會招來一些不該留在地面上的念頭，點著草煙對你我都好。」","拿起小銅匙往香爐裡添了一撮乾燥的碎草葉，青煙緩緩升起。"],"A05_IDLE_07":["「村裡那個叫小穗的孩子，偶爾會趴在我這扇窗戶外面問，有沒有給石碑寄來的信。大人都笑她傻，我倒覺得她的眼睛比村裡多數人都乾淨。」","轉頭望向半開的木窗，窗台上還留著兩顆小穗放的小石子。"],"A05_IDLE_08":["「昨天夜裡風大，今早我在死信櫃頂上發現一張字跡極其工整的分類便條，幫我把三封年代錯亂的舊信排好了順序。……不是柏燼叔的字，倒像是某個極守規矩的旅人留下的。」","將那張裁切得方方正正的便條夾進書籤裡，指尖順著工整的筆畫撫過，若有所思。"],"A05_QUEST_DONE_01":["「帶回來的東西保存得很完整，沒有多餘的破損。你比我想像中更懂得怎麼對待這些舊物，辛苦了。」","用戴著手套的雙手鄭重接過物品，對著玩家微微頷首，眼神裡多了一分認可。"],"A05_QUEST_DONE_02":["「聽許茉說你那邊的委託結案了。能讓一樁差事有頭有尾，就像讓一封信平安落進郵筒一樣難得。喝杯苦艾茶歇會兒吧。」","倒了一小杯色澤微青的溫茶推過桌面，動作依然不疾不徐。"],"A05_QUEST_DONE_03":["「又有一封信找到它該去的地方了。死信櫃每空出一格，這間屋子裡的寒氣就會少一分。謝謝你。」","在厚重的登記冊上用紅筆輕輕劃掉一行編號，神情顯得柔和了些許。"],"A05_RETURN_01":["「別動，你身上的血腥味和地底的冷氣混在一起了。先坐到椅子上，這瓶是摻了白蠟花的止血膏，塗在傷口上會有點刺痛，但能拔掉石苔帶來的寒毒。」","立刻放下手裡的拆信刀，從藥匣裡取出一個白瓷小罐，動作熟練而冷靜地拉過板凳讓玩家坐下。"],"A05_RETURN_02":["「從下面回來了？把靴子上的灰拍一拍再進內室。如果這趟在底下聽見了什麼不該聽的聲音，去香爐邊站一會兒，別把那些回音帶回床上。」","抬起眼簾打量了玩家一圈，確認玩家眼神清明後，才重新低頭整理桌上的信件。"],"A05_CH1_END_01":["「你看這本死信核對冊。墨水褪得一乾眼淨，像從來沒人簽過名一樣……但你把紙斜著對光看，上面全是用力寫字留下的筆劃凹痕。有人想擦掉那個名字，可紙還記得自己被寫過。」","將空白的冊頁舉到油燈旁，手指順著無形的凹痕摩挲，清冷的聲音裡壓著一絲罕見的寒意。"],"A05_CH1_END_02":["「如果連我也開始叫不出那個郵差的名字，請你務必把那枚生鏽的徽章拍在我桌上。只要實物還在、收據上的凹痕還在，夢途驛就不會承認那個人不存在。」","摘下灰布手套，用指腹重重按在桌上那封來自地底的夢郵收據上，目光筆直地看著玩家。"],"A05_CH1_END_03":["「那些寫著『簷下路九號』的信，摸起來新舊不一，封口的習慣也像隔了好幾雙手。它們可能不只一種來歷……在拆開下一封信之前，我一個都不排除。你查案的時候，也別太早下定論。」","將三枚不同顏色的骨製書籤分別夾進三疊舊信中，神色冷靜得像在解剖一具標本。"],"A05_REACT_FRIENDLY_01":["「我習慣安靜了，一個人守著這些舊信並不覺得悶。不過……有人願意進來坐坐，順便帶點外頭的新鮮風聲，倒也不壞。」","原本挺得筆直的背脊稍微放鬆了一些，替玩家的茶杯續上熱水。"],"A05_REACT_FRIENDLY_02":["「你對分辨舊墨水和封蠟有興趣？下次在底下撿到拿不準的紙片，直接拿來，我教你怎麼看紙紋的年分。」","唇角微微牽起一點弧度，從抽屜裡取出一枚備用的小放大鏡放在桌角。"],"A05_REACT_COLD_01":["「東西放下就行。檢驗結果出來後，我會讓人把字條送到地方站，你可以回了。」","神色沒有任何波瀾，只點了點頭便重新戴上放大鏡低頭工作。"],"A05_REACT_COLD_02":["「不想說也沒關係。等那些信自己開口的時候，我自然會知道答案。」","將木托盤收回櫃檯內側，安靜地拉上了一半的竹簾。"],"A05_REACT_RUDE_01":["「把手拿開。你可以不相信夢途驛，但如果你再敢弄亂桌上的死信分揀順序，我就按妨礙公會郵務把你記上黑名單。」","手裡的骨製拆信刀「叩」地一聲壓在玩家手背旁邊的桌面上，眼神冷得像結了霜。"],"A05_REACT_RUDE_02":["「這間屋子只接待活人與死信，不接待聽不懂人話的野獸。門在後面，請你出去。」","直接合上所有的木匣並落鎖，連一個多餘的眼神都沒再給玩家。"],"A06_IDLE_01":["「大人真奇怪，明明石碑上的字那麼吵，他們卻說上面光溜溜的什麼都沒有。是不是長太高的人，眼睛就會變笨呀？」","雙手叉著腰，鼓起腮幫子仰頭看了一眼石碑，又比了比自己的身高。"],"A06_IDLE_02":["「余巷哥哥答應過我，等他這趟送完信回來，要教我寫我自己的名字！他都出去好久好久了，我藏在鐵盒裡的麥芽糖都快融化啦。」","從口袋裡掏出一個生鏽的小扁鐵盒晃了晃，聽見裡頭糖塊碰撞的聲音，小臉皺成一團。"],"A06_IDLE_03":["「老陳叔嘴上說小孩不能進酒館搗亂，可是只要我在門口蹲一下下，他就會假裝不小心掉一塊甜肉乾在門檻旁邊喔！」","捂著嘴偷笑，露出兩顆缺了一角的小乳牙。"],"A06_IDLE_04":["「許茉姊姊今天幫我編了辮子，可是她一邊編一邊找她的算盤，結果把紅頭繩綁成死結了，痛痛痛……」","小手扯著自己一邊歪掉的小辮子，嘴裡喊痛，臉上卻笑嘻嘻的。"],"A06_IDLE_05":["「桑沐爺爺說西風巷後面的舊牆壁會咬人，不准我們去那邊捉迷藏。可是我昨天明明看到有一隻黑羽毛的大鳥飛進去了呀。」","踮著腳尖往村子西側張望，小腦袋歪向一邊。"],"A06_IDLE_06":["「眠砂姊姊的屋子裡香香的，像曬乾的草堆一樣。我送了她兩顆最圓的鵝卵石壓信紙，她就不會讓風把信吹跑了！」","拍了拍自己沾滿灰塵的小手掌，一臉得意洋洋。"],"A06_IDLE_07":["「柏燼爺爺瞪人的時候像大黑熊！可是上次我的風箏掛在地方站屋頂上，是他半夜拿長竹竿幫我戳下來的，我都看見了！」","吐了吐舌頭，扮了一個兇巴巴的鬼臉，隨即又咯咯笑起來。"],"A06_IDLE_08":["「地窖入口下面好像有一口很大很大的鐘喔。有時候我把耳朵貼在泥巴地上，會聽到『咚——』的一聲，像有人在底下翻大書本一樣。」","比劃了一個超大圓圈的手勢，左耳還沾著一點剛貼過地面的乾泥巴。"],"A06_QUEST_DONE_01":["「哇，你這麼快就幫他們把事情做完啦？你好厲害！這顆長得像星星的石頭送給你當獎品，只有乖大人才能拿到喔！」","在自己裝滿寶貝的小布兜裡翻找半天，掏出一顆洗得乾乾淨淨的白色小石頭塞進玩家手心。"],"A06_QUEST_DONE_02":["「我就說那些字掉進水裡會冷吧！謝謝你把牠們撿回來，這樣那些路就不會找不到家了。」","開心地在原地蹦跳了兩下，雙手拍得啪啪響。"],"A06_QUEST_DONE_03":["「現在大家都很喜歡你耶！等我長大了，我也要當渡鴉公會的人，背一個跟你一樣神氣的大袋子！」","挺起小胸膛，學著玩家走路的姿勢在石板路上邁了兩大步。"],"A06_RETURN_01":["「呀！你流血了！痛不痛？呼呼——我娘說痛痛的地方吹一吹就會飛走！你快蹲下來，我幫你吹吹，然後你快去找柏燼爺爺擦藥！」","嚇得丟掉手裡的狗尾草，踮起腳尖湊過來對著玩家手臂上的傷痕用力吹氣，小眉頭緊緊皺在一起。"],"A06_RETURN_02":["「你從地底下鑽出來啦！下面有沒有住在石頭裡的巨人和會唱歌的鳥？下次你去的時候，幫我跟牠們說聲晚安好不好？」","圍著玩家轉了一圈，好奇地嗅了嗅玩家斗篷上的苔蘚味。"],"A06_CH1_END_01":["「我這個小鐵盒裡裝著兩顆快化掉的麥芽糖喔。我想不起來是誰給我的了，許茉姊姊說村裡根本沒有這個人，是我自己編出來的假朋友……可是如果他是假的，為什麼我的糖果真的是甜的呢？」","打開生鏽的小鐵盒，用手指沾了一點融化的糖漿放進嘴裡，歪著小腦袋，眼神裡沒有恐懼，只有純粹的迷惘。"],"A06_CH1_END_02":["「我在跟『沒名字哥哥』玩捉迷藏！我數到一百，他就躲進那邊的牆壁後面了。大人都說我一個人在對著空氣傻笑……喂，你看得見他露出來的一角郵差包包嗎？」","背對著西風巷的舊磚牆捂著眼睛數數，轉過身時指著空無一物的牆角，臉上掛著天真卻讓人背脊發涼的笑容。"],"A06_CH1_END_03":["「石碑上的字今天擠得更緊了，好像剛才有一個新掉下去的名字，正縮在角落裡哭呢。大人都忘了他，那我明天帶朵小黃花放在石碑下面陪他，好不好？」","伸出小手輕輕摸了摸冰冷的石碑底部，像是在安撫一隻受驚的小動物，語氣輕柔得讓人心碎。"],"A06_REACT_RUDE_01":["「哇啊——你比地窖裡的怪物還要兇！我要去告訴柏燼爺爺跟老陳叔，說你欺負小孩！」","嚇得一屁股跌坐在地上，眼淚在眼眶裡打轉，抓起一把泥巴朝玩家腳邊扔過去就跑。"],"A06_REACT_FRIENDLY_02":["「嘻嘻，你的手熱熱的！我把抓蝸牛最厲害的草叢位置讓給你，你不可以告訴別人喔！」","像小貓一樣瞇起眼睛蹭了蹭，開心地晃著兩條小短腿。"],"A06_REACT_COLD_01":["「喔……你也要去忙大人的事情了嗎？那好吧，我自己去跟蝸牛玩。」","原本高高舉起的小手慢慢放了下來，踢了踢腳邊的小石子，乖巧地退到路邊。"],"A06_REACT_COLD_02":["「哼，連你也說我是在做夢……算了，不給你看我的寶貝石頭了。」","失望地扁了扁嘴，把小布兜緊緊捂在胸口轉過身去。"],"A06_REACT_RUDE_02":["「略略略！壞大人！祝你走夜路踩進大水坑，連石碑上的字都不理你！」","躲在遠處的水缸後面只探出半個腦袋，紅著眼睛對玩家做了一個大鬼臉，隨即一溜煙跑沒影了。"],"A07_MEET_01":["「把腳邊那筐廢鐵踢開點，別絆著自己。你就是新來的？我是岩蘢，管這間工坊。先把醜話說在前頭，不管你在外頭聽了多少怪故事，進了我這扇門，我只看你手裡的鐵硬不硬、礦純不純。刀捲刃了、甲裂了，隨時拿來拍在砧子上；但要是想找人聊什麼神神鬼鬼的夢話，出門左轉找別人去。」","一手提著沉甸甸的黃銅燈籠照向玩家的裝備，另一隻手拿粗麻布用力抹掉指尖的灰白礦粉，濃眉微挑，嗓門洪亮得像能震落屋樑上的灰。"],"A07_IDLE_01":["「石頭不會騙人。敲一下聽聲音，是實心還是空心、裡頭有沒有裂紋，一清二楚，比猜人心省事多了。」","用小鐵鎚在鎮紙用的礦石上輕敲了一記，滿意地擦了擦指尖的石粉。"],"A07_IDLE_02":["「地窖頭三層的燭苔汁帶酸，沾在鐵器上不擦乾淨，過兩天就能咬出一個麻坑。回來記得上油，別等斷在怪物的骨頭縫裡才來哭。」","抓起一把生鏽的短劍對著燈籠光看了一眼，嫌棄地嘖了一聲。"],"A07_IDLE_03":["「余巷那小子的備用銅扣還壓在我工具箱最底下。三個月前他說跑完那趟就來拿，結果人沒影了。東西我留著，我可不愛欠人手工錢。」","用腳尖踢了踢桌下的一只小鐵盒，隨即又低頭拉動風箱，火光映得她臉色發紅。"],"A07_IDLE_04":["「柏燼那老頭每次來工坊都嫌我燈籠點得太亮、費燈油。哼，打鐵看不準火色，打出來的廢鐵才叫真費錢。」","把鐵燈籠往高處的掛鉤上一掛，雙手叉腰哼了一聲。"],"A07_IDLE_05":["「大廳裡那個叫頁絮的姑娘，成天把字寫在自己胳膊上。我看著都替她嫌癢，要記東西，拿鑿子刻在石板上才叫一勞永逸。」","曲起手指在厚實的石桌面上叩了兩下，搖頭晃腦。"],"A07_IDLE_06":["「鐘衡那老傢伙腿上的舊傷是被第六層的寒氣凍出來的。他嘴上什麼都不說，但偶爾會把地底撿來的好礦石偷偷塞在我門口。」","指尖捻起一點帶著微光的深色礦粉搓了搓，眼神裡帶著幾分對老輩的敬重。"],"A07_IDLE_07":["「底下那個燭苔巨人，身上的石骨比上好的青岡岩還密實。牠要是不擋路，我還真想敲一小塊下來打護心鏡。」","握了握手裡的鍛造鎚，眼底閃過一絲工匠見獵心喜的光芒。"],"A07_IDLE_08":["「打了一下午的鐵，骨頭縫裡都是乾的。待會兒收工得去老陳那兒灌兩大碗麥酒，光喝許茉泡的碎葉茶可頂不住餓。」","甩了甩痠痛的粗壯手臂，拿抹布把額頭的汗水一抹到底。"],"A07_QUEST_DONE_01":["「成色不錯，份量也足，沒拿次品糊弄我。我就喜歡跟你這種手腳實在的人打交道，拿去，這是答應給你的東西。」","單手掂了掂材料的重量，滿意地點頭，把打磨好的成品乾脆地拋給玩家。"],"A07_QUEST_DONE_02":["「活兒幹完了？幹完了就把武器拿過來讓我敲兩下聽聽音。上陣的傢伙事要是出了暗傷，下次吃虧的就是你自己。」","提著燈籠湊近半步，伸出寬厚的手掌示意玩家把武器遞過去。"],"A07_QUEST_DONE_03":["「看來你這塊鐵算是鍛出來了，剛來那陣子我還怕你連第三層都走不過去。行，以後你的裝備保養，我排在第一順。」","用沾著礦粉的拳頭在玩家肩頭不輕不重地捶了一下，咧嘴一笑。"],"A07_RETURN_01":["「護胸甲都凹進去半寸了！要不是我當初給你多加了一層熟鐵襯裡，你現在早躺進木板裡了！人先滾去後面擦藥，爛鐵留下，我今晚加班給你敲平！」","一把扯下玩家破損的護具扔上鐵砧，臉色雖然兇狠，手底下卻立刻去翻找備用的繃帶扔進玩家懷裡。"],"A07_RETURN_02":["「上來了？到爐子邊站兩分鐘，讓火氣烘乾你身上的冷濕味。手裡的傢伙沒崩口吧？」","用火鉗撥開爐膛裡的紅炭，讓熱浪撲向門口，頭也不回地擦著指尖。"],"A07_CH1_END_01":["「站裡的人都說沒那個郵差？放屁。那我盒子裡這枚打了一半的黃銅郵包扣是給鬼打的？我腦子是想不起他的名字，但我這雙手記得接過這筆活！」","把那枚刻了一半編號的黃銅扣重重拍在石桌上，震得燈籠火苗猛晃，眼神裡全是倔強的火氣。"],"A07_CH1_END_02":["「這枚生鏽徽章背面的焊接點，是我親手用赤銅焊上的。誰敢說這東西沒主人，我就拿鐵鎚敲醒他的腦殼。把這東西收緊了，我只信手裡摸得到的鐵證。」","提著燈籠湊到徽章前，粗糲的指腹摸過背面的焊痕，語氣斬釘截鐵。"],"A07_CH1_END_03":["「不管底下是什麼東西在偷名字，它偷不走實打實的鐵器。去之前把刀刃磨快點，要是連你也變得空落落的，我可沒法跟柏燼交代。」","用力擦乾淨指尖最後一點礦粉，將一塊上好的磨刀石塞進玩家手裡。"],"A07_REACT_FRIENDLY_01":["「算你有眼光！岩心族打出來的東西，別的不敢說，結實耐用絕對是頭一份。下次給你打暗扣時多送你兩枚鉚釘。」","爽快地大笑兩聲，手裡的鐵鎚在掌心轉了個漂亮的鎚花。"],"A07_REACT_FRIENDLY_02":["「喲，手勁不小嘛，拉風箱的節奏也穩。要是哪天不當冒險者了，來我這工坊當學徒，保準餓不著你。」","看著爐火竄高，滿意地點了點頭，遞給玩家一條乾淨的擦汗毛巾。"],"A07_REACT_COLD_01":["「東西放著，半個時辰後再來拿。省下唾沫星子對你我都好。」","眼皮都沒多抬一下，直接用火鉗夾過裝備放進爐火邊預熱。"],"A07_REACT_COLD_02":["「行，悶頭幹活的人總比光說不練的強。忙你的去吧。」","揮了揮手裡的粗麻布，轉身繼續敲打砧子上的鐵胚。"],"A07_REACT_RUDE_01":["「嫌我這兒打的鐵糙？那你有本事光著手下地窖去跟怪物硬碰硬！少在我面前擺大爺架子，我的鐵鎚可不長眼睛。」","「噹」地一聲把重鎚砸在鐵砧上，火星四濺，提著燈籠冷冷逼視玩家。"],"A07_REACT_RUDE_02":["「把你的爪子從我的礦石匣子上拿開！今天工坊歇業，不接你的單，給我滾出去！」","一把奪過玩家手邊的工具盒重重扣上，指著工坊大門怒喝。"],"A08_MEET_01":["「……別舉著火把湊那麼近，我這雙老眼睛受不了亮光。你是新來的吧？叫我鐘衡就行，我只是個腿腳不中用、賴在角落裡混口熱氣的老廢物。你想問地窖底下的事？……去問柏燼，或者去看委託板，我這兒沒有故事給你聽。不過……你腰間的藥袋太癟了，這瓶止血草汁拿著，下去以後，聽見什麼不認識的動靜，別回頭。」","縮在陰影裡的舊木椅上，雙手把膝蓋上的舊毛毯往緊裡裹了裹。渾濁的眼睛在陰影中看了玩家半晌，才像嘆氣一樣從毯子底下摸出一小瓶灰綠色的藥水，塞進玩家手心，隨即又閉上了眼。"],"A08_IDLE_01":["「這雙腿不是被怪物咬斷的，是在底下站得太久、聽那口鐘響了太多次，自己慢慢冷掉的。……算了，陳年舊帳，提它做什麼。」","隔著厚重的舊毯子緩緩揉按著毫無知覺的膝蓋，聲音低得像風吹過枯葉。"],"A08_IDLE_02":["「要是哪天你走到了霧氣裡全是書頁的地方，聽見悶悶的鐘聲……別想著把敲鐘的東西趕盡殺絕。牠只是在守門，讓牠安靜下來就好。」","手指在木椅扶手上極輕地敲了一下，彷彿在模仿某種深沉的鐘鳴，隨即又搖了搖頭不再多說。"],"A08_IDLE_03":["「余巷那孩子每次跑完外鎮，總會順路幫我捎兩包驅寒的乾薑片。這三個月沒人捎了，腿骨裡頭一到半夜就跟針扎似的。」","低頭看著毯子邊緣一處被磨破的線頭，混濁的眼底閃過一抹深沉的憂慮。"],"A08_IDLE_04":["「別問我這瓶清心露是哪來的，我一個半截入土的老頭子留著也沒用。塞進背包最外層，底下起霧的時候喝一口，能保住你的神智。」","趁許茉不注意，枯瘦的手指飛快地把一個小扁瓶推到玩家手邊，又立刻縮回毯子裡。"],"A08_IDLE_05":["「那個叫頁絮的丫頭，總愛打聽地底下的事往自己身上寫。我一個字都沒跟她說過……有些東西一旦變成字留了下來，就甩不掉了。」","遠遠望了一眼正在記錄的頁絮，眉頭深鎖，把毛毯往上拉到了下巴。"],"A08_IDLE_06":["「柏燼當年要是沒留在地面上管這個地方站，現在大概也跟我一樣坐在這兒蓋毯子了。他比我清醒，知道守住活人比刨死人根底更重要。」","望著柏燼叔忙碌的背影，乾裂的嘴角扯出一點極淡的苦笑。"],"A08_IDLE_07":["「在底下組隊，別用真名大聲喊你的同伴。……你要是嫌我老頭子囉嗦，就當我剛才在說夢話吧。」","剛說了一半便猛地頓住，像是觸碰到了某個禁忌的傷疤，偏過頭閉口不言。"],"A08_IDLE_08":["「偶爾打瞌睡醒來，我這張舊毯子旁邊會多出一盞沒點火卻自己發暖的白紙燈。……這世上總有那麼幾個既不屬於地上、也不屬於地底的影子，別去追他們。」","枯瘦的手指摸了摸椅腳邊一處乾淨得沒有半點灰塵的地板，眼神幽深。"],"A08_QUEST_DONE_01":["「活著回來領賞了？……那就好。年輕人能平平安安拿著積分去換頓熱飯，比立什麼大功都強。」","微微睜開一隻眼確認玩家全須全尾，又緩緩點了點頭靠回椅背。"],"A08_QUEST_DONE_02":["「我聞見你身上那股血腥味和青苔味了。把事情辦完就趕緊去洗把臉，別讓底下的氣味在身上留過夜。這包驅寒粉拿去泡腳。」","沒有多問半句過程，只是從椅墊旁摸出一小包草藥粉丟進玩家懷裡。"],"A08_QUEST_DONE_03":["「你的腳步聲比剛來時沉穩多了。……本事越大，越容易往下走；走得越深，越要記得回來的路長什麼樣。」","難得抬起頭正眼看著玩家，渾濁的眼珠裡映著大廳微弱的火光。"],"A08_RETURN_01":["「……不要命了？這瓶是熬了三年的濃苦根汁，給我張嘴一口氣吞下去！苦死也比把名字留在下面強！喝完立刻去找柏燼包紮，別死在我眼皮子底下！」","枯瘦的手背青筋暴起，一把抓住玩家的手腕，不容分說地將一瓶黑褐色的濃稠藥汁塞進玩家手裡，沙啞的嗓音裡壓著發抖的怒氣。"],"A08_RETURN_02":["「一、二、三……嗯，下去幾個，上來幾個，沒少人。去火爐那邊吧，別在我這冷角落裡待著。」","目光從玩家與隊員們的臉上一一掃過，暗自鬆了一口長氣，重新把下巴縮回毛毯裡。"],"A08_CH1_END_01":["「又來了……跟二十年前一模一樣。我也快叫不出那孩子的名字了，可我毯子底下還壓著他上次捎來的半包乾薑片。我老了，腦子留不住人，但我不瞎。」","死死攥著毯子底下那包已經乾癟的薑片，指節發白，渾濁的眼睛死死盯著大廳門口，像在對抗某種無形的侵蝕。"],"A08_CH1_END_02":["「你走過第六層，也看見第九層後面那扇門了……當年我就在第六層停下了腳步，沒敢再往下看。既然你還記著那個郵差，這瓶我留著保命的『醒神髓』給你。別變得跟外頭那些笑呵呵忘了事的人一樣。」","顫巍巍地從貼身內袋裡摸出一支封著紅蠟的細長玻璃管，鄭重地放進玩家掌心，合攏了玩家的手指。"],"A08_CH1_END_03":["「柏燼說得對，地上的人忘得快，地底下卻什麼都收著。……你要是真打算推開後面那扇門，記得在自己手心裡寫上自己的名字，別走著走著，連自己也弄丟了。」","聲音輕得幾乎聽不見，拍了拍自己的膝蓋，眼神裡既有恐懼，也有一絲壓抑了二十年的釋然。"],"A08_REACT_FRIENDLY_01":["「……多管閒事。我這把老骨頭喝不喝熱水都一樣。……放椅背那兒吧，等涼一點我再喝。」","愣了一下，有些笨拙地別過臉去，卻悄悄把蓋在腿上的毛毯往旁邊挪出一小塊放杯子的地方。"],"A08_REACT_FRIENDLY_02":["「能派上用場就好。別總往我這黑角落跑，去跟許茉她們說說話，年輕人身上得多沾點活氣。」","緊繃的眉心稍微舒展，揮了揮枯瘦的手背，語氣比平時溫和了許多。"],"A08_REACT_COLD_01":["「拿了就走吧。本來也不需要你道謝，少死一個人在下面，我就少聽一聲鐘響。」","毫不在意地閉上雙眼，繼續縮在陰影裡打盹。"],"A08_REACT_COLD_02":["「不愛說話也好。在底下，閉緊嘴巴的人通常活得比較久。」","微微頷首，連姿勢都沒有變動分毫。"],"A08_REACT_RUDE_01":["「……是啊，我是個怕死的膽小鬼。所以那些不怕死的都留在第六層下面變成紙灰了，我還坐在這兒喘氣。你這麼有種，但願下個月還能站在我面前罵人。」","連眼皮都沒抬一下，沙啞的聲音平靜得像一潭死水，卻聽得人後背發寒。"],"A08_REACT_RUDE_02":["「省省力氣吧。連地底下的東西都沒能撬開我的嘴，就憑你這點三腳貓的火氣？滾遠點，別擋著我那點可憐的爐火光。」","冷冷地瞥了玩家一眼，直接拉起舊毛毯蓋過半張臉，徹底拒絕交流。"],"A09_MEET_01":["「啊，請等一下！你斗篷下擺沾著的那片發光苔蘚，是從地窖第一層帶上來的嗎？你好，我是地方站的記錄員頁絮。別害怕，我手腕上這些游來游去的黑字不是刺青，我是頁生族，我們習慣把聽來的故事和走過的路記在自己身上。你以後從地窖回來，要是看見了什麼稀奇的石頭或怪聲音，一定要講給我聽喔，我手臂上還留著好多空白呢！」","正挽著袖子低頭看著自己小臂上緩慢游動的墨字，一見到玩家便眼睛發亮地迎上來，大方地伸出白皙如紙的手腕展示那些像小魚一樣排列成行的細小字跡。"],"A09_IDLE_01":["「寫在紙上的字容易被雨水泡糊，但記在頁生族身上的字，只要我們還活著，就不會輕易散開。不過……要是記了太悲傷的事，皮膚會有一點點發燙呢。」","用指尖輕輕點了點自己手背上的一行小字，那行字像是怕癢似的往袖口裡縮了縮。"],"A09_IDLE_02":["「岩蘢師傅每次看到我手上的字，都說想拿石板幫我拓印下來。她人其實很熱心，就是手勁太大了，上次拍我肩膀差點把我剛排好的兩行字拍散。」","揉了揉自己的右肩，看著手腕上重新排好隊的文字，無奈又好笑地嘆了口氣。"],"A09_IDLE_03":["「鐘衡老先生肚子里一定裝著厚厚一大本書的故事，可是無論我怎麼求他，他都不肯跟我講第六層下面的樣子，只叫我離地窖入口遠一點。」","抱著一疊空白的備份羊皮紙，偷偷瞄了一眼暗處的鐘衡，有些惋惜地撇了撇嘴。"],"A09_IDLE_04":["「余巷以前跑完郵路回來，最喜歡跟我講哪戶人家的狗又追著他跑了兩條街。你看，我左手虎口這幾行字就是記他的郵路，等他回來我還要接著往下寫呢。」","舉起左手，虎口處有幾行娟秀的小字正安靜地停駐著，隨著她的呼吸微微起伏。"],"A09_IDLE_05":["「許茉算帳快，我記字穩，我們倆搭檔本來該天衣無縫的——要不是她偶爾會拿著沾水筆不小心點到我手背上的話！」","展示手背上一顆還沒洗掉的外來藍墨水點，哭笑不得地搖了搖頭。"],"A09_IDLE_06":["「眠砂姊姊說，我身上的字聞起來有一股太陽曬過新紙的味道，跟地底下那些發霉的舊字完全不一樣。所以我很喜歡去夢途驛找她喝茶。」","把臉頰貼在自己的小臂上輕輕蹭了一下，露出溫和恬靜的笑容。"],"A09_IDLE_07":["「奇怪……今天早上醒來的時候，我發現鎖骨旁邊自己浮出了『左轉第三階、逆風廊』幾個字。可我從來沒去過叫這個名字的地方，也沒聽誰說起過呀……」","手指輕輕按住領口邊緣，低頭看著那幾枚正慢慢淡去的陌生筆畫，神情裡帶著一絲茫然。"],"A09_IDLE_08":["「聽說地窖第四層往下，到處都是飄在半空中的書頁。那些書頁上寫著的，會不會也是以前某個頁生族沒能帶回地面的記憶呢？」","手指在空中輕輕抓了一下，像是在接住一片看不見的落葉，眼神有些出神。"],"A09_QUEST_DONE_01":["「委託完成啦？快跟我說說這次遇到了什麼！你看，我手腕上的字已經排好隊，準備把你的功勞記下來了！」","開心地挽起兩邊袖子，皮膚上的細小黑字隨著她雀躍的心情游動得格外輕快。"],"A09_QUEST_DONE_02":["「原來那裡藏著這樣的細節……謝謝你告訴我，我已經把它們全部抄到羊皮紙上歸檔了。有你在，我們站的紀錄比以前豐富了好多。」","指尖順著小臂上的字跡滑過，再工工整整地謄寫到桌上的卷宗裡，朝玩家感激地一笑。"],"A09_QUEST_DONE_03":["「你看，現在我右手小臂上有一大半都是關於你和隊友們的紀錄喔。要是哪天你們成了大英雄，我這條手臂可就變成傳奇故事書啦！」","把右手小臂舉到玩家面前晃了晃，臉頰微微泛著紅暈，眼神明亮。"],"A09_RETURN_01":["「天啊，別管什麼探索紀錄了！我身上的字什麼時候都能寫，但你流了這麼多血，再不包紮會出人命的！快坐下，我這就去幫你拿止血粉和乾淨紗布！」","手腕上的字因為她的驚慌而瞬間亂成一團，她連忙放下手裡的卷宗，提著裙擺急匆匆地跑向醫藥櫃。"],"A09_RETURN_02":["「歡迎回來！看你們平平安安走進大門，我手腕上的字都跟著鬆了一口氣呢。先去喝口熱水，等歇夠了再跟我講地底下的事吧。」","對著玩家露出一抹溫柔的淺笑，手腕上的墨字緩緩游成一圈安定的圓弧。"],"A09_CH1_END_01":["「好奇怪……我左手虎口這裡，本來應該記著好幾行字的，為什麼現在變成一片空白了？我想不起來那裡寫過誰的名字，可是那塊皮膚一直在發燙、刺痛，像是有字被硬生生從我身上扯下去了一樣……」","用右手緊緊摀住左手虎口，眼眶微紅，看著那塊泛紅卻沒有半個墨字的皮膚，聲音裡帶著掩不住的顫抖。"],"A09_CH1_END_02":["「你把那張收據拿近一點的時候，我虎口空白的地方好像有一兩個筆畫想重新浮出來……雖然我還是叫不出他的名字，但我身上的皮膚記得他！請你千萬別把那些證據弄丟了。」","小心翼翼地將左手湊近玩家手里的證物，看著皮膚下若隱若現的一點墨痕，既緊張又急切地叮囑玩家。"],"A09_CH1_END_03":["「昨晚我疼得睡不著，低頭一看，原本空白的虎口上居然自己爬出了一行新字，寫著『逆址、退件廊、門後第三步』……這不是我聽來的故事，也不是我走過的路，我的身體……怎麼會開始寫我還沒去過的地方呢？」","將左手虎口攤開給玩家看，上頭幾枚細小而凌厲的黑字正逆著血管的方向緩慢游動，她既害怕又困惑地咬著下唇。"],"A09_REACT_FRIENDLY_01":["「哇，你講得好仔細！你看，這些字聽得太入迷，自己就在我小臂上排成一朵小花的形狀了。謝謝你願意跟我分享這些！」","小臂上的文字歡快地聚攏又散開，她雙眼彎彎，笑得十分開心。"],"A09_REACT_FRIENDLY_02":["「真的嗎？外頭有些人看到頁生族身上的字會覺得害怕，能聽到你這麼說，我心裡暖洋洋的。」","耳根微微泛紅，有些不好意思地拉了拉袖口，眼神格外柔和。"],"A09_REACT_COLD_01":["「這樣啊……沒關係，每個人都有不想寫進書裡的祕密。等哪天你想說了，我再替你記下來。」","手腕上的字慢慢停下游動，她禮貌地合上備份簿，對玩家點了點頭。"],"A09_REACT_COLD_02":["「好的，你要查的舊卷宗在第三格。我就在旁邊整理抄本，不打擾你。」","安靜地側身讓開檔案架，乖巧地退到一旁。"],"A09_REACT_RUDE_01":["「這不是蟲子，這是我們一族活著的證明！你可以不喜歡我，但請你不要這樣羞辱我身上的文字……」","臉色瞬間變得像白紙一樣蒼白，連忙把兩隻衣袖死死往下拉住遮住手腕，眼眶泛紅地後退了一步。"],"A09_REACT_RUDE_02":["「請你自重！地方站的檔案室不歡迎粗魯的人，要是你再這樣，我就要請柏燼叔和岩蘢師傅過來了！」","把檔案夾緊緊護在胸前，皮膚上的黑字全都豎起尖銳的筆鋒，她咬著唇戒備地盯著玩家。"],"A06_REACT_FRIENDLY_01":["「我就知道你跟其他笨大人不一樣！你相信我對不對？那我們拉勾勾，以後我發現新的祕密，第一個告訴你！」","眼睛瞬間亮得像星星一樣，伸出短短的小拇指要跟玩家拉勾。"]};

const aff=k=>(S.aff&&S.aff[k])||0;
function addAff(k,d){S.aff=S.aff||{};S.aff[k]=Math.max(-60,Math.min(150,aff(k)+d))}
const affTier=k=>{const a=aff(k);return a<-20?0:a<30?1:a<60?2:a<90?3:a<120||((S.kq||{})[k]||0)<2?4:5};
const AFFN=['疏遠','普通','熟識','信賴','摯友','羈絆'];
function affMark(k){if(!CHATID[k]||!(S.met&&S.met[k]))return '';const t=affTier(k);return t===1?'':`<i class="afm t${t}">${t===0?'…':'♥'.repeat(t-1)}${AFFN[t]}</i>`}
const priceMul=k=>[1.2,1,.9,.85,.8,.7][affTier(k)];

WLINE.chen=Object.assign(WLINE.chen||{},{clear:["把酒館大門敞開到最大，拿著抹布站在門檻邊，看著街上曬太陽的村民笑呵呵地招呼。", "「大晴天就該敞開門做生意！今天後院曬的蘿蔔乾正好收下來，拿來配熱湯最爽口，進來坐！」"],cloudy:["往爐子裡多添了兩塊耐燒的硬木炭，把鍋蓋掀開一條縫讓熱氣散出來。", "「這種悶沉沉的陰天最容易讓人沒胃口。我在湯裡多拍了兩顆老薑、撒了把胡椒，喝一碗保準你通體舒暢。」"]});
WLINE.sang=Object.assign(WLINE.sang||{},{clear:["站在村莊廣場中央，仰頭看著亮堂堂的太陽，搓著手露出如釋重負的笑容。", "「出太陽好啊、出太陽好！太陽光一照，村裡到處亮亮堂堂的，什麼陰暗角落裡的怪念頭都藏不住，沒事的、沒事的！」"],cloudy:["望著頭頂壓下來的灰雲，搓手的速度又快了幾分，時不時往村西頭張望。", "「這天色怎麼陰沉沉的……應該只是普通的變天吧？對，肯定是快到換季的時候了，沒事的，大家照常幹活就行。」"]});
WLINE.su=Object.assign(WLINE.su||{},{clear:["將夢途驛的竹簾捲起一半，讓斜射進來的陽光剛好落在桌角一排晾曬的舊信封上。", "「晴天的風比較乾，適合把死信櫃底層那些受潮的舊信拿出來透透氣。不過不能直曬太久，有些老墨水見不得強光。」"],cloudy:["往青銅小香爐裡多添了一勺乾燥的苦艾草，青煙在氣壓偏低的室內緩緩盤旋。", "「陰天裡空氣沉，信紙上的舊氣味散不出去。你要是覺得屋裡味道太悶，可以把門留一條縫。」"]});
WLINE.sui=Object.assign(WLINE.sui||{},{clear:["蹲在陽光底下，拿著一片綠葉子幫幾隻爬出來的紅殼蝸牛遮太陽，鼻尖上全是細汗。", "「今天太陽公公好燙喔！石碑上的字都在曬太陽打瞌睡，動都不動一下，連蝸牛都不敢爬太快啦！」"],cloudy:["仰起小腦袋盯著灰撲撲的天空看了半天，伸出小手在空氣裡抓了抓。", "「天上的雲黑黑重重的，好像裝滿了還沒掉下來的水窪。這時候去老槐樹下面翻石頭，最容易找到躲起來的潮蟲了！」"]});
WLINE.yan=Object.assign(WLINE.yan||{},{clear:["難得把工坊的側窗推開，拿粗布擦了一把額頭上的熱汗，手里的鐵鎚敲得震天響。", "「大晴天打鐵最痛快！爐火旺、風箱燥，打出來的刀坯子沒有半點水氣，淬火的時候那聲響才叫一個脆！」"],cloudy:["提著防風鐵燈籠繞著鐵砧走了一圈，伸手摸了摸微微泛潮的石桌表面。", "「陰天空氣裡頭全是暗水氣，最容易讓剛開刃的生鐵長紅鏽。今天誰也別想偷懶，所有收回來的武器全都得給我多抹一層油！」"]});
WLINE.zh=Object.assign(WLINE.zh||{},{clear:["把木椅往大廳窗邊有陽光的地方挪了半尺，雙手攏在毛毯上閉目養神。", "「……外頭有太陽吧？我這雙老眼睛雖然怕亮，但讓日頭曬一曬毯子，腿骨裡頭也能少疼兩個時辰。」"],cloudy:["把舊羊毛毯裹得嚴嚴實實，枯瘦的手指隔著毯子用力按壓著膝蓋關節，呼吸有些沉重。", "「還沒下雨，我這雙腿就先知道了。地底下的寒氣正順著石頭縫往上頂呢……今天下去，別在第六層待太久。」"]});
WLINE.ye=Object.assign(WLINE.ye||{},{clear:["站在窗邊溫暖的陽光裡，挽起袖子讓陽光灑在小臂上，皮膚上的細小黑字游動得格外舒展。", "「頁生族最喜歡晴天了！曬過太陽之後，我身上的皮膚暖暖的，連上面記著的字聞起來都有一股新曬乾草紙的香味呢。」"],cloudy:["低頭看著自己手腕上聚攏成一團、游動速度明顯變慢的墨色文字，輕輕呵了一口熱氣。", "「今天天氣陰陰的，我手上的字好像也有點犯睏，全都縮在袖口裡面不肯出來排隊了。」"]});
const NLINE={bai:["用鐵剪剪短了矮油燈燒焦的燈芯，大廳裡只剩下他桌前這一豆昏黃的火光。", "「這麼晚還沒睡？夜裡地底下的動靜比白天亂，沒什麼十萬火急的差事，就別在這個鐘點往地窖裡鑽。」"],mo:["一邊打著小哈欠，一邊揉著眼睛核對最後一頁歸隊名冊，腦袋一點一點的。", "「呼……總算把今天的帳都對完啦。外頭夜風涼，你要是剛回來，快去喝碗熱水早點歇著吧，我也準備鎖櫃檯囉。」"],chen:["酒館外頭掛起了防風燈籠，他擦著最後幾隻酒杯，店裡瀰漫著濃鬱的麥酒與滷肉香。", "「夜深了，外頭的野狗都找地方窩著了，只有我這兒還熱鬧。來，忙了一整天，坐下來喝口溫酒解解乏。」"],sang:["手裡提著一盞微弱的竹編燈籠在街角巡視，聽見風吹草動就緊張地停下腳步。", "「這麼晚了還在街上走動啊？夜裡視線不好，老街那邊的路不平，你早點回地方站歇著吧，外頭有我看著呢。」"],su:["只點了一盞罩著青紗的風燈，隔著薄手套用指腹安靜地摩挲著一張沒有字跡的收據。", "「大多數沒有寄件人的夢郵，都是在後半夜自己出現在郵筒里的。夜裡萬物安靜，那些白日裡聽不見的寄件人，才敢把信遞出來。」"],sui:["抱著裝滿石頭的小布兜站在屋簷下，揉了揉惺忪的睡眼，小聲地跟路過的你打招呼。", "「噓——張嬸叫我快點去睡覺了，說夜裡不睡覺的小孩會被地底下的大鐘吸走名字。你也快去睡覺喔，晚安！」"],yan:["工坊裡只剩下鍛造爐還沒熄滅的暗紅炭火，她坐在矮凳上，就著燈籠光用磨刀石一下一下推著刀刃。", "「白天的粗活幹完了，夜裡安靜，正好幹點磨刃、修暗扣的細活。你要是睡不著，就坐旁邊聽我磨刀，別擋著光就行。」"],zh:["整個人幾乎融進了大廳角落的黑暗裡，只有睜開眼時，渾濁的眼珠偶爾映出一點遠處的壁爐火光。", "「老了，夜裡總是睡不超過一個時辰。你去睡你的吧，大廳這扇門我替柏燼盯著，有什麼不對勁的風吹草動，我會敲拐杖。」"],ye:["借著檔案架旁的油燈整理卷宗，指尖點了點卷宗角落一枚不知何時落下的狐狸尾巴形狀墨點，神色有些困惑。", "「夜裡大廳好安靜喔……對了，剛才我低頭抄書的時候，旁邊的空白頁上多了一枚像狐狸尾巴的小墨點。不是我點的，真是奇怪呢。」"]};
const BOND={bai:[{"a": "拉開抽屜拿印泥時，手指在一枚邊角磨平、沒有刻名字的舊鐵徽章上停了一下，隨即把它撥到角落。", "s": "「看什麼？這是我年輕時戴的頭一枚徽章，那時候暮簡村的地方站還只是間漏風的木棚子。跟我同一批進站的四個人，後來兩個轉行去了外鎮，一個留在了地底下。人吶，能活到坐下來管帳，靠的從來不是刀快，是知道什麼時候該把同伴拽回來。」"}, {"a": "陰天裡左肩隱隱作痛，他難得沒有硬撐，而是倒了一杯熱水暖手，看著牆上的舊站籍框。", "s": "「二十年前那場『大消失』發生的時候，我剛接手站長第三天。一覺醒來，站裡少了一半的床位，村裡人卻笑呵呵地問我為什麼多準備了那麼多雙筷子。我那時候年輕氣盛，拿著舊名冊挨家挨戶跟人吵，結果除了把大夥兒嚇哭，什麼都沒留住。」"}, {"a": "深夜大廳沒別人時，他從貼身內袋摸出一塊邊緣燒焦的舊懷錶殼，放在桌上推到你看得見的地方，眼神沉靜。", "s": "「其實二十年前消失的人裡頭，有一個是我本來打算年底娶進門的人。到了今天，我連她的眉眼和聲音都忘乾淨了，只記得她手腕上常戴著這塊壞掉的錶。所以我才死守著這個破地方站——我不指望把死帳翻活，我只求這輩子別再看著身邊的人，連個響動都沒有就沒了。你明白我的意思吧？給我活著回來。」"}],mo:[{"a": "把算盤珠子一顆顆歸位，不好意思地摸了摸自己總是綁得有點歪的髮帶。", "s": "「其實我剛來地方站的時候，連委託單的等級都分不清楚，頭一個月還把要給老陳的鹽巴錢算錯了兩次。那時候我躲在柴房裡哭，以為柏燼叔一定會把我趕走，結果他只是把算盤扔給我，叫我罰抄三遍價目表。從那天起我就發誓，絕對不能再讓站裡的人替我操心了。」"}, {"a": "從櫃檯最底下的小木盒裡拿出一疊用紅線捆好的車票與舊信封，手指輕輕摩挲著上面模糊的字跡。", "s": "「我是外鎮來的，爹娘在我十歲那年去跑南邊的商路，之後就再也沒寄過信回來。鎮上的人都說他們早就沒了，叫我別再每個月去驛站等。後來我聽說暮簡村有個能收『死信』的夢途驛，就一個人背著包袱跑來應徵了……雖然到現在還沒等到，但幫大家把信和委託收好，我心裡就覺得離他們近一點。」"}, {"a": "趁著傍晚沒人，她從抽屜深處拿出一本寫滿密密麻麻小字的私人小冊子，翻開最後一頁給你看，眼眶微微泛紅。", "s": "「這是我偷偷藏的『笨蛋備忘錄』，上面記著每一個來過站裡的人喜歡喝什麼茶、愛接什麼單子，當然也有寫滿整整三頁的你！我真的很怕自己哪天一覺醒來，也像忘記某些事一樣把重要的人忘掉……要是真有那麼一天，哪怕我罵你奇怪，你也一定要拿這本冊子敲我的腦袋，好不好？」"}],chen:[{"a": "放下手裡的擦杯布，捲起左臂的袖子，露出一道從手腕一直延伸到手肘內側的陳年刀疤。", "s": "「別光看我現在整天圍著灶台轉，二十五年前我也是提著大刀下過地窖的人。這道疤就是在第三層為了搶一塊石骨留下來的，那時候年輕不懂事，覺得能換積分的就是好東西。後來看著身邊的搭檔一個個折在下面，我才算想通了——金銀鐵塊都是冷的，只有進了肚子的熱湯是暖的。」"}, {"a": "指了指酒館牆上那口早就停擺、連指針都鏽住的破木鐘，拿起酒壺給自己倒了一小杯麥酒。", "s": "「村裡的新人總愛問我為啥叫『陳舊鐘』這麼個怪名字。二十年前那場大消失過後，我店裡原本坐滿的一桌老酒友全沒了影，只剩下牆上那口鐘在那天半夜自己崩斷了發條。我把自己的原名塗了，改叫這個名字，就是提醒自己：就算外頭的鐘全停了，我這口鍋裡的火也不能滅。」"}, {"a": "打烊後把一串磨得發亮的備用銅鑰匙放在吧檯上，難得沒擦杯子，只是安靜地看著爐火。", "s": "「我這輩子沒成家，半個村子的人都是我看著長大的。每次你們這幫小子往地窖裡鑽，我這心裡其實都懸著一塊大石頭，生怕自己熬好的湯又成了沒人喝的退件。聽著，不管你在底下遇到多邪門的事，只要看到我這店門縫裡還透著光，就只管推門進來，老陳永遠給你留著最後一碗熱湯。」"}],sang:[{"a": "搓著手嘆了口氣，低頭看著自己那雙連指甲縫裡都夾著陳年墨漬卻洗不掉的手掌。", "s": "「我知道村裡年輕人背後都笑我膽小，只會搓著手說『沒事的』。可暮簡村不比外頭的大城鎮，我們就守在無字地窖腦門頂上，幾十戶人家全靠種點耐陰的麥子和給公會做後勤過活。我要是帶頭慌了神，這村子不出三天就得散夥啊。」"}, {"a": "站在村公所的窗邊，看著遠處小穗跑過的身影，雙手緊緊抓著窗框，不再搓手。", "s": "「二十年前那場變故的時候，我還只是老村長身邊抄文書的小夥計。那天早上老村長連人帶印章一起沒了，全村人除了我和柏燼，誰都想不起前一天當家的是誰。是我硬著頭皮把村長印撿起來蓋了章，從那天起我就怕極了天亮，總怕哪天早上醒來，連我自己也成了沒人記得的孤魂野鬼。」"}, {"a": "從懷裡掏出一把生鏽的小銅鎖和一頁從未公開過的舊戶口殘頁，顫巍巍地交到你手邊，老淚縱橫。", "s": "「其實去年簷下路開始出事的時候，我就知道捂不住了。我把地圖改了，每天喝三大碗安神茶騙自己沒事，可夜裡一閉上眼，那些不見了的街坊鄰居就在我夢裡敲門。我這把老骨頭沒幾年好活了，不求你替我保密，只求你……萬一哪天連我也被地底下收走了，幫我照顧好村裡那些不知情的孩子。」"}],su:[{"a": "緩緩摘下那雙從不離手的灰布薄手套，露出指尖因為長年接觸封蠟與腐蝕性古墨而留下的淺褐色印記。", "s": "「很多人以為我戴手套是因為愛乾淨，其實是因為我的手指對紙張的記憶太敏感了。不隔著一層布，只要摸到那些從地底下帶上來的死信，寫信人當時發抖的心跳和冷汗就會順著指尖傳進來。看守夢途驛的第一課，就是學會把別人的悲傷隔在手套外面。」"}, {"a": "從死信櫃最頂層的暗格裡取出一封沒有貼郵票、信封已經泛黃變脆的舊信，輕輕放在香爐旁烘著。", "s": "「我之所以留在暮簡村，是因為這封二十年前從地窖裂縫裡飄出來的信。上面的收件人寫著我的乳名，字跡跟我母親一模一樣，可我母親在我記事前就不在了。我查了整整六年，還是沒能查出這封信是從哪一層寄出來的，但我知道，答案一定在第九層後面的某個地方。」"}, {"a": "沒有戴手套，直接用微涼卻乾淨的指尖輕輕碰了碰你的手腕，眼神清澈而認真。", "s": "「你的脈搏很穩，身上也沒有沾染那種快要被抹去名字的死灰味。在夢途驛待久了，我看過太多人最後變成了一張輕飄飄的紙片。答應我，如果有一天你在地底深處迷了路，記得找一找苦艾草的香味——我會一直在地面上替你點著香爐，只要你寫一封信寄回來，我就一定能把你找回來。」"}],sui:[{"a": "把自己的小布兜倒過來抖了抖，掉出幾顆光滑的鵝卵石、半截斷掉的木梳，還有一枚乾掉的紅殼蝸牛殼。", "s": "「這些全都是我撿到的寶貝喔！村裡的大人好笨，東西掉在地上過兩天就忘了是誰的，只有我會幫他們撿起來收好。上次張嬸把這半截木梳扔掉，還罵我撿垃圾，可是木梳在泥巴裡哭得好傷心，說它還想幫人梳頭髮呢！」"}, {"a": "抱著膝蓋坐在村口石碑旁邊的台階上，小臉貼在膝蓋上，聲音比平時小了一點。", "s": "「其實我娘以前也看得見石碑上的字喔。在我很小很小的時候，她半夜會牽著我的手來石碑邊，指著上面一個個發光的字教我唸。後來有一天她去西邊的巷子找東西，就再也沒回來了，村裡的大人還騙我說我從來都是吃百家飯長大的，根本沒有娘……我才沒有做夢，他們才是大騙子。」"}, {"a": "用一根沾了水的小樹枝，在你的手心裡一筆一畫、無比認真地畫了一個歪歪扭扭的太陽和一個小人。", "s": "「我不會寫很難的字，但是我把你的樣子畫在我手心裡，也畫在你手心裡了！這樣就算石碑上的字把全世界的大人都吃掉了，我只要低頭看一眼手心，就絕對不會忘記你！所以你每次去地底下，都要快點回來陪我玩，不然手心裡的水乾掉了，我就要重新畫一遍啦！」"}],yan:[{"a": "提起那盞沉甸甸的黃銅防風燈籠，用指節敲了敲燈籠底座一處厚實的雙層包邊。", "s": "「問我為什麼大白天也在工坊裡提著這盞破燈籠？岩心族本來是住在地脈深處的礦工，最懂黑暗裡的石頭有多滑頭。地面上的太陽光太飄了，照不見鐵器裡頭的暗裂紋，只有自己親手點著的礦油燈，火色才最老實。」"}, {"a": "拉開工坊角落一塊蓋著油布的石台，上面整整齊齊擺著七八把沒有人來領取的長劍與護腕，每一件都擦得鋥亮。", "s": "「我以前在北邊的大礦城開鋪子，手藝好，來找我打兵器的名門弟子排到街口。可那些人拿著我打的刀去爭名奪利，死了都沒人替他們收屍。後來我厭了，搬來這座偏僻的暮簡村——可沒想到這裡更邪門，定做這幾把劍的主人全在底下沒了名字，連定金都成了死帳。但我每天還是照樣給它們上油，只要鐵還在，我就認這筆單子。」"}, {"a": "從爐火最深處夾出一小塊鍛打了千百次、泛著暗金色澤的「岩心母鐵」，塞進你手裡，語氣難得沒有半點暴躁。", "s": "「這是我們岩心族每個人出生時，長輩從本命礦脈上敲下來的母鐵，平時誰碰我跟誰急。我看你這個人，心性比我見過的大多數石頭都硬實。這塊鐵你貼身帶著，不管底下那幫髒東西怎麼刮別人的名字，只要你懷裡還揣著我的母鐵，我就能順著金石共鳴把你從地縫裡刨出來！」"}],zh:[{"a": "掀開蓋在腿上的舊羊毛毯一角，露出小腿上幾道如同灰白色樹根般盤繞在皮肉上的陳年凍痕。", "s": "「年輕時覺得自己天不怕地不怕，只要手裡有劍，無字地窖第九層也能闖一闖。結果到了第六層，聽見那頭空鐘獾胸口的鐘響了三聲，我手裡的劍就重得像山一樣再也舉不起來了。人總得摔過一次狠的，才知道有些門不是靠力氣就能劈開的。」"}, {"a": "從毯子夾層裡摸出三個已經乾扁發黑、連標籤都磨平了的舊藥水木塞，在枯瘦的掌心裡輕輕滾動。", "s": "「二十年前我帶過一支四個人的小隊下第六層。上來的時候，只有我一個人爬出了地窖口，可我懷裡明明揣著四個人的乾糧袋。柏燼問我另外三個人叫什麼名字，我張開嘴，卻連一個音節都吐不出來，只剩這三個喝空的藥瓶木塞還在口袋裡咯咯響。從那天起，我就再也沒離開過這張椅子。」"}, {"a": "把那條蓋了二十年的舊毛毯往旁邊拉開一點，拍了拍木椅旁邊一個從不讓人坐的小矮凳，渾濁的眼底泛著微光。", "s": "「這二十年裡，我每次給準備下地窖的年輕人塞藥水，心裡都在賭他們能不能全須全尾地把藥瓶帶回來。你是頭一個走過了第九層、還能記住所有人名字回來見我的人。等哪天你把底下那筆爛帳徹底查清了，拿壺老陳的甜麥酒來坐這張矮凳，我把當年沒能說出口的那三個空位，好好跟你講一講。」"}],ye:[{"a": "將兩隻手腕併攏在一起，讓上面游動的細小黑字像排隊過橋一樣，從左手腕游到右手腕。", "s": "「我們頁生族在外面其實很少見，因為族裡的老人都守在很遠的藏書谷裡，一輩子只抄寫死人的舊書。我不喜歡那種乾巴巴的日子，我想記活人熱熱鬧鬧的故事，所以才偷偷跑出來考進了渡鴉公會。你看，現在我身上的字比在族裡的時候活潑多了呢！」"}, {"a": "有些不安地拉開衣領一角，鎖骨下方浮現出幾行顏色偏灰、筆畫卻異常工整的陌生路標字跡。", "s": "「我只敢跟你一個人說……最近我睡覺的時候，總覺得耳邊有那種羽毛筆刮過紙張的沙沙聲。每次醒來，我身上就會多出幾行我從來沒聽過、也沒走過的地底路名，想拿熱水洗都洗不掉。我有點害怕，如果我身上的空白全被這些陌生的路寫滿了，我還會是我自己嗎？」"}, {"a": "伸出左手，指尖點在自己心口正上方的位置——那里的皮膚白皙溫潤，被一圈溫柔的小字圍出了一小塊絕對不讓其他字游進去的空白，臉頰微紅。", "s": "「不管那些奇怪的路標怎麼往我身上爬，我心口這一塊地方，是我死死守住的空白。我已經在裡面寫下了你的名字，還用我們頁生族最古老的結繩筆法鎖住了。哪怕有一天我手腕上的字全都變成了我不認識的迷宮，只要你叫一聲我的名字，我就一定能順著心口這行字找到回來的路。」"}]};
REQ.bai=(REQ.bai||[]).concat([{need:{wax:2},sa:"用手指敲了敲桌上快見底的封泥盒",say:"「站裡封存機密卷宗用的火漆快見底了，你下頭三層的時候，順手幫我刮幾塊乾淨的『燭淚蠟』回來，別混進太多青苔渣子。」",da:"接過蠟塊放到油燈邊烤軟試了試黏性，點頭蓋章",done:"「成色夠純，封在鐵匣子上連水氣都透不進去，這筆公會積分算你應得的。」",rew:()=>{S.pts+=30;return '積分 +30'}},{need:{},cond:()=>S.maxF>=4,sa:"壓低聲音指了指地窖結構圖",say:"「最近頭三層往第四層冒上來的書霧比往常濃，你去交界處轉一圈，回來告訴我那邊的石骨通道有沒有新的裂縫。」",da:"聽完回報後在結構圖上重重畫了一道記號",done:"「原來只是舊風口鬆動了，沒出大亂子就好，拿著這份補給去歇著吧。」",rew:()=>{S.torch+=10;S.potion++;return '火把 +10、藥水 ×1'}}]);
REQ.mo=(REQ.mo||[]).concat([{need:{ink:1},sa:"舉起已經寫不出黑字的沾水筆，苦著一張臉",say:"「外頭商隊送來的普通墨水太稀了，一碰到雨天報表就糊成一團！聽說書霧迴廊裡能收集到不褪色的『書霧墨』，你幫我帶一小瓶回來好不好？」",da:"開心地用新墨水在紙角畫了一朵小花，眼睛發亮",done:"「哇，真的半點都不會暈開耶！太謝謝你了，這是你的公會積分和站裡獎勵的小點心！」",rew:()=>{S.pts+=20;S.calm++;return '積分 +20、清心露 ×1'}},{need:{moss:3},sa:"揉了揉發酸的手腕，指著硬邦邦的木頭印章墊",say:"「每天蓋幾百個章，震得虎口都麻了。要是能有幾團第一層那種軟綿綿的『苔絨』拿來鋪印章墊，蓋起章來一定又快又清楚！」",da:"把烘乾的苔絨塞進布袋試蓋了一下，笑得眉眼彎彎",done:"「軟呼呼的好舒服！以後給你蓋完成章的時候，我一定給你蓋得最端正！」",rew:()=>{S.pts+=20;return '積分 +20'}}]);
REQ.chen=(REQ.chen||[]).concat([{need:{bone:3},sa:"彎腰拍了拍酒館灶台底下裂開的一塊墊爐石",say:"「熬大骨湯講究文火慢煨，灶底那塊壓火石裂了，湯老是沸過頭。你去燭苔區幫我撿幾塊帶著地底餘溫的『骨片』回來墊灶底，回來請你喝頭鍋湯！」",da:"拿鐵鉗把骨片塞進灶膛，聽著鍋裡咕嘟咕嘟的均勻響聲大笑",done:"「就是這個火候！拿去，公會積分我幫你簽了，這罐剛滷好的肉乾你也順手揣走！」",rew:()=>{S.pts+=20;S.soup++;return '積分 +20、老陳的熱湯 ×1'}},{need:{wax:2},sa:"指著後院剛釀好的一排甜麥酒罈子",say:"「這幾天下雨潮氣太重，普通黃泥封不住酒罈口，再漏氣一整罈好酒就全酸了。幫老陳去底下弄點厚實的『燭淚蠟』回來封罈子！」",da:"看著封得嚴絲合縫的酒罈，滿意地拍了拍手",done:"「這下哪怕再下一整個月的雨也不怕跑味了，謝啦，等開罈那天頭一杯留給你！」",rew:()=>{S.pts+=25;return '積分 +25'}}]);
REQ.sang=(REQ.sang||[]).concat([{need:{moss:3},sa:"搓著手往村公所漏風的木窗看了一眼，縮了縮脖子",say:"「一到晚上，外頭的風吹過窗縫就嗚嗚響，聽得人直犯嘀咕。聽說地窖淺層的『苔絨』曬乾了最能隔音擋風，你能不能幫我捎兩把回來？沒事的，我就是想睡個安穩覺。」",da:"把苔絨塞進窗縫裡，聽著屋裡瞬間安靜下來，長長舒了一口氣",done:"「哎呀，耳根子總算清淨了，沒事了、沒事了，這份公會積分和草藥你快收好！」",rew:()=>{S.pts+=25;S.bandage++;return '積分 +25、繃帶 ×1'}},{need:{},cond:()=>S.maxF>=6,sa:"左右張望確認沒人後，湊過來小聲搓手",say:"「這兩天半夜我總覺得腳底板在震，是不是第六層那口鐘又在響了？你下去的時候幫我聽聽動靜，只要那位守門的還安分，我這心就能放回肚子裡了。」",da:"聽說鐘聲已經平息，連忙拍著胸口點頭",done:"「安靜下來就好、安靜下來就好！辛苦你跑這一趟，千萬別跟街坊們多提啊。」",rew:()=>{S.pts+=30;return '積分 +30'}}]);
REQ.su=(REQ.su||[]).concat([{need:{ink:1},sa:"用鑷子指著一封字跡幾乎完全剝落的殘信",say:"「這封死信是用地底舊墨寫的，地面上的普通墨水補不進它的筆畫裡。如果你去書霧迴廊，幫我帶一管純正的『書霧墨』回來，我想試著把收件人的姓氏引出來。」",da:"將書霧墨滴在紙背，看著浮現出的半個偏旁，微微頷首",done:"「墨性剛好，被蓋住的筆跡已經顯出來了。謝謝你，這是夢途驛撥給你的積分與安神香。」",rew:()=>{S.pts+=20;S.calm++;return '積分 +20、清心露 ×1'}},{need:{bone:3},cond:()=>S.maxF>=7,sa:"晃了晃手裡已經出現裂紋的骨製拆信刀",say:"「越往深處帶上來的信，封口的灰泥就越硬，我這把舊骨刀快挑不開了。幫我去下面找一塊質地細密的『骨片』，我好磨一把新的拆信刀。」",da:"隔著手套摸過骨片平滑的斷面，眼神溫和了些許",done:"「比我預想的還要堅韌，還帶著一點冷香，很適合拿來開信，辛苦你了。」",rew:()=>{S.pts+=30;return '積分 +30'}}]);
REQ.sui=(REQ.sui||[]).concat([{need:{moss:2},sa:"雙手捧著一隻殼上裂了一道小縫的紅殼蝸牛，急得直跺腳",say:"「你看，小紅從石碑上掉下來摔破殼了，晚上睡在石頭上一定很痛！聽說地窖第一層有像綠色雲朵一樣軟的『苔絨』，你幫我撿一團回來給牠鋪床好不好？」",da:"小心地把蝸牛放進綠絨絨的苔蘚團裡，開心地蹦了起來",done:"「哇，軟綿綿的！小紅把觸角伸出來跟你說謝謝啦，這顆最亮的石頭和許茉姊姊蓋章的積分單給你！」",rew:()=>{S.pts+=15;S.mats.bone+=1;return '積分 +15、骨片 ×1（最亮的那顆石頭）'}},{need:{},cond:()=>S.maxF>=6,sa:"拽著你的衣角仰起小臉，眼睛睜得圓溜溜的",say:"「我昨天把耳朵貼在地上，聽到下面有一隻大肚子的獾在敲鐘！牠長得像毛茸茸的大狗嗎？下次你去第六層看牠的時候，回來講給我聽好不好？」",da:"聽完你描述空鐘獾抱著鐘安靜打盹的樣子，雙手捧著臉頰發出一聲驚嘆",done:"「原來牠不是壞怪物，只是幫大家守著舊本子呀！你講的故事比大人好聽一百倍！」",rew:()=>{S.pts+=15;addAff('sui',5);return '積分 +15'}}]);
REQ.yan=(REQ.yan||[]).concat([{need:{bone:4},sa:"拿鐵鎚敲了敲砧子上一塊脆裂的生鐵，嫌棄地皺眉",say:"「外鎮送來的這批生鐵太脆，打刀背容易折。去地窖底下幫我撿幾塊分量沉、敲起來噹噹響的『骨片』來，我磨成骨粉摻進爐裡給鋼水補補骨頭！」",da:"接過骨片往石桌上一磕，聽見清脆的金石聲後咧嘴一笑",done:"「好貨色！夠硬夠密實，拿這東西鍛出來的刀刃絕對不捲口，拿著你的報酬去吧！」",rew:()=>{S.pts+=25;return '積分 +25'}},{need:{wax:3},sa:"擦掉指尖的礦粉，指了指牆角一排剛打磨好的鐵槍頭",say:"「這批新打的槍頭要下地窖，光抹豬油防不住底下的酸苔氣。你去幫我刮幾斤上好的『燭淚蠟』回來，我化開了給刃口上一層蠟衣。」",da:"把蠟塊扔進滾燙的鐵鍋裡，聞著飄出來的松脂白蠟味滿意點頭",done:"「份量足！有了這層蠟，底下那些酸苔休想咬壞我打的鐵器，謝啦！」",rew:()=>{S.pts+=30;return '積分 +30'}}]);
REQ.zh=(REQ.zh||[]).concat([{need:{wax:2},sa:"隔著舊毛毯按了按發僵的膝蓋，沙啞地低咳了一聲",say:"「這兩天陰氣重，腿骨裡頭的舊寒氣又在往上竄。要是順路經過頭三層，幫我老頭子撿兩塊帶著微光的『燭淚蠟』回來，化在草藥裡敷腿能頂半個月。」",da:"接過還帶著一絲微溫的蠟塊揣進毯子裡，緊繃的眉頭舒展開來",done:"「……有心了。這瓶我剛配好的保命藥水和積分單你拿著，下去自己多留神。」",rew:()=>{S.pts+=20;S.potion++;return '積分 +20、藥水 ×1'}},{need:{},cond:()=>S.maxF>=7,sa:"渾濁的眼睛在暗處看著你，猶豫了半晌才壓低聲音",say:"「我這雙腿是走不到第七層下面去了……你這趟要是往『褪名深處』走，幫我留心看看，底下那些散落的名牌裡，還有沒有刻著『舊字輩』的銅牌。看一眼就行，別硬撿。」",da:"聽你說完底下的動靜後，沉默地閉上眼點了點頭",done:"「……都散成白灰了也好，總比被困在石頭縫裡強。謝謝你替我這把老骨頭看了一眼。」",rew:()=>{S.pts+=35;return '積分 +35'}}]);
REQ.ye=(REQ.ye||[]).concat([{need:{ink:1},sa:"挽起袖子展示手腕上幾行稍微有些乾澀發淡的小字",say:"「這幾天抄寫的卷宗太多了，我手腕上的字都有點渴了。聽說第四層以後的『書霧墨』帶著千百年的文字靈氣，你能不能幫我帶一小滴回來讓我養一養字？」",da:"將一小滴書霧墨點在手腕上，看著整條手臂的墨字瞬間變得烏黑靈動，開心地笑出聲",done:"「你看，它們喝飽墨水之後游得多開心呀！謝謝你，這是給你的公會積分和整理好的情報抄本！」",rew:()=>{S.pts+=20;S.clues++;return '積分 +20、線索 +1'}},{need:{},cond:()=>S.maxF>=9,sa:"抱著空白的備份羊皮紙，眼神裡既有一絲敬畏又充滿期待",say:"「我還沒聽人完整講過第九層最深處的樣子呢。你從下面回來之後，可以把千頁紙鴉和那扇門周圍的風景講給我聽嗎？我手背上留了最好的一塊地方準備記下來！」",da:"一邊聽你講述，小臂上的黑字一邊飛快地排列成行，她輕輕摸著微熱的皮膚",done:"「原來深處是那樣的光景……我已經一字不漏地記在身上了，只要我還在，這段路就絕對不會被忘記！」",rew:()=>{S.pts+=50;return '積分 +50'}}]);

const KGREET={bai:['把一杯熱水推到你面前。','「回來了。名冊上，你的名字我畫了圈。」'],mo:['從櫃檯後面跳出來。','「你回來了！今天的笨蛋備忘錄，第一頁又是你！」'],chen:['不用你開口，湯已經端上桌了。','「坐。你的位子，我一直留著。」'],sang:['這次沒有搓手。','「看到你，我就知道是真的沒事了。」'],su:['摘下手套，碰了碰你的手腕。','「心跳很穩。苦艾的味道還在。」'],sui:['衝過來抱住你的腿。','「你回來了！手心的畫還在嗎？給我看！」'],yan:['把母鐵往你那邊推了一點。','「它今天特別熱。大概是知道你要回來。」'],zh:['把那張矮凳往你這邊挪了挪。','「坐吧。……第四個木塞，還沒用上。很好。」'],ye:['手臂上的字一起轉向你。','「你回來了。它們一直在等你。」']};
const KQX={"bai": [["柏燼叔從貼身內袋裡摸出那個邊緣燒焦的舊懷錶殼，指腹輕輕摩挲著玻璃上那道裂縫。", "「懷錶殼上的玻璃裂透了，再這麼揣著容易刮手。你下地窖的時候，順手幫我帶幾塊透亮的薄骨片回來，我想讓岩蘢替我磨一片新的蓋上去。……別問為什麼，去辦就是了。」", "他接過重新鑲好骨片的舊懷錶，對著油燈看了一會兒，大拇指在表蓋上輕輕擦了一下。", "「……嗯，手藝還行。這下又看得清指針了，雖然它早就不走了。」"], ["大廳裡沒別人的時候，柏燼叔放下了炭筆。他盯著桌面看了半晌，才抬眼看你，聲音比平時低很多。", "「第九層再往下，有一扇跟舊地址有關的門。我知道你已經走過去了。……我就問一句：你在那附近，有沒有見過誰的手腕上，戴著一塊壞掉的錶？」", "聽完你的回答，他沉默了很久。緊繃的肩膀反而慢慢鬆了下來，把那只修好的懷錶殼平平地推到你面前。", "「……沒有啊。也好。不在那裡，就表示她還在別的地方。這個錶殼你替我帶著吧。我這把老骨頭得守著地面上的門，下面的路，你替我多看兩眼。」"]], "mo": [["許茉抱著那本寫得鼓鼓的「笨蛋備忘錄」，苦惱地捏了捏磨毛了邊的紙皮封面。", "「我的笨蛋備忘錄快寫滿啦，紙皮都快散了，我想給它做一個最結實的新封面！聽說地窖的苔絨洗乾淨壓平以後，摸起來又軟又漂亮，你幫我帶一點回來好不好？」", "她把壓平的青綠苔絨小心地包在備忘錄外面，用臉頰蹭了蹭，眼睛彎成兩道月牙。", "「哇，軟呼呼的好舒服！……重新裝訂的時候，寫著你名字的那一頁，我要放在最前面。」"], ["許茉看著窗外暗下來的天色，難得沒有撥算盤，雙手按在備忘錄上，神情格外認真。", "「最近村裡大家忘記的事越來越多了……我想用底下那種不會褪色的書霧墨，把站裡每個人的名字重新抄一遍。這樣就算哪天我睡醒也犯迷糊，本子也會替我記得。」", "她一筆一畫抄完最後一個名字，吹乾墨跡，卻沒有把本子鎖回抽屜，而是雙手遞到你面前。", "「全都抄好了，一個人都沒漏。……這本交給你保管好不好？不管下面有多黑，我覺得你一定比我更會記得。」"]], "chen": [["老陳拿著抹布走出酒館，抬頭看了一眼屋簷下那盞玻璃燻黑、火苗忽明忽暗的舊門燈。", "「門口那盞老風燈，算起來二十年沒換過燈芯了。普通燈油禁不起夜裡的冷風，你下去的時候幫我捎點耐燒的燭淚蠟回來，我想讓它亮久一點。」", "他踩著板凳換上浸過燭淚蠟的新燈芯，橘黃色的火光一下子穿透了門前的夜霧。", "「亮堂多了。……只要這扇門縫裡還透著光，你們從底下上來的時候，就知道該往哪兒推門。」"], ["老陳把擦亮的酒杯往吧檯上一扣，雙手撐著桌面湊近了些，臉上帶著點別扭。", "「看你們這幾天往底下跑得那麼勤，我尋思著熬一鍋只給你們喝的壓驚湯。手藝和肉骨頭我出……行吧，底下的骨片和苔絨還得你去跑一趟。」", "他盛出一大碗熱騰騰的濃湯放在你面前，順手把一把磨得發亮的黃銅備用鑰匙塞進你手心。", "「趁熱喝。這把店門的備用鑰匙你也揣著——哪天半夜從地窖爬上來，看我睡了，別在冷風裡站著，自己開門進來。灶上的鍋裡，永遠給你溫著湯。」"]], "sang": [["桑沐村長把村公所的門掩上，從袖子裡摸出那頁邊角發脆的舊戶口殘頁，手還是忍不住微微發抖。", "「我想用好一點的紙墨，把這頁二十年前的舊戶口原原本本抄一份。正本太脆了……而且我心裡有愧，實在不敢再每天打開看它了。」", "他戴著老花鏡，用你帶回來的材料抄完最後一行，看著滿紙陌生的姓名，長長嘆了口氣。", "「抄好了、抄好了。說來不怕你笑，這上面的名字我一個都認不得了。可是只要看著這些筆畫，我就知道，他們當年真真切切地在村裡活過。」"], ["村長沒有再像平常那樣搓手。他站在台階下看著你，花白的腦袋微微垂了下去。", "「……你下次往深處走的時候，能不能替我這把老骨頭，在第六層那口鐘旁邊說一聲『對不起』？我已經記不清該對誰說了，但我知道，這聲道歉我欠了太久。」", "聽說你已經把話帶到，村長繃了二十年的肩膀終於垮了下來。他從懷裡掏出一把生鏽的小銅鎖，輕輕放在你手心。", "「謝謝你。沒事的……這次不是騙自己，是真的沒事了。這把以前用來鎖舊地圖的銅鎖給你吧。從今天起，我再也不需要把什麼東西鎖起來了。」"]], "su": [["蘇眠砂打開青銅香爐的蓋子，用小銀匙撥了撥快要燒盡的香灰，抬眼看你。", "「再往下的路，連信紙上的字都會被吹散。幫我帶一點燭淚蠟和書霧墨回來，我想調一份只屬於你的香。這樣萬一你在下面迷了路，我才聞得到你在哪裡。」", "她隔著灰布手套，把剛焙乾的香料細細裝進一只素白的小布囊，湊到鼻尖輕嗅了一下。", "「調好了。苦艾混著燭蠟的味道，很乾淨。把它記在心裡。」"], ["她從死信櫃最頂層取出那封寫著她乳名的泛黃舊信，指尖停在信封娟秀的字跡上，清冷的聲音裡有了一絲極輕的波動。", "「這封二十年前飄上來的信，寫著我的小名。你已經走過第九層後面那條郵廊了……在那裡頭，你有沒有見過和這封信一樣的字跡？」", "看見你搖頭，她怔了一瞬，隨即輕輕舒了一口氣，把親手縫的苦艾香囊繫在你的行囊扣上。", "「沒有啊。……那就好。她的字不在退件廊裡，就說明還有別的地方可以找。這個香囊你貼身戴著，不管走多遠，順著這個味道回來。」"]], "sui": [["小穗蹲在石階上，雙手捧著那隻殼上裂縫已經長好的紅殼蝸牛，仰起小臉眼巴巴地看著你。", "「小紅的殼已經不痛啦！我想用軟軟的苔絨和亮晶晶的蠟塊，幫牠做一個不會漏雨的新家！你去地底下幫我撿一點回來好不好？」", "她把小蝸牛放進鋪滿苔絨的小木盒裡，看著牠慢吞吞地爬了一圈，開心地拍起小手。", "「哇，小紅好喜歡這個新家！……現在換你了，你每次從黑漆漆的地方出來，也要有一個亮亮的家可以回來喔。」"], ["小穗突然收起笑容，抓著自己的小布兜走到你面前，大眼睛一眨不眨地盯著你，伸出短短的小拇指。", "「村裡的大人最近又開始忘記好多事情了……我們來打勾勾好不好！你要一直一直回來陪我玩，絕對不可以像他們一樣忘記我喔。」", "她用小拇指勾住你的手指晃了三下，又無比認真地用大拇指在你的拇指上重重按了一下，然後把她最寶貝的星星石頭塞進你手裡。", "「打勾勾，蓋印章！……石頭給你當證據，這樣就算過了一百天，你也絕對不能反悔喔！」"]], "yan": [["岩蘢用火鉗從爐底夾出那塊泛著暗金微光的岩心母鐵，放在石砧上敲了敲，眉頭一挑。", "「我們岩心族的母鐵是有脾氣的，光靠炭火烘著不夠，得配地底深處的骨粉才養得活。去帶幾塊好骨片回來，我手把手教你怎麼養這塊鐵。」", "她把磨碎的骨粉撒在通紅的母鐵上。一陣清脆的金石共鳴聲裡，她抓過你的手，直接按在溫熱的鐵塊上。", "「感覺到它裡頭在跳了沒有？它變熱了，這是在認你的手勁呢。」"], ["岩蘢擦掉指尖的礦粉，提著防風鐵燈籠看向地窖入口，眼裡閃著工匠特有的執拗。", "「聽說第九層後面那條逆址郵廊裡，有專門給死信蓋章的退件印泥。去幫我弄一點回來，我想試試把那種連名字都壓得住的東西淬進母鐵裡，看誰還敢動你。」", "最後一錘落下，火星四濺。她把那塊淬成深沉暗金色、連地底寒氣都近不了身的母鐵護符扔進你懷裡，咧嘴一笑。", "「成了！連底下的退件印都休想在這塊鐵上留印子。拿去吧，從今天起，這塊母鐵徹底歸你了。」"]], "zh": [["鐘衡在幽暗的角落裡摸出三個乾扁的舊藥瓶木塞，枯瘦的手指在粗糙的木頭上來回摩挲。", "「……這三個木塞子跟了我二十年，上頭一直空著。我想在上面刻三個名字，可我實在記不得他們叫什麼了，只能刻三個方方正正的空格。你去幫我帶點硬骨片和濃墨回來吧。」", "他拿著小骨刀，藉著微弱的爐火，一刀一刀在三個木塞頂端刻出三個端正的方框，再塗上黑墨。", "「刻好了。雖然只是三個沒有字的空格……但好歹算是有個地方，能把他們安安穩穩地放進去了。」"], ["你帶著第九層之後的氣息回到大廳時，鐘衡難得沒有閉目養神。他拉開腿上的舊毛毯，指了指旁邊那張從不讓人坐的小矮凳。", "「你走過了第九層，推開了那扇門，居然還記得所有人的名字，全須全尾地回來了。……別站著，坐下吧。」", "那個沒人打擾的傍晚，老人用沙啞緩慢的聲音講了很久很久。等他停下來，你已經記不清他講了哪些地名，只記得他最後塞進你手心的那枚嶄新的木塞。", "「這第四個木塞，我留給你。上頭沒有刻空格，也不是咒你回不來——是要你每次下地窖都揣著它，記得把自己平平安安地帶回來。」"]], "ye": [["頁絮捲起袖子，指著手腕內側幾行因為記了太多地底見聞而有些乾澀的小字，不好意思地笑了笑。", "「最近跟你們往深處跑，我手臂上的字都有點渴了。能不能幫我多帶一點書霧墨回來？我想把皮膚養好一點，替你多記一段更長的路。」", "她把溫潤的書霧墨輕輕抹在手腕上，那些字立刻變得烏黑發亮，順著她的脈搏排成一條安穩的長線。", "「記好啦。只要這些墨還在我的皮膚上流著，我們一起走過的這段路，我就會一直替你記著。」"], ["頁絮低頭看著左手虎口那行曾經指向「逆址，退件廊」的字，眼神不再像當初那樣害怕，反而多了一分溫柔的篤定。", "「第九層後面的逆址郵廊……我手上自己浮出來的那些字，指的就是那裡，對吧？雖然我不知道它們為什麼長在我身上，但你已經帶著我安全走過一遍了，用你的眼睛。」", "她指尖輕輕點在心口那塊被結繩筆法護住、連半個陌生路標都進不去的乾淨空白上，然後把一張拓著結繩紋的宣紙書籤交給你。", "「謝謝你沒有因為我身上的怪字疏遠我。……心口這一小塊最乾淨的空白，我分了一點給你。這張書籤你收著，我們誰也不准走丟喔。」"]]};for(const k in KQX)KQX[k].forEach((x,i)=>Object.assign(KQ[k].s[i],{sa:x[0],say:x[1],da:x[2],done:x[3]}));
function curKQ(k){const Q=KQ[k];if(!Q||affTier(k)<4||((S.bond||{})[k]||0)<3)return null;const i=(S.kq||{})[k]||0;const st=Q.s[i];if(!st||(st.cond&&!st.cond()))return null;return st}
function kqGive(k){const st=curKQ(k);if(!st)return;const v=NPC[k];if(!hasMats(st.need))return {steps:[{w:v.name,s:'「東西還不夠喔。」',r:'需要：'+needTxt(st.need)}],opts:chatOpts(k,false)};payMats(st.need);S.kq=S.kq||{};S.kq[k]=(S.kq[k]||0)+1;let r='羈絆故事 '+S.kq[k]+'／2';addAff(k,S.kq[k]>=2?40:15);if(S.kq[k]>=2){const it=mkUQ(KQ[k].it);S.bag.push(it);r+='：完成！得到信物「'+it.n+'」。和'+v.name+'的關係：羈絆'}sfx('chime');save();res();return {steps:[...(st.da?[{n:st.da}]:[]),{w:v.name,s:st.done,r}],opts:chatOpts(k,false)}}
function chatOpts(k,withReplies){const m=MAINACT[k];const kid=k==='sui';const o=[];
 if(withReplies)o.push({t:'友善',g:'r',f:()=>react(k,'FRIENDLY')},{t:'冷淡',g:'r',f:()=>react(k,'COLD')},{t:kid?'大聲嚇唬':'無禮',g:'r',f:()=>react(k,'RUDE')});
 if(m)o.push({t:m[0],g:'m',p:1,f:()=>{Function(m[1])()}});{const m2=MAIN2[k];if(m2)o.push({t:m2[0],g:'m',p:1,f:()=>{Function(m2[1])()}})}o.push({t:'離開',g:'m',p:!m});return o}
function chat(k,extra){const L=pickLine(k);const v=NPC[k];const steps=[];S.chatDay=S.chatDay||{};if(S.chatDay[k]!==S.returns){S.chatDay[k]=S.returns;addAff(k,2)}const G=giftLine(k);const R=curReq(k);save();res();
 if(L)steps.push({w:v.name,a:L.act,s:L.line});if(L&&L.after)steps.push(...L.after);if(extra)steps.push({w:v.name,h:extra});if(G)steps.push(G);if(R)steps.push({w:v.name,a:R.sa,s:R.say,r:'專屬委託：'+needTxt(R.need)});if(!steps.length)steps.push({w:v.name,s:'……'});
 const op=chatOpts(k,true);{const KS=curKQ(k);if(KS){if(KS.sa)steps.push({n:KS.sa});steps.push({w:v.name,s:KS.say,r:'羈絆故事：'+(Object.keys(KS.need).length?needTxt(KS.need):'說給'+v.name+'聽')});op.unshift({t:Object.keys(KS.need).length?'羈絆故事（'+needTxt(KS.need)+'）':'羈絆故事：說給'+v.name+'聽',g:'q',p:1,f:()=>kqGive(k)})}}if(R)op.unshift({t:Object.keys(R.need).length?'交給'+(v.name.length>3?'他':v.name)+'（'+needTxt(R.need)+'）':'說給'+v.name+'聽',g:'q',p:1,f:()=>reqGive(k)});
 vn({imgs:npcImg(k),steps,opts:op,done:town})}
function react(k,t){S.rc=S.rc||{};const key=k+t;S.rc[key]=(S.rc[key]||0)+1;const n=S.rc[key]>=2?2:1;const L=dl(CHATID[k]+'_REACT_'+t+'_0'+n);S.affDay=S.affDay||{};let hint='';if(S.affDay[k]!==S.returns){S.affDay[k]=S.returns;const d=(PREF[k]||{})[t]||0;const t0=affTier(k);addAff(k,d);hint=d>=5?'（看起來很受用。）':d>0?'（表情鬆了一點。）':d===0?'（看不出在想什麼。）':'（好像不太高興。）';const t1=affTier(k);if(t1!==t0)hint+=`\n和${NPC[k].name}的關係：${AFFN[t1]}`}save();
 const o=chatOpts(k,false);if(t==='RUDE')o.splice(0,o.length-1),o[0].p=1;
 return {steps:[{...(L?{w:NPC[k].name,a:L.act,s:L.line}:{w:NPC[k].name,s:'……'}),...(hint?{r:hint}:{})}],opts:o}}
function head(k){const v=NPC[k];return (v.img?`<img class="por zoomable" src="${A(v.img)}" alt="">`:`<div class="phbig">${v.ph}</div>`)+`<h2>${v.name}<span class="note" style="font-size:12px;margin-left:6px">${v.role}</span></h2>`}
function npcBtn(k,badge,visit){const v=NPC[k];return `<button class="npc ${visit?'visit':''}" data-n="${k}">${v.img?`<img src="${A(v.img)}" alt="${v.name}">`:`<span class="ph">${v.ph}</span>`}${v.name}<br><span style="color:var(--dim)">${v.role||'　'}</span>${affMark(k)}${badge?`<i class="badge">${badge}</i>`:''}</button>`}

const GOAL=['去找柏燼叔報到','下一次地窖，回來後找許茉','討伐燭苔巨人（第 3 層）','去夢途驛找蘇眠砂','前往書霧迴廊深處，找到靜鐘長（第 6 層）','去村外的舊郵筒看看','前往褪名深處（第 9 層）','回地方站，找柏燼叔','前往第九層，打通地址之門'];
const AREAS=[{k:'hall',n:'地方站',bg:'bg_hall',need:0},{k:'village',n:'村子',bg:'bg_houses',need:2},{k:'inn',n:'夢途驛',bg:'bg_inn',need:3},{k:'post',n:'舊郵筒',bg:'bg_post',need:5},{k:'tower',n:'公會塔',bg:'bg_hall',need:2},{k:'grave',n:'墓地',bg:'bg_fog',need:1}];

const QT={
 kill:{f:q=>`討伐${FOES[q.arg].name} ${q.need} 次`,c:q=>'kill_'+q.arg},
 mat:{f:q=>`帶回${MAT[q.arg]} ${q.need} 個`,c:q=>'mat_'+q.arg},
 chest:{f:q=>`打開寶箱 ${q.need} 個`,c:()=>'chest'},
 floor:{f:q=>`抵達地窖第 ${q.need} 層`,c:()=>'deep'},
 event:{f:q=>`調查地窖裡的怪事 ${q.need} 次`,c:()=>'event'}};
const QSAY=['徽章亮了一下，浮出一行字。','徽章上的羽紋轉了半圈，寫下新的委託。','許茉：「這張是徽章自己吐出來的，我沒寫錯喔。」','委託板上多了一張，紙還是溫的。'];
const YQ=[
 {t:'被退回三次的熱湯',type:'event',need:2,pts:8,say:'陳舊鐘：「訂了三碗湯，每次送到巷口又自己回來。湯都涼了，總要有人知道為什麼。」',done:'「至少今天這碗能趁熱喝了。收據你拿著，我替你留一份。」（得到：舊貨單拓本）'},
 {t:'別讓名字掉進井裡',type:'chest',need:3,pts:10,say:'許茉：「路牌的字會掉到水上，不是比喻！你先幫我撿回來，我保證不笑你。」（在寶箱裡找路牌殘片）',done:'「終於拼起來了……咦？這個路名，我怎麼念不出來？」（得到：防潮紙套）'}];
function qProg(q){if(q.type==='floor')return Math.min(q.need,S.maxF);return Math.max(0,Math.min(q.need,(S.cnt[QT[q.type].c(q)]||0)-q.base))}
function qTitle(q){return q.t||QT[q.type].f(q)}
function newQuest(){const top=Math.min(MAXF,Math.max(1,S.maxF+1));
 if(false){const y=pick(YQ);if(!S.quests.some(q=>q.t===y.t)){const q={id:S.qid++,type:y.type,need:y.need,arg:'',pts:y.pts,mat:null,t:y.t,say:y.say,done:y.done};q.base=S.cnt[QT[q.type].c(q)]||0;return q}}
 const types=['kill','kill','mat','chest','event'];if(S.maxF<MAXF)types.push('floor');const type=pick(types);const q={id:S.qid++,type,need:1,arg:'',pts:5,mat:null};
 if(type==='kill'){const t=pick(TIERS.filter(t=>t.from<=top));q.arg=pick(t.foes);q.need=rnd(2,4);q.pts=q.need*(3+TIERS.indexOf(t)*3)}
 else if(type==='mat'){q.arg=pick(S.maxF>=3?['moss','bone','ink']:['moss','bone']);q.need=rnd(2,5);q.pts=q.need*3}
 else if(type==='chest'){q.need=rnd(2,4);q.pts=q.need*4}
 else if(type==='event'){q.need=rnd(1,3);q.pts=q.need*5}
 else{q.need=top;q.pts=8+q.need*4}
 if(Math.random()<.35)q.mat=pick(['moss','bone','wax']);q.base=type==='floor'?0:(S.cnt[QT[type].c(q)]||0);q.say=pick(QSAY);return q}
function refillQuests(){while(S.quests.length<3)S.quests.push(newQuest())}

function rotate(){rollWeather();S.returns++;S.memUsed=[];S.trainUsed=[];S.arenaUsed=[];
 if(S.returns%2===1||!S.recPool.length){const pool=CANDS.filter(c=>!c.hidden&&!S.heroes.some(h=>h.key===c.key));S.recPool=shuffle(pool).slice(0,4).map(c=>c.key)}
 const tier=S.maxF>=6?3:S.maxF>=3?2:1;S.shop=[0,1,2].map(()=>{const it=genItem(tier,10);return {it,p:Math.round(gearVal(it)*3.2),sold:false}});
 S.visitor=null;const vs=Object.keys(VIS).filter(k=>VIS[k].when()&&k!=='hood');if(Math.random()<.6&&vs.length)S.visitor=pick(vs);
 famRoll();refillQuests()}

const VIS={
 zh:{when:()=>S.story>=1,area:'hall',talk:()=>{S.potion++;return `<p>老冒險者坐在大廳最暗的角落，腿上蓋著一條舊毯子。</p><p class="say">「${pick(['越往下走，越不要相信回聲。','看到紙燈就停下來。那盞燈不是給妖怪點的。','我下過第六層。……下面的東西，記得你比你記得它還清楚。','有些名字，在地上已經沒有人記得了，在地底卻還有人叫著。','死掉的人？墓地那裡有時候會有回應。代價嘛……要看是誰回應你。'])}」</p><p>他把一瓶藥水塞給你，揮揮手，叫你別問了。</p><p class="note">獲得：藥水 ×1</p>`}},
 ye:{when:()=>S.story>=1,area:'hall',talk:()=>{S.heroes.forEach(h=>levelHero(h,10));return `<p>頁生族的記錄員攤開手臂，皮膚上的字像小魚一樣游動。</p><p class="say">「請把你們在地窖看見的東西，一樣一樣說給我聽。我會把它們寫在身上。」</p>${S.story>=4?'<p>你注意到，她手腕上有一行字，寫的是一條你們還沒走過的路。她發現你在看，把袖子拉了下來。</p>':''}<p class="note">所有活著的隊員經驗 +10</p>`}},
 sui:{when:()=>S.story>=2,area:'village',talk:()=>{S.pts+=5;S.clues++;giveKey('drawing');return `<p>小穗踮著腳，把一張皺巴巴的畫塞給你。</p><p class="say">「你看！這是石碑上的字！大人都說石碑上沒有字，可是我看到了，真的！」</p><p>畫上是一行歪歪扭扭的符號。你看了很久，總覺得它像一個地址。</p><p class="note">得到線索。小穗把她的零用錢也給你了：積分 +5</p>`}},
 sang:{when:()=>S.story>=4,area:'village',talk:()=>{if(!S.sangDone&&S.story>=4){S.sangDone=true;S.clues++;giveKey('eaves');return `<p>村長笑得很客氣，手一直在搓。</p><p class="say">「辛苦了辛苦了。地窖嘛，以前也有人下去過，都沒事的——」</p><p>你把余巷那枚生鏽的郵差徽章放在桌上。</p><p>搓手的動作，終於停了。</p><p class="say">「……去年，簷下路那邊接連有人不見。我怕村子被封起來，商人不來，就批准了……新的地圖上，暫時不印那條路。」</p><p class="say">「我拿掉的只是新地圖上一條線……我沒有拿掉那條路上的人。」</p><p>他的聲音在發抖。他不知道後來發生的事是誰做的。他只是一直很害怕。</p><p class="note">得到線索：簷下路。</p>`}
  S.pts+=10;return `<p>村長看到你，勉強笑了一下。</p><p class="say">「……如果你找到那條路的人，替我說一聲對不起。」</p><p class="note">他塞給你一點路費：積分 +10</p>`}},
 post:{when:()=>S.story>=2,area:'village',keep:1,talk:()=>{const it=VIS.post.it||(VIS.post.it=genItem(S.maxF>=6?3:2,25));const p=Math.round(gearVal(it)*3.5);return `<p>一個背著暗紫色郵袋的分信員在廣場歇腳。</p><p class="say">「地窖裡撿到的東西，有時候會被寄到我這裡來。要不要看看？」</p><p>${gearName(it)}<br><span class="note">${gearDesc(it)}</span></p><div class="row"><button class="btn small primary" ${S.pts<p?'disabled':''} onclick="buyVisit(${p})">${p} 分買下</button></div>`}},
 hood:{when:()=>S.story>=1,area:'hall',talk:()=>{S.bless='feather';return `<p>大廳角落坐著一個戴兜帽的旅人。沒有人看到他是什麼時候進來的。</p><p>他沒有說話，只是看了你一眼。等你回過神，位子上已經沒有人了，只剩下一根黑色的羽毛。</p><p>柏燼叔看到那根羽毛，愣了很久，然後什麼都沒說。</p><p class="note">獲得「黑羽庇護」：下一次探索，全隊受到的傷害 -15%。</p>`}}};
function buyVisit(p){const it=VIS.post.it;if(!it||S.pts<p)return;S.pts-=p;S.bag.push(it);VIS.post.it=null;S.visitor=null;save();res();toast('買下了 '+it.n);closeModal();town()}
const BLESS={feather:{n:'黑羽庇護',d:'受到傷害 -15%'},dream_atk:{n:'夢的刀鋒',d:'攻擊 +12%'},dream_heal:{n:'安穩的夢',d:'每往下一層，全隊回復 15%'}};

function libMenu(tab){tab=tab||'ch';_rbg('bg_library');const T=[['ch','劇情'],['bond','村民的往事'],['ev','地窖紀錄']];
 const tabs=`<div class="tabs" style="margin:6px 0">${T.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="libMenu('${k}')">${n}</button>`).join('')}</div>`;let body='';
 if(tab==='ch')body=CHBOOK.map(([ok,t,d])=>ok()?`<details class="q"><summary style="cursor:pointer;color:var(--gold)">${t}</summary><p class="lore" style="margin-top:6px">${d}</p></details>`:`<div class="q" style="opacity:.5">？？？　<span class="note">還沒讀到這一頁。</span></div>`).join('');
 if(tab==='bond')body=Object.keys(BOND).map(k=>{const n=Math.min((S.bond||{})[k]||0,BOND[k].length),kq=(S.kq||{})[k]||0;if(!n)return `<div class="q" style="opacity:.5">${NPC[k].name}　<span class="note">還沒聽過他的往事。</span></div>`;
  return `<details class="q"><summary style="cursor:pointer;color:var(--gold)">${NPC[k].name}　<span class="note">${n}／${BOND[k].length} 段${kq>=2?'・羈絆':''}</span></summary>${BOND[k].slice(0,n).map(b=>`<p class="note" style="margin:6px 0 2px">（${b.a}）</p><p class="say">${b.s}</p>`).join('')}${KQ[k]?KQ[k].s.slice(0,kq).map(x=>`${x.da?`<p class="note" style="margin:6px 0 2px">（${x.da}）</p>`:''}<p class="say" style="border-color:#b9a6ff">${x.done}</p>`).join(''):''}</details>`}).join('');

const MDESC={foxlamp:'戴著白色狐狸面具的人，臉上有很多隻藍色的眼睛，手裡提著一盞燈。身體像裂開的瓷，裂縫裡長著金色的細根。燈是暖的，可是靠近的人都會迷路。',rootkin:'由老樹根、骨頭和乾掉的花綁成的東西。頭上長著鹿角一樣的枝椏，手裡捧著一株還在發芽的小苗。牠在祭什麼，沒有人知道。',rustrat:'牙齒是小齒輪的老鼠，毛皮泛著銅綠。被牠們啃過的東西，會開始倒著轉。',sortarm:'一隻從分揀機上脫落的黃銅手臂，自己在地上爬，還在找信分。',leech:'長在蒸汽管裡的半透明水蛭。牠吸的不是血，是名牌上的字。',dutyghost:'舊分站職員的殘影，每隔一陣子就去打一次卡。打卡鐘早就壞了，他還在等下班。',courier:'只剩上半身的黃銅人偶，推著郵車，一直要把二十年前的報紙送到你手上。',clocktower:'分站的六面鐘塔，所有鐘面都停在同一個時刻。牠會把指針往回撥，讓你們身上的加成消失。',qianhao:'暮簡地底分站的總分揀機。數不清的黃銅分揀臂從天花板垂下來，胸口是一面布滿抽屜的牆。二十年來，牠一直照著最後一道命令工作。',paper:'紙紮的人，站得太直，臉上的笑畫得太滿。關節折的方向不對，走起路來一點聲音都沒有。',talis:'全身貼滿黃符的乾屍，符紙已經跟皮肉長在一起了。被抓到的地方，會慢慢浮出黃色的斑。',wgod:'很高很高的影子，頭的位置是一座香爐，一直冒著灰。牠在地窖裡遊蕩，好像在找還沒超度的人。',blindoff:'穿著官袍的高大影子，臉上沒有眼睛，只有一圈密密的耳孔。牠宣讀的天條，聽到的人都會照做。',rats:'地窖第一層最常見的東西。成群行動，尾巴上沾著燭苔的光，咬過的地方會癢很久。',skel:'被鏈子鎖在通道上的骷髏。鏈子的另一頭不知道接在哪裡，牠一直在等人把它解開。',giant:'全身長滿燭苔的巨人，頭頂點著一根怎麼吹都不熄的燭芯。牠走得很慢，像在巡夜。',moth:'在書霧裡飛的螟蛾，翅膀上的鱗粉是磨碎的字。被撲到的人，會暫時想不起要說的話。',raccoon:'把筆尖當牙齒的貍。牠偷墨水，也偷你寫到一半的句子。',turtle:'背殼是一本合起來的書。每被打一下，就翻一頁，翻到最後一頁會變得很兇。',badger:'肚子裡抱著一口裂開的鐘的獾。牠不讓任何人靠近那口鐘，也不讓鐘發出聲音。',cat:'只會重複你剛才說過的話的貓。不要在牠面前喊隊友的名字。',skel2:'名字被刮掉的骷髏。牠會一直問你：「你看到我的名字了嗎？」',rats2:'一大群沒有聲音的老鼠。牠們經過的地方，連腳步聲都會被吃掉。',scribe:'沒有臉的抄寫人，一直在牆上抄別人的名字。抄完的名字，原本的主人就會忘記。',hyena:'漏掉一頁的鬣犬。牠在找那一頁，聞到紙味就會撲上來。',widow:'頭上點著燈芯的寡婦蛛。網是用燒過的燈芯織的，被纏住會慢慢燙起來。',centi:'每一節身體都是一塊倒過來的門牌。爬過的路，地址會跟著顛倒。',chorus:'很多張嘴縫在一起的東西，一直在唱舊戶籍上的名字。唱錯一個字，就會有人不見。',bird:'千頁書紙摺成的巨大紙鴉。每一頁上都寫著同一個地址。',stampbug:'身體是一疊橡皮章的蟲，腳是筆尖。爬過的地方，會留下「退件」的黑印。',mailbox:'倒掛著的舊鐵郵筒，投信口裡長滿了牙，吐出來的舌頭是紙做的。',deadletters:'一群沒人收的信，飛在一起會變成一隻手的形狀。每一封都蓋著黑印。',clerk:'舊郵局職員的殘影，好幾隻手一直在分信，帽簷遮住了臉。',tkeeper:'背著逆走日晷的鐘錶怪。牠讓時間往回走，把你剛剛打掉的傷口還給牠自己。',emptypost:'一套空的郵差制服站在那裡，像裡面還有人。制服的胸口有一塊名牌，名字被撕掉了。',wusign:'由退件信、註銷的戶籍和印章組成的沒有臉的執事。胸口的鐵郵箱裝滿了鉛字。',gate:'守在地址之門前的合唱體，全員到齊的樣子。要過門，得讓牠們把你的名字唱對。',e_rat:'背上頂著熱蠟塊的苔鼠群，後面跟著一頭裹滿濕苔的護根獸。',e_crab:'磨盤那麼大的盲眼灰蟹，螯是白骨。',e_worm:'用寫錯字的廢紙捲成的書蠹，嘴裡是生鏽的釘書針。',e_dog:'用紙箱和骨頭紮成、纏著紅白封條的狗，紙做的頭上沒有眼睛。',e_shade:'紙灰捏成的灰色影子，指甲是磨尖的石頭，一直伸手要拿你的名牌。',e_crow:'羽毛缺了字的紙鴉，眼睛是紅的，鐵喙上滴著墨。'};
