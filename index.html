  {n:'帶著那支沒有名字的銅哨和沉甸甸的死寂，你們沿著停擺的升降井回到了暮簡村。'},
  {n:'午後的陽光照在村口的石碑上。因為剛才飛上來的那一小部分光團，石碑底座邊緣新亮起了三四個模糊的舊名字。可是石碑上半部那些原本還看得見淺痕的刻字，卻在你們眼前成片地褪成了光溜溜的白石頭。'},
  {n:'地方站大廳裡，柏燼叔站在桌前，低頭看著你放下的銅哨和值班表拓本。'},
  {n:'他的手指在值班表第四個暈開的墨團上停了很久，又摸了摸哨子邊緣那道被壞錶帶刮出來的細痕。最後什麼也沒問，只是默默把哨子收進了放著舊懷錶殼的貼身口袋裡。'},
  {n:'村口石碑旁，小穗蹲在地上，拿著幾枝斷掉的蠟筆在一張大紙上塗塗畫畫。紙上畫著老陳、許茉和你。畫紙最邊上，她不知不覺多畫了一個綁著馬尾、手裡舉著小哨子的大姐姐。'},
  {w:'小穗',s:'「奇怪，小穗怎麼多畫了一個人呀？我不認識這個吹哨子的姐姐，可是我的手自己就想把她畫在柏燼叔旁邊呢。」'},
  {n:'地方站櫃台後頭，許茉抱著她那本換了苔絨封面的「笨蛋備忘錄」，咬著筆桿發愣。她翻到第一頁自己署名的位置，盯著那個「許」字看了老半天，才像剛睡醒一樣拍了拍胸口。'},
  {w:'許茉',s:'「呼……嚇我一跳。剛才有一瞬間，我居然想不起來自己的姓該怎麼下筆了……還好本子上抄過一遍，不然可就鬧大笑話啦。」',r:'第三章〈二十年前的分揀機〉完。第四章製作中。'}],opts:[{t:'回地方站',p:1}],done:()=>endRun()})}
const EV3B={
 E31:{z:5,t:'傳送帶上的玉片',foe:'sortarm',steps:['第十五到十九層的半空中，架著一條條用來輸送分揀信件的黑色橡膠傳送帶。過了二十年，傳送帶依然順著齒輪「咔噠、咔噠」地往前滾。','你們路過一座低矮的分揀橋時，看見傳送帶上整齊地滾過一枚又一枚巴掌大的溫潤玉片。每一枚玉片裡，都像琥珀一樣封著兩個發光的小字。','手邊的傳送帶轉角處，一枚帶著麵粉香味的玉片剛好卡了一下。透過半透明的玉質，你們看見裡面封著的，是老陳年輕時用過的小名。再過三秒，它就會順著滑槽掉進通往十九層底下的深井。'],
  a:{t:'讓它過去',txt:'你們記著深處的規矩，誰也沒有伸手去碰那枚玉片。齒輪輕輕一跳，卡住的玉片重新滑進了通往最底層的黑暗滑槽。沒有警報，也沒有驚動周圍的機械。只是地面上某個人腦海裡最後一點關於童年小名的模糊印象，從此變成了空白。',f:()=>{RUN.loot.pts+=6;return '積分 +6。'}},
  b:{t:'拿起來（會觸發警報）',txt:'你眼疾手快地伸手，在玉片滑進黑洞前把它抄了起來。玉片化作一縷帶著麥酒和熱湯香氣的微光，順著通風管直直往地面飛去——此時在酒館裡擦杯子的老陳，突然停下抹布，想起了一道自己忘了快十年的拿手小菜。可是傳送帶少了一枚配重，警報「叮鈴鈴」地響了起來，兩隻巡邏的斷掉的分揀臂順著滑軌撲了下來！',win:()=>{RUN.loot.pts+=14;RUN.loot.seal+=1;addAff('chen',4);return '積分 +14、退件印泥 +1。老陳的好感上升了。'}},
  end:'傳送帶依舊不緊不慢地往前滾，把一個又一個沒人認領的偏旁，送往看不見底的黑暗。'},
 E32:{z:5,t:'站長室',foe:'dutyghost',steps:['蒸汽管線密布的迴廊側面，有一扇掛著「分站長室」黃銅門牌的厚木門。門鎖沒有被械濁封死，只是虛掩著一條縫。','推門進去，裡頭的一切都還保持著二十年前撤離那一刻的樣子：衣帽架上掛著一件落滿灰塵的制式披風，桌上的日曆停在二十年前的某一天，角落那張舊皮沙發上的坐墊凹痕都還沒完全彈回來。','只有沙發右側的木扶手上，乾乾淨淨，沒有半點灰塵。那裡端端正正地放著一張裁切得極其整齊的白色便條，紙上用工整得挑不出一絲毛病的字跡，只寫了一句話：「不是它的錯。」'],
  a:{t:'收起便條，安靜地退出去，替老站長把門帶上',txt:'你小心地拿起那張便條夾進記事本裡，沒有去翻動桌上那些屬於二十年前的私人物品。當你退後一步輕輕合上房門時，屋裡那口停擺了二十年的老座鐘極輕地「噹」了一聲，一枚保存完好的舊分站備用徽章從門框上方掉了下來，正好落在你腳邊。',f:()=>{RUN.loot.pts+=10;spmAdd('blackInk',1);return '積分 +10、退件黑墨 +1。'}},
  b:{t:'不理會便條，去翻辦公桌的舊檔案袋（戰鬥）',txt:'你繞過沙發，伸手去拉辦公桌緊鎖的主抽屜。抽屜被硬拉開的瞬間，裡面連著的防盜蒸汽閥「噗哧」一聲炸開刺鼻的白煙！守在門外走廊上的兩名停擺的值班員聽到動靜，立刻拖著沉重的打卡鐘堵住了房門！',win:()=>{RUN.loot.pts+=16;RUN.loot.ink+=2;return '積分 +16、書霧墨 +2。'}},
  end:'分站長室的木門重新合攏，把二十年前沒能說完的歉意，關在了門內。'},
 E33:{z:5,t:'播音室',foe:'leech',steps:['這間狹小的玻璃隔間裡擺滿了黃銅擴音筒和老舊的蠟筒留聲機。一盞紅色的故障燈在頭頂一閃一閃，整間屋子不斷迴盪著刺耳的電流雜音。','留聲機上的錄音蠟筒已經裂了一道縫，唱針卡在同一個槽位裡，正用老站長變調的聲音一遍又一遍地重複：「保管好……滋滋……保管好每一個……」','玻璃窗外，幾條吸附在蒸汽管上的管線水蛭隨著這段重複的聲音一抽一動，好像被這段卡住的廣播吸引著。'],
  a:{t:'用刀尖輕輕撥開卡住的唱針，讓它把話說完',txt:'你屏住呼吸，拿刀尖極輕地挑了一下卡在裂縫裡的唱針。雜音停了一瞬，留聲機重新轉動起來，老站長沙啞而沉重的聲音終於清楚地傳了出來：「保管好每一個名字。不要讓……滋滋……不要讓下面拿去付帳……」話音剛落，蠟筒便停了。留聲機底座彈出一枚完好的黃銅齒輪和一塊封蠟。',f:()=>{RUN.loot.pts+=12;RUN.loot.wax+=2;healAll(.1);return '積分 +12、燭淚蠟 +2，全隊回復一點生命。'}},
  b:{t:'嫌太吵，直接拉下總電閘（戰鬥）',txt:'你上前一把拽下牆上生鏽的黃銅總電閘。「啪」地一聲悶響，紅燈熄滅，重複了二十年的廣播瞬間啞了火。可是原本被廣播聲安撫在管線上的幾條管線水蛭，因為突然失去了聲音的震動，瞬間狂暴起來，啪嗒啪嗒地從天花板掉了下來！',win:()=>{RUN.loot.pts+=14;RUN.loot.seal+=1;return '積分 +14、退件印泥 +1。'}},
  end:'播音室徹底安靜了下來，只剩下外頭主管道裡沉悶的蒸汽流動聲。'}};

function town(area){if(area)AREA=area;RUN=null;WALK=null;BAT=null;res();music('hall');const ar=AREAS.find(a=>a.k===AREA);if(!ar||!areaOpen(ar))AREA='hall';const A0=AREAS.find(a=>a.k===AREA);

 else if(AREA==='village'){npcs=npcBtn('chen','')+npcBtn('sui',S.visitor==='sui'?'訪':'')+npcBtn('sang',(!S.sangDone&&S.story>=4)?'!':S.visitor==='sang'?'訪':'')+(S.invOn&&S.invOn()?'':'');line='湖邊的紙田沙沙作響。家家戶戶的窗台上，都晾著還沒寫字的紙。'}
 else if(AREA==='inn'){npcs=npcBtn('su',S.story===3?'!':'')+npcBtn('train','')+npcBtn('arena',arenaLeft()?arenaLeft():'');line='夢途驛的門簾很厚。裡面很安靜，像所有人都在睡覺。'}
 else if(AREA==='post'){npcs=`<button class="npc" data-n="box"><span class="ph">✉</span>舊郵筒<br><span style="color:var(--dim)">村外</span>${S.story===5?'<i class="badge">!</i>':''}</button>`;line='村外的舊郵筒歪在路邊。投信口裡，好像有東西在呼吸。'}
 else if(AREA==='tower'){npcs=towerNpcs();line=pick(TWLINE)+`<br><span class="note">渡鴉幣 ${S.ravc||0} 枚</span>`}
 else if(AREA==='grave'){const d=S.heroes.filter(h=>h.dead).length;npcs=`<button class="npc" data-n="altar"><span class="ph">✝</span>墓前<br><span style="color:var(--dim)">${d} 人沉睡</span></button>`;line='村子後面的小墓地，霧一直散不開。每塊墓碑前，都插著一根沒點的蠟燭。'}
 if(V&&!['zh','ye','sui','sang'].includes(V))npcs+=npcBtn(V,'訪',1);
 if(AREA==='hall'&&!RUN&&S.famHide&&S.famHide.used){const r=famResolveHide();if(r)toast(r)}
 if(AREA==='hall')npcs+=famBtn();
 const vHint=S.visitor&&!V&&VIS[S.visitor]?`<br><span class="note">${AREAS.find(a=>a.k===VIS[S.visitor].area).n}好像有人來了。</span>`:'';
 if(AREA==='village'&&invActive().length)npcs+=`<button class="npc" data-n="inv"><span class="ph">🔍</span>調查<br><span style="color:var(--dim)">${invActive().length} 件</span></button>`;
 $('stage').innerHTML=`<div class="bg" style="background-image:url('${A(AREA==='tower'?TW_BG():A0.bg)}');${AREA==='tower'&&TW_BG()!=='bg_guild'?'filter:hue-rotate(200deg) saturate(.6) brightness(.8)':''}"></div><div class="wx wx-${S.weather} wx-${tod()}"></div><div class="dock">

 if(k==='bai'&&(S.story===0||S.story===7))return talkBai();

 const pk=window.__pk;modal(head('bai')+`<p>老站長把一疊報到單攤在桌上。</p><p class="say">「中央說要派三個，結果來了八個人報名。你自己挑吧，挑三個跟你下去。」</p><p class="note">選 3 個人。建議至少有一個前排（盾衛或長槍手）和一個治療師。</p>${S.offer.map(k=>{const c=cand(k),on=pk.includes(k);return `<div class="hero" style="${on?'border-color:var(--gold);background:#2a2230':''}" onclick="pickToggle('${k}')"><img src="${A('h_'+k)}" alt=""><div class="info"><b class="hr${c.rar||0}">${esc(c.name)}</b> <span class="tag">${CLS[c.cls].name}</span><br><span class="say">「${esc(c.line)}」</span></div><span class="note">${on?'✓ 選了':''}</span></div>`}).join('')}<div class="row" style="margin-top:6px"><button class="btn primary" ${pk.length===3?'':'disabled'} onclick="pickDone()">就是他們了（${pk.length}/3）</button></div>`)}

 if(S.story===0&&!window.__picked){return startPick()}

 passname:{n:'通行的名字',t:'一張很薄的紙，上面寫著你們每一個人的名字，沒有一個被唱錯。是地址之門前的合唱體還給你的。'},
 receipt:{n:'沒有寄件人的投遞收據',t:'一封灰撲撲、邊角沾著乾綠苔的窄長信封，裡面只有這一張收據。收件人：地方站。簽收欄已經簽好名字：余巷。日期是村子曆上的「明天」。'},
 badge:{n:'生鏽的郵差徽章',t:'燭苔巨人倒下的地方撿到的。背面刻著「余巷」，焊接點是赤銅的。摸起來，比周圍的石頭還冷。'},
 page:{n:'舊站籍的一頁',t:'從靜鐘長的鐘裡取出的。上面有余巷的名字，最後一筆正在慢慢變淡。'},
 letter:{n:'郵筒裡的信',t:'舊郵筒裡塞滿了同一個名字寄出的信。收件地址：簷下路九號。最底下那封字跡很工整：「他的名字，我先替你們記著。燈會留到第九層。」'},
 drawing:{n:'小穗的畫',t:'皺巴巴的紙上，畫著一行歪歪扭扭的符號。小穗說，這是石碑上的字。看久了，像一個地址。'},
 sign:{n:'拼起來的路牌',t:'三塊被雨泡軟的殘片拼在一起。第一個字是「簷」，第二個是「下」。後面的字，怎麼看都看不清。'},
 clasp:{n:'半個簷字的郵扣',t:'余巷留在工坊的黃銅郵包扣。淬火以後，凹槽裡的白霜凝成了半個「簷」字的焊痕，磨不掉。'},
 torn:{n:'撕掉一半的收據',t:'在地窖牆角撿到的投遞收據。簽收欄上的名字只剩下一個字：巷。'},
 eaves:{n:'村長的告白',t:'「我拿掉的只是新地圖上一條線……我沒有拿掉那條路上的人。」——桑沐村長。他說的那條路，叫簷下路。'}};
function giveKey(k){if(KEYS[k]&&!S.keys.includes(k)){S.keys.push(k);return true}return false}
const KEYLINE={receipt:'「這張收據的墨，比我手臂上的字還新。……日期是明天。我記下了。」',badge:'「生鏽的地方，形狀像一個人常常用拇指摸過。我把它的樣子畫在手背上了。」',page:'「這頁紙上的字在變淡，我就在旁邊替它多寫一遍。寫完以後，它好像沒那麼冷了。」',letter:'「同一個名字寄了這麼多封信……我只抄得下地址。」',drawing:'「小穗畫的這行符號，我的字看到以後，自己排成了一樣的形狀。」',sign:'「後面的字我也讀不出來。可是我的手腕很燙。」',clasp:'「岩蘢說它磨不掉。那就讓它留著吧。」',torn:'「只剩一個字。我把它寫在最靠近心口的地方。」',eaves:'「村長說的話，我一個字都沒改。記錄員不改別人的話。」'};
function keyGive(k){S.keyDone=S.keyDone||[];if(!S.keys.includes(k)||S.keyDone.includes(k))return;S.keyDone.push(k);S.frag=(S.frag||0)+4;S.pts+=25;let extra='';if(S.keyDone.length>=Object.keys(KEYS).length&&!ownUQ('lg_ledger')){}save();res();sfx('coin');
 vn({title:'交給頁絮記錄',imgs:[{k:'n_ye'}],steps:[{w:'頁絮',a:'接過「'+KEYS[k].n+'」，捲起袖子，手臂上的字慢慢游過來，排成新的一行。',s:KEYLINE[k]||'「我記下了。」',r:'得到 4 個碎片、積分 +25。物品還是你的。'+(S.keyDone.length>=5?'\n頁絮手臂上的字越來越多了。':'')}],opts:[{t:'好',p:1}],done:()=>readKeys()})}
function readKeys(){modal(`<h2>劇情物品</h2><p class="note">劇情物品可以交給頁絮記錄，換碎片和積分。記錄過的物品還是你的，線索不會消失。</p>${S.keys.length?S.keys.map(k=>`<div class="q">${HAS.has('i_'+k)?icn('i_'+k,40):''}<b style="color:#b9e0a8">${KEYS[k].n}</b><p>${KEYS[k].t}</p>${(S.keyDone||[]).includes(k)?'<p class="note">已交給頁絮記錄</p>':S.story>=1?`<button class="btn small" onclick="keyGive('${k}')">交給頁絮記錄</button>`:''}</div>`).join(''):'<p class="note">還沒有。</p>'}<div class="row"><button class="btn primary" onclick="bag()">返回倉庫</button></div>`)}

const INV={
 B01:{t:'被退回三次的熱湯',from:'chen',need:s=>s[0]&&(s[1]||s[2]),
  board:'【雜貨店老陳急徵跑腿】店裡有一盅按舊訂貨單熬的羊骨熱湯，連續三天派人送去都被原封不動退回店門口，連湯碗裡的油花都沒少，但單子上的地址在新地圖上根本找不到。湯涼了可就真沒法喝了。',
  brief:'「你撕了那張單子啦？來，看看這本去年的包月訂貨簿。上頭明明寫著『每逢雙日送熱湯一盅至簷下路轉角木箱』，連訂金都付清了。可這禮拜我讓夥計去送，繞了半個村子都說沒見著那條路，把食盒放在舊街口，隔天一早食盒又自己出現在我店門檻上，裡頭的湯居然還是溫的！我老陳做生意最講信用，你幫我去查查，這碗湯到底該交給誰？」',
  spots:[['舊街口的磚牆','暮簡村西側的舊街口堆著幾隻破水缸，青石板縫裡長滿暗綠色的青苔。新版路牌指著「西風巷」，但順著排水溝往兩棟老屋的夾縫深處看，一面被爬山虎遮住大半的舊磚牆下，有一個擦得乾乾淨淨的收件暗格。<br>你把熱湯放了進去，拓下了暗格上方那塊舊木牌的字。'],
   ['比對訂貨簿的筆跡','你把訂貨簿攤在燈下，和地方站留著的舊郵務單一張一張比對。<br>訂貨單上的字，跟余巷以前幫村尾老人代寫的筆跡，一模一樣。'],
   ['問桑沐村長','村長看到「簷下路轉角」幾個字，搓手的動作快了起來。<br>「沒事的、沒事的，那都是舊地圖上的事了……」他匆匆走開，可是你看見他的手在抖。']],
  done:[ '「原來那堵爬滿藤蔓的死胡同後頭，以前真有條舊巷子？……怪不得夥計找不著。既然湯已經讓人收進去了，空碗也退了回來，這筆帳就算結清了。拿著，這是你的跑腿費，另外這碗剛出鍋的熱湯賞你了！」',
   '「你說這訂貨單上的字跡，是余巷那小子以前幫村尾老人代寫的？……嘖，那小子人都不見三個月了，誰還在按時把空碗送回來？算了，不管對方是誰，只要還喝得下熱湯，就不是什麼害人的東西。辛苦你跑這一趟了。」'],
  reward:()=>{S.pts+=15;S.soup+=2;return '積分 +15、老陳的熱湯 ×2'}},
 B02:{t:'別讓名字掉進井裡',from:'mo',need:s=>s[0]&&s[1]&&s[2],
  board:'【地方站緊急協尋】連日大雨沖垮了村西舊井邊的木製路牌，斷成三截的木片掉進了排水渠與古井石縫裡。奇怪的是，木片泡水後上面的墨字好像在慢慢往下滑……請幫忙找回三塊路牌殘片，千萬別讓路名掉進井底了！',
  brief:'「太好了，你願意接這張單子！今天早上我去巡視村西那口廢棄的舊水井，發現旁邊那塊老路牌被昨晚的大雨沖斷成三截了。我一低頭，卻看見木片上的黑漆字跡被雨水泡軟後，居然像蝌蚪一樣順著水流往井口滑！小穗那孩子還在旁邊喊著『名字要掉進井裡淹死啦』……你幫我去把那三塊殘片找齊帶回來，好不好？」',
  spots:[['古井的青磚縫隙','你探身到濕滑的井口邊緣，在木片滑落深井之前，把第一塊殘片夾了出來。上面的字正一點一點往邊緣爬。'],
   ['石板上的爛泥水窪','你撥開混濁的積水和落葉，撈起第二塊殘片。字跡正在水裡慢慢滲開。'],
   ['老槐樹下的排水暗格','壓在暗格上的碎石很重。小穗不知道什麼時候蹲在旁邊，指著石頭縫：「在那邊！它在哭！」<br>你取出了最後一塊，上面有半個門牌號碼。']],
  done:['「啊，三塊都找回來了！太謝謝你了，我這就拿乾布擦一擦，把它們拼起來登記歸檔……咦？這上面寫的是……『簷……下……』……唔？奇怪，這兩個字明明筆畫都對得上，我怎麼突然唸不出聲來？我的舌頭好像打結了一樣，一想看清楚那幾個字，眼睛就酸得直掉眼淚……對不起，這塊木牌你先幫我收著好不好？報酬我照算給你，但我實在沒辦法把它寫進今天的報表裡了……」'],
  reward:()=>{S.pts+=15;giveKey('sign');return '積分 +15、得到劇情物品「拼起來的路牌」'}},
 B03:{t:'不肯退火的舊郵扣',from:'yan',need:s=>s[0]&&s[1]&&s[2],
  board:'【工坊急徵耐寒材料】我這兒有一枚三個月前留下的黃銅郵差包暗扣，放進爐裡重鑄時，怎麼浸冷水都不肯退火，偏偏上頭刻了一半的字跡卻冷得結霜。去村邊和地窖淺層幫我找三樣壓火的實物來！',
  brief:'「你接了我的單子？好，過來自己拿燈籠照著看！這枚黃銅扣是余巷那小子三個月前留在我這兒修的。昨晚我尋思著幫他把鬆掉的簧片焊好，結果一進火爐就邪了門了——整塊銅片燒得通紅，浸了三桶井水都還燙得滋滋響，可中間刻著郵差編號的那條凹槽，卻一直在往外冒白霜！你幫我去村裡跟地窖入口找三樣帶著陰寒氣的東西回來，我非把它淬成器不可！」',
  spots:[['工坊後巷的雨水石槽','你刮下青石槽底常年吸著鍛造餘熱和冷雨的黑泥，泥是冰的。'],
   ['村口無字石碑的背面','石碑背陰處凝著冰冷的露水。你收集露水和剝落的石粉時，頁絮剛好經過，她手腕上的字往袖子裡縮了一下。'],
   ['地窖入口的石骨淺層','貼著地底石骨生長的燭苔白根，摸起來像剛從冬天裡拔出來。']],
  done:['「東西都帶回來了？行，往後退兩步，別讓蒸氣燙著臉！……（滋——！）……哈，總算安分下來了！怪了，火氣一退，這凹槽裡的白霜居然自己凝成了半個『簷』字的焊痕，拿鐵銼都磨不平。看來這枚銅扣是鐵了心要替它主人記著某條路了。銅扣我先幫他收著，這是答應給你的公會積分和工坊鍛材，拿去吧！」'],
  reward:()=>{S.pts+=15;S.mats.bone+=3;S.mats.wax+=1;giveKey('clasp');return '積分 +15、骨片 ×3、燭淚蠟 ×1、得到劇情物品「半個簷字的郵扣」'}},
 B04:{t:'三層塌方的舊盾釘',from:'yan',who:'鐵崇',minS:3,req:3,need:s=>s[0]&&s[1]&&s[2],
  board:'【老盾衛鐵崇的私事】五年前第三層東側通道塌方，我為了頂住落石，把盾牌邊緣三顆刻了隊友姓氏的「赤銅盾釘」崩飛在石縫裡了。岩蘢說只要找回舊釘子，就能幫我重新鉚回盾面上。有沒有心細的人，幫我老頭子去那三個舊角落摸一摸？',
  brief:'「你接了這張單子？謝了。我這面破盾跟了我十幾年，什麼傷我都認，唯獨盾邊缺了的那三顆赤銅釘，我心裡一直過不去。年輕時我們四個人一起進站，在各自那顆盾釘背面刻了名字的頭一個字。後來兩個調去了白鐵礦城，一個在二十年前就沒了影，四顆釘子一直鉚在我盾上。五年前那次塌方太急，三顆蹦進了第三層東側的死角裡，我這老腰彎不下去掏石頭縫，你幫我找回來吧。」（要先走到第 3 層）',
  spots:[['斷柱下的碎石骨堆','你搬開當年塌方留下的沉重青岡岩塊，在壓扁的石骨碎屑裡，翻到一顆泛著暗紅光的小銅疙瘩。'],['燭淚蠟封死的排水暗溝','你用小刀刮開凝結了五年的厚重白蠟，從淤泥裡摳出第二顆被蠟包住的盾釘。'],['發光古根的岩壁夾縫','你把手探進溫熱潮濕的樹根深處，摸到卡在根鬚間的第三顆。背面的字跡，磨損得很厲害。']],
  done:['「一顆、兩顆、三顆……好、好！全都找回來了！你看，這顆背面刻著『鐵』，這顆刻著『石』……奇怪，第三顆背面本來刻著誰的字來著？怎麼只剩一道平平的刮痕了？……算了，不管字在不在，只要這顆釘子還鉚在我盾上，我就當他還跟我並肩站著呢。辛苦你了，這份積分和護具你拿好。」'],
  reward:()=>{S.pts+=25;S.mats.bone+=4;const it=mkSet('iron','s');S.bag.push(it);return '積分 +25、骨片 ×4、得到「'+it.n+'」'}},
 B05:{t:'給沒名字哥哥的搬家禮',from:'sui',minS:6,need:s=>s[0]&&s[1]&&s[2],
  board:'【許茉代貼・小穗的小小委託】小穗一大早拿著三顆鵝卵石跑來櫃檯，非要貼一張委託單。她說她那個「看不見的朋友」好像搬到西邊牆壁後面、更冷的地方去了，想在村子裡找三樣他以前喜歡的東西，放在石碑下面。誰有空幫孩子跑一趟呢？',
  brief:'「你真的願意幫我找禮物嗎？太好啦！我跟『沒名字哥哥』玩捉迷藏，可是他這兩天越躲越遠，連聲音都變得好小好冷喔。以前有人跟我說過，出遠門的人只要聞到家裡的辣湯味、看到亮晶晶的郵筒、還有踩在乾爽的草鞋墊上，就不會在黑漆漆的地方哭鼻子了！你幫我去村子裡找一點點回來好不好？」',
  spots:[['老陳酒館後院的灶台窗','你趁老陳不注意，用乾淨的油紙沾了一點那罐三個月沒換過的紅椒辣油香，和幾粒乾辣椒末。'],['西風巷口的廢棄舊郵筒','你蹲在生鏽的舊郵筒旁，撿起幾片剝落的墨綠色舊漆片。村裡好像沒有人記得，這座郵筒最後是誰來收的信。'],['地方站後院的遮雨棚','雜物架最底層，有一雙以前送信人備用、編了一半的乾草鞋帶。']],
  done:['「哇，有辣辣的香味、舊郵筒的綠漆片，還有乾乾暖暖的草繩！謝謝你！我現在就把它們裝進我的小鐵盒，埋在村口大石碑底下。這樣沒名字哥哥半夜路過的時候，聞到辣湯的味道，就知道還有人給他留著亮亮的燈啦！來，這是許茉姊姊蓋過章的積分單。我們拉勾勾，這是我們兩個人的祕密喔！」'],
  reward:()=>{S.pts+=15;S.mats.moss+=3;S.potion++;addAff('sui',10);return '積分 +15、苔絨 ×3、藥水 ×1、小穗的好感上升'}},
 B06:{t:'三個空木塞的舊帳',from:'zh',minS:4,req:6,need:s=>s[0]&&s[1]&&s[2],
  board:'【大廳角落的無署名委託】去地窖第四層到第六層，幫我找三樣二十年前丟在那裡的破爛：一截斷掉的青竹藥杵、半塊刻著北境紋章的鐵護腕、一枚被書霧泡白了的銅哨子。找著了直接拿來大廳最暗的角落，別經過許茉的櫃檯。',
  brief:'「……單子是你撕下來的？把火把挪開點，聽我說。我毛毯底下藏著三個舊藥瓶的木塞，是二十年前跟我一起下第六層的三個同伴留下的。這麼多年，我連他們姓什麼、長什麼樣都忘乾淨了，只記得一個背藥簍、一個是從白鐵礦城來的盾衛、還有一個總愛吹銅哨子探路。我這雙廢腿走不下去了，你替我去找找。」（要先走到第 6 層）',
  spots:[['第四層斷橋石欄旁','你撥開積了二十年的發霉廢紙，找到一截已經石化、卻還帶著淡淡草藥味的青竹藥杵。'],['第五層廢棄的死信壁龕','成堆無人認領的空白信封底下，有半塊刻著白鐵礦城舊式羽紋的凹陷鐵護腕。'],['第六層鐘門前的冰冷石縫','你頂著刺骨的寒氣，從結霜的石縫裡夾出一枚簧片凍裂的舊銅哨子。']],

function pray(id){const h=S.heroes.find(h=>h.id===id);if(!h||!h.dead)return;const c=reviveCost(h);if(S.pts<c)return;S.pts-=c;S.altar++;const r=Math.random();let txt,who;
 if(r<.25){who='黑羽';h.dead=false;txt=`<p>蠟燭的火忽然變成黑色，然後熄了。</p><p>一根黑色的羽毛，輕輕落在墓碑上。</p><p>${short(h.key)} 睜開眼睛，像是只睡了一下。他什麼都不記得，也什麼都沒少。</p><p class="note">完整復活，沒有額外代價。</p>`}
 else if(r<.65){who='紙燈';h.dead=false;const lost=h.lv>1?1:0;h.lv=Math.max(1,h.lv-lost);h.xp=0;h.skills=h.skills.filter(k=>avail(h).includes(k));if(!h.skills.length)h.skills=avail(h).slice(0,2);
  txt=`<p>墓碑旁邊，不知道什麼時候多了一盞小小的紙燈。燈下壓著一張字跡工整的便條：</p><p class="say">「我只能把燈點到這裡。他會回來，可是有一段路，要重新走一次。」</p><p>${short(h.key)} 醒了。他記得你，可是有些東西，好像要重新學過。</p><p class="note">復活。代價：${lost?'等級 -1，':''}經驗歸零。</p>`}
 else{who='狐火';h.dead=false;if(Math.random()<.5){const k=pick(ATR);h.bonus[k]=(h.bonus[k]||0)+2;txt=`<p>一點青白色的火，繞著墓碑轉了三圈，最後鑽進 ${short(h.key)} 的胸口。</p><p>他咳了一聲，坐起來。身上暖暖的。</p><p>墓碑上多了一行小字，像在笑：「這次算你運氣好。」字的旁邊，有一個小狐狸尾巴形狀的墨點。</p><p class="note">復活，而且永久 ${ATN[k]} +2。</p>`}
  else{const eq=SLOTS.filter(s=>h.eq[s]);if(eq.length){const s=pick(eq);const it=h.eq[s];h.eq[s]=null;txt=`<p>一點青白色的火，繞著墓碑轉了三圈。</p><p>${short(h.key)} 醒了。可是他身上的「${esc(it.n)}」不見了。</p><p>墓碑上多了一行小字：「借一下。不還喔。」旁邊有一個小狐狸尾巴形狀的墨點。</p><p class="note">復活。代價：被拿走一件裝備。</p>`}
   else{S.pts=Math.max(0,S.pts-30);txt=`<p>一點青白色的火，繞著墓碑轉了三圈。</p><p>${short(h.key)} 醒了。你的錢袋輕了一點。</p><p>墓碑上多了一行小字：「身上什麼都沒有？那就收一點點路費。」旁邊有一個小狐狸尾巴形狀的墨點。</p><p class="note">復活。代價：再多 30 積分。</p>`}}}
 save();res();modal(`<div class="phbig">${who==='黑羽'?'🪶':who==='紙燈'?'🏮':'🔥'}</div><h2>回應：${who}</h2>${txt}<div class="row"><button class="btn primary" onclick="altar()">好</button></div>`)}

const HBIO={"shieldF": {"bg": "霜綾是渡鴉公會正規訓練出身的制式盾衛，從小在公會的紀律與哨音裡長大。她手裡那面漆著黑羽紋章的重盾從不離身，連在老陳酒館喝湯時都端端正正地立在膝邊。對她而言，站在隊伍最前排不是為了逞英雄，而是公會盾衛寫在骨子裡的本分。只要她的靴底還釘在石板上，後頭的人就別想少掉半根頭髮。", "t": {"A": ["單膝跪地將重盾釘入石縫，右手按在胸前的渡鴉徽章上", "「誓言不是寫在紙上的字，是我擋在你們身前的這塊鐵。」"], "B": ["反手將盾緣磨得發亮，眼神越過盾牌直盯前方黑影", "「光挨打可守不住人。從今天起，誰敢湊上來，我就連人帶陣一塊兒撞碎。」"], "A1": ["重盾表面浮現出層層交疊的黑羽暗紋，如同一道不可逾越的城牆", "「退到我身後去！這道牆，連地底下的冷風也別想鑽過去分毫！」"], "A2": ["擦去嘴角的血跡，將盾扣死死鎖在自己左臂上，一步不退", "「就算這具身子骨碎在下面，只要我的盾還立著，你們就有路回地面。」"], "B1": ["盾面在受擊瞬間彈開數枚鋒利的黑鐵羽片，寒光凜冽", "「砸在我盾上的每一分力氣，我都會連本帶利還給牠們。」"], "B2": ["重踏地面震開周圍的碎石，以盾面敲擊出進攻的急促節拍", "「全隊跟上我的步子！這座地窖擋不住渡鴉的鋒芒！」"]}}, "shieldM": {"bg": "鐵崇在暮簡村地方站待的年頭，只比柏燼叔和鐘衡少幾年。他手裡那面厚鐵盾上滿是深淺不一的凹坑，最大的一處是在第三層替兩個年輕隊員扛住塌方落石時砸出來的。他講話慢吞吞的，平時最愛坐在工坊門口看岩蘢打鐵，對什麼升遷發財早就沒了念頭。他還肯背著盾往下走，純粹是看不慣年輕人毛毛躁躁地把命丟在石頭縫裡。", "t": {"A": ["用粗糙的拇指抹過盾面上的舊凹坑，沉穩地吐出一口氣", "「老骨頭還頂得住。你們只管往前看，頭頂掉下來的石頭歸我管。」"], "B": ["將重盾往身前一橫，肩膀下沉擺出老練的撞擊架勢", "「守久了也得活動活動筋骨。讓開點，看我老頭子怎麼把前頭那堆爛石頭撞開。」"], "A1": ["雙腳如老樹盤根般死死踩住石板，整個人與重盾宛如一塊劈不開的頑石", "「三層的塌方都沒能砸彎我的腰，就憑底下這點動靜，還差得遠。」"], "A2": ["默默咽下喉頭的腥甜，把護胸甲的綁帶又勒緊了一扣，眼神沒有半分動搖", "「年輕人還有好幾十年的熱飯要吃。真到了要拿命填路的時候，自然該由我這把老骨頭先頂上。」"], "B1": ["順著敵人撲來的力道猛然側身卸力，反手一盾重重拍在地面上", "「在頭三層滾打了半輩子，什麼東西從哪個角度撲過來，我閉著眼都能拍回去。」"], "B2": ["提起全身力氣撞向敵陣最脆弱的關節處，發出震耳欲聾的金石悶響", "「石頭再硬也有裂縫！抓準那個缺口，給我一口氣砸穿它！」"]}}, "shield0": {"bg": "葛隆是個從外鎮晃蕩到暮簡村的傭兵，左手圓盾、右手短劍，全身上下每一件裝備都帶著修修補補的實用痕跡。他嘴上總把「公會積分」和「划不划算」掛在嘴邊，每次接任務前都要跟許茉把報酬算得清清楚楚。但真到了地窖底下，這傢伙從來沒有丟下雇主自己跑路過——用他自己的話說，人要是死了，後半輩子的長期飯票找誰領去？", "t": {"A": ["掂了掂手裡的積分單據，隨即把圓盾牢牢架在身前", "「行，既然收了你這份公會積分，只要契約還沒到期，這面盾就歸你使喚。」"], "B": ["用短劍拍了拍盾牌邊緣，嘴角咧開一抹狠辣的弧度", "「按時辰算帳太慢了，早點把前頭的攔路虎砍翻，咱們早點上去找老陳喝酒。」"], "A1": ["把盾牌加厚了一層熟鐵皮，穩穩擋在隊伍最前方", "「別看我這樣，我葛隆做生意最講究售後信譽。今天這道防線，包你物超所值！」"], "A2": ["吐掉嘴裡咬著的乾草梗，擦乾劍上的血，眼神難得認真起來", "「嘖，這點積分本來不該幹這種豁命的活……算了，誰讓我跟你們這幫傢伙處出交情了呢！」"], "B1": ["用盾面精準架開攻擊，右手的短劍如毒蛇般順著空隙刺出", "「打壞我盾牌上的漆可得加價！這一劍，算是收你的修盾利息！」"], "B2": ["劍與盾交錯揮舞出密不透風的寒光，大步流星地踏入敵群", "「積分到位，刀劍管飽！都別愣著，跟我一塊兒把這條路殺穿！」"]}}, "knightW": {"bg": "伊恪原本駐守在終年颳著寒風的北邊分站，披風上還留著北方白羽衛隊特有的銀扣。他習慣了直來直往的荒原魔物與硬石礦坑，初到暮簡村時，對這裡連路名和人名都會莫名消失的詭異氣氛極不適應。但他沒有寫信申請調回北方，而是每天擦亮自己的白羽長盾，用最標準的騎士禮儀對待每一位村民。越是看不見底的黑暗，越需要一面乾乾淨淨的盾牌立在那裡。", "t": {"A": ["將白羽長盾立於胸前，行了一個標準的北方騎士禮", "「無論是北邊的暴雪還是這裡的濃霧，騎士的職責從未改變——我會護住你們歸來的路。」"], "B": ["解下繁複的禮儀披風，雙手握緊盾柄與戰劍，目光如炬", "「守在原地等不到天亮。既然黑暗比報告裡更深，那我就替各位劈開一條光路。」"], "A1": ["長盾上亮起清冽如北境冰雪的微光，將逼近的書霧與寒氣盡數隔絕", "「以白羽之名立誓，任何妄圖抹去同伴姓名之物，皆不得越過此盾！」"], "A2": ["單手按住心口，哪怕甲冑染滿地底的黑泥，脊背依舊挺得筆直", "「名冊上的字會褪色，但刻在騎士骨頭裡的誓言不會。請安心把後背交給我。」"], "B1": ["盾面如北境寒風般猛烈旋斬，藉著格擋的反震之力將敵人狠狠掀翻", "「嚐嚐北邊練出來的力道吧！我們可不會光站在原地挨揍！」"], "B2": ["壓低盾尖發起雷霆萬鈞的衝鋒，潔白的羽飾在幽暗地底劃出刺眼白線", "「全軍突擊！讓地底下的東西看看，地面上的人還沒學會低頭！」"]}}, "bone": {"bg": "磐甲原本是無字地窖第二層石縫裡的一頭野生苔骨殼獸，背上馱著厚重如磨盤的青石甲殼與溫潤燭苔。半年前牠被落石卡在暗渠裡，是一名路過的公會郵差幫牠撬開了石頭，還分了牠半塊麥餅。從那以後，牠就慢吞吞地爬上了地面，每天趴在地方站門口的台階旁打盹。只要看見有人背著行囊準備下地窖，牠就會默默跟在隊伍最前頭，用自己砸不爛的背甲替活人擋住暗處的冷箭。", "t": {"A": ["殼獸把四肢穩穩扣進地面的石板縫裡，背上的燭苔亮起溫和的微光，像一座不肯挪窩的小石山。", ""], "B": ["殼獸喉嚨裡發出一聲低沉的「咕嚕」悶響，猛地縮起腦袋，用厚實的前緣甲殼把擋路的碎石撞得粉碎。", ""], "A1": ["牠背上的石骨與古老苔根徹底長在一處，甲殼向兩側延展開來，嚴絲合縫地擋住了整條狹窄的甬道。", ""], "A2": ["殼獸回過頭，用濕漉漉的鼻子輕輕碰了碰你的手背，隨即轉身將所有的致命重擊全部攬在自己龜裂的背甲上。", ""], "B1": ["牠背甲縫隙裡的石骨猛然向外炸開，化作一排排鋒利的骨刺，將撲上來撕咬的怪物扎得連連倒退。", ""], "B2": ["殼獸重重跺下前肢，沉悶的震波順著地底石骨一路傳導出去，把前方成群的敵人震得東倒西歪。", ""]}}, "spear": {"bg": "槿是個身材嬌小卻脾氣倔強的少女，手裡提著一桿比她整個人還要高出一個頭的白蠟木長槍。她以前在村外看守麥田，最恨那些躲在夜色和濃霧裡偷襲的怪東西。別人都勸她換把輕巧的短刀，她卻死活不肯——在她看來，地窖裡的髒東西太滑頭，只有手裡的傢伙夠長，才能在牠們碰到隊友之前，先把牠們釘死在石壁上。", "t": {"A": ["雙手握緊槍桿尾端，腳尖一點地面，長槍如離弦之箭般抖出凌厲的槍花", "「誰說個子小就只能縮在後面？看好了，這一槍能直接捅穿牠們的脊梁骨！」"], "B": ["將長槍斜架在盾衛肩頭，冷靜地盯著前方五步外的每一絲陰影晃動", "「一寸長，一寸強。只要我盯著這條線，什麼東西都別想撲到你們臉上。」"], "A1": ["槍尖在幽暗中劃出一道猩紅的弧線，她踏著前排的盾牌騰空躍起，槍勢兇猛無匹", "「藏在黑影裡的混帳，全都給我從石頭縫裡滾出來！」"], "A2": ["深吸一口氣，全身力道順著腰脊灌注到槍尖一點，發出刺耳的破空尖嘯", "「管你是石骨還是鐵殼，只要有縫，我這桿槍就能給你鑿穿！」"], "B1": ["在長槍槍纓下綁上一條醒目的紅布條，高高舉起晃動，為迷霧中的隊伍標定方向", "「別被書霧晃花了眼！看著我的槍尖，隊形別亂！」"], "B2": ["將槍尾死死抵住後方的石牆，槍尖斜指前方，化作一道令人生畏的鋼鐵荊棘", "「再往前一步試試看！我這桿槍可不認得什麼叫客氣！」"]}}, "horn": {"bg": "瞿山跟工坊的岩蘢一樣是岩心族人，頭上總戴著一頂缺了一隻角的祖傳山羊鐵盔。半年前，他那個愛四處亂跑的弟弟留下一封寫著「暮簡村」的信後就斷了音訊，瞿山便扛著開山用的重型長槍一路找了過來。他每天都會去夢途驛問蘇眠砂有沒有新信，也會去老陳那裡打聽過路客。雖然到現在還沒找到弟弟的蹤影，但他從不急躁，就像山裡的岩石一樣，一層一層、一寸一寸地往下找。", "t": {"A": ["單手拎起沉重的開山長槍往肩上一扛，鐵盔下的眼神沉穩如山", "「山裡人找東西，最不怕的就是翻石頭。前頭的路交給我來開。」"], "B": ["把長槍重重頓在地上，像一尊石像般守在隊伍側翼", "「我還沒找到我家那小子，更不能看著你們在底下走丟。跟緊了。」"], "A1": ["雙臂肌肉暴起，揮舞重槍如山洪傾瀉，連腳下的石板都被震出裂紋", "「擋路的石頭，砸開就是了！沒有哪座山是鑿不通的！」"], "A2": ["將重槍當作鐵鎬般由上往下悍然劈落，硬生生將前方的阻礙轟成碎渣", "「岩心族的槍，本來就是拿來開山裂石的！給我破！」"], "B1": ["把缺角的鐵盔往下壓了壓，高舉重槍立在濃霧中央，沉悶的吼聲迴盪在甬道裡", "「聽我的聲音辨位！只要我瞿山還站在這兒，這兒就是回家的路標！」"], "B2": ["橫槍擋在傷員身前，魁梧的身軀紋絲不動地扛下了所有的衝擊", "「山不倒，人就不倒。有我在，誰也別想把你們帶走。」"]}}, "mageF": {"bg": "夜漣曾是外鎮的守夜人，手裡提著一盞擦得一塵不染的八角琉璃風燈。她最討厭地窖裡那種黏糊糊、讓人看不清五步之外的暗影，每次下地窖前都要找岩蘢把燈芯修剪得整整齊齊。她的術法就像她的人一樣乾脆利落，從不搞那些彎彎繞繞的把戲——先把燈光甩過去照亮怪物的臉，再把滾燙的火苗直接砸進牠們眼窩裡。", "t": {"A": ["撥亮風燈裡的火芯，赤紅的火舌順著她的指尖纏繞而上", "「既然躲在黑影裡不肯出來，那我就把這條走廊整個點著！」"], "B": ["將一枚冷白蠟丸投入燈中，燈光瞬間轉為刺骨的冰藍色", "「太吵了。讓這層冷霜幫你們把腦子凍清醒一點。」"], "A1": ["高舉八角風燈，熾熱的火浪如潮水般鋪滿整條迴廊，將陰暗與濕苔燒得劈啪作響", "「長夜再黑，也禁不起這一把真火！給我燒個乾淨！」"], "A2": ["將燈火壓縮成一顆刺眼的光球甩入敵陣，伴隨著一聲巨響炸開漫天火雨", "「看清楚這道光了嗎？這就是你們最後看到的東西！」"], "B1": ["冷藍色的燈光灑落地面，空氣中的水氣與書霧瞬間凝結成厚重的白霜", "「燈光照過的地方，連半粒灰塵都不准給我亂動。」"], "B2": ["指尖輕彈燈壁，無數細碎如刀的冰晶順著光波一圈圈擴散開來", "「安安靜靜地凍在冰裡吧，省得我再費第二遍手腳。」"]}}, "mageM": {"bg": "昏燭總是陰沉著一張臉，手裡提著一盞舊得快散架的鐵皮燈籠，裡頭燒著一豆半明半暗、像隨時會斷氣的灰白色火苗。村裡人都覺得他怪，因為他常在半夜蹲在村口那塊無字石碑底下，對著石頭縫借火。只有小穗不怕他，偶爾還會拿石頭換他燈籠邊凝結的冷蠟塊。他比誰都清楚，從石碑借來的火雖然烤不暖活人的手，卻是底下那些褪名怪物最怕的東西。", "t": {"A": ["陰森森地掀起燈籠鐵蓋，那豆灰白色的火苗猛地竄高了三尺", "「……借來的火，也是要吃東西的。拿你們的骨頭來填吧。」"], "B": ["把燈籠往地上一放，周圍的石板瞬間結出一層像墓碑一樣慘白的冷霜", "「……火冷下來了。你們也跟著一塊兒涼了吧。」"], "A1": ["燈籠裡的灰白火焰傾瀉而出，在地面上燒出一行行看不懂的焦黑筆畫", "「……石碑上記不下的爛帳，就讓這把火替你們銷了。」"], "A2": ["猛地捏碎手裡的殘蠟投入燈中，灰火瞬間炸開刺耳的尖嘯與烈焰", "「……有借有還。這口氣，我連本帶利還給地底下！」"], "B1": ["慘白的燈光將前方的怪物凍成一座座毫無字跡的冰雕，他冷漠地收回視線", "「……別吵了。凍成沒有字的石頭，最安靜。」"], "B2": ["昏暗的火光在半空中碎裂成無數冰冷的灰白晶體，無聲無息地刺穿敵群", "「……光暗下去的時候，連痛都不會覺得痛。」"]}}, "mage0": {"bg": "沒有人知道他是什麼時候坐在地方站長椅上的，就連許茉做登記時，他也只用指尖在名冊上畫了一道橫線，大夥兒便叫他「無名」。他全身裹在洗得發灰的厚重斗篷裡，兜帽壓得極低，只露出兩點幽冷的藍光。有人猜他是二十年前那場大消失裡漏網的半個活人，也有人說他只是把自己的名字押在了地窖深處。他平時一個字都不多說，卻比任何人都厭惡底下那些偷人姓名的怪物。", "t": {"A": ["兜帽下的藍光猛然暴漲，他伸出纏滿繃帶的右手，掌心騰起一簇沒有聲音的幽藍烈火", "「……燒。」"], "B": ["他緩緩吐出一口白氣，提著的空燈籠裡凝出一枚冰藍色的霜核", "「……凍住。」"], "A1": ["幽藍色的火焰順著他的斗篷下擺蔓延開來，連空氣裡的紙屑都被燒得不留半點灰燼", "「……連名字……都別留下。」"], "A2": ["他五指猛然收攏，遠處的藍火瞬間向內塌縮，隨即轟然炸開奪目的藍芒", "「……散。」"], "B1": ["兜帽下的兩點藍光冷得刺骨，前方的空間瞬間被封入一口厚重的透明冰匣之中", "「……在裡面……待著。」"], "B2": ["他微微抬起燈籠，穹頂上方頓時下起了密密麻麻、閃著幽藍寒光的冰晶暴雨", "「……安靜。」"]}}, "foxgirl": {"bg": "緋汐是個背著一串手作彩紙燈籠、頭頂長著一對毛茸茸尖耳朵的異族旅人。她手巧得很，能拿地窖裡撿來的燭淚蠟和竹篾編出各式各樣防風又聚火的巧燈，連蘇眠砂都常向她訂做烘信用的小風燈。她性格古靈精怪，最討厭別人盯著她的狐耳看，誰要是敢伸手偷摸，她手裡的燈籠火苗立刻就會往誰的眉毛上招呼。", "t": {"A": ["氣呼呼地拍開想碰她耳朵的手，手腕一抖，燈籠裡噴出一股滾燙的赤色火狐", "「叫你別亂看！看我把你們的鬍子全燒光！」"], "B": ["耳朵得意地抖了兩下，指尖轉動著一盞冰青色的小巧花燈", "「哼，我編的燈可不光會燒火，凍起人來也是一等一的！」"], "A1": ["腰間一整串燈籠同時亮起妖豔的赤紅火光，化作數道敏捷的火影在敵群中亂竄", "「這可是我熬了三天三夜才調出來的燈油，好好嚐嚐吧！」"], "A2": ["她輕盈地向後一躍，漫天飛舞的紙燈籠在敵人頭頂同時引爆，火光映紅了她的尖耳朵", "「看花眼了吧？全都給我炸成灰！」"], "B1": ["燈籠裡躍出一隻由寒霜凝成的靈巧白狐，所過之處連怪物的關節都凍得咔咔作響", "「乖乖站在原地發抖吧，別弄髒了我的新燈籠！」"], "B2": ["數盞冰晶燈籠在半空中碎裂，化作漫天晶瑩剔透卻鋒利無比的冰凌落下", "「好看嗎？越好看的燈，扎起人來越痛喔！」"]}}, "fox": {"bg": "燈守是一隻尾巴尖端猶如飽蘸濃墨的小茸狐，平時總愛窩在夢途驛與地方站交界的屋簷上睡覺。沒人知道牠是誰養的，只知道有一回下雨天，牠嘴裡叼著一根不屬於任何村鳥的漆黑羽毛跑進大廳，從那之後就賴在了站裡。牠的鼻子靈得不可思義，能聞出信封上有沒有夾帶假話，脖子上掛著的一盞小銅燈在走進地窖時會自己亮起帶路的火光。", "t": {"A": ["小茸狐蓬鬆的墨色尾巴猛地一甩，脖子上的小銅燈竄起一團帶著墨香的熾熱火球。", ""], "B": ["牠輕輕打了一個響鼻，銅燈裡的火苗變成清冷的霜白色，地面順著牠的爪印結出一串冰花。", ""], "A1": ["茸狐壓低耳朵發出一聲清亮的「嚶——」鳴，墨色尾巴在空中畫出一個火圈，將撲來的黑影燒得乾乾淨淨。", ""], "A2": ["牠靈巧地跳上盾衛的肩膀，甩出尾尖的一滴濃墨撞進燈火裡，前方頓時炸開一團黑紅交織的烈焰。", ""], "B1": ["牠用尾巴尖在石板上輕輕一掃，混著陳年墨香的寒霜瞬間爬滿了怪物的雙腿，將其死死凍在原地。", ""], "B2": ["小茸狐仰頭對著脖間的銅燈吹了一口氣，無數黑曜石般的冰晶從半空中簌簌落下，替隊伍清出了一片安靜的空地。", ""]}}, "healerF": {"bg": "青蒿是暮簡村地方站最讓人安心的隨隊醫官，背上永遠背著一只分了二十四格的樟木大藥箱。她以前在外鎮的醫館當學徒，看多了冒險者為了省幾枚銅板硬撐著不治傷、最後把小傷拖成死症的慘事。來到暮簡村後，她連柏燼叔的左肩舊傷和鐘衡的寒腿都敢按著頭強行敷藥。在她眼裡，沒有什麼面子比活著喘氣更重要。", "t": {"A": ["打開樟木藥箱取出乾淨的棉布與青蒿膏，手腳麻利地替隊友包紮", "「不是叫你別硬撐了嗎？忍著點，這副藥敷上去會有點涼，很快就不痛了。」"], "B": ["冷著臉從藥箱底層摸出一排貼著紅紙條的小瓷瓶，夾在指縫間", "「能救人的草，多放兩錢就是能要命的毒。誰敢傷我的人，我就讓牠嚐嚐苦頭。」"], "A1": ["雙手散發出溫潤而清冽的草木藥香，隊伍身上的傷口以肉眼可見的速度止血收口", "「只要我的藥箱還沒空，你們誰也別想倒在半路上。」"], "A2": ["點燃一束乾燥的清心草，帶著微苦香氣的青煙瞬間驅散了隊員眼底的迷茫與寒氣", "「深呼吸，別聽底下的怪聲音！記住你們自己的名字！」"], "B1": ["戴上厚布面巾，將調配好的濃烈苦艾毒粉隨風揚向前方的敵群", "「地底下的髒東西，就該用最烈的苦藥好好洗一洗！」"], "B2": ["在行軍間隙熟練地用小銅臼搗碎剛採來的怪草，當場煉成兩丸泛著異香的丹藥", "「苦口的是良藥，要命的是毒藥——分清楚了，可別拿錯邊。」"]}}, "healer1": {"bg": "蕁是個總愛蹲在酒館角落喝酒、說話沒個正經的江湖郎中，腰間掛著七八個裝滿刺鼻藥酒的破葫蘆。他嘴上總跟葛隆一樣愛提「治療費另算」，每次給人拔箭頭前都要先嚇唬對方說要鋸腿，看年輕隊員嚇得臉色發白才哈哈大笑著掏出上好的止痛散。他走南闖北見過不少怪病，之所以留在暮簡村，是因為他發現地窖裡那種讓人忘記名字的怪毛病，是他這輩子唯一還沒配出解藥的疑難雜症。", "t": {"A": ["拔開葫蘆塞子往傷口上澆了一口烈性藥酒，笑嘻嘻地丟過去一捲繃帶", "「嘶——痛就喊出來嘛！不收你繃帶錢，算我今天日行一善。」"], "B": ["晃了晃腰間那個畫著骷髏頭的黑葫蘆，眼神變得精明而危險", "「治病救人太費工夫了，還是直接給對面下點猛料比較省事。」"], "A1": ["收起嬉皮笑臉的模樣，三根銀針穩準狠地封住傷員的血脈，手法老辣得驚人", "「行了，閻王爺那邊我幫你打過招呼了，今天不收你這條命。」"], "A2": ["拿出一把帶刺的乾蕁麻葉在火上烤出濃煙，拍在隊友發僵的肩膀上，瞬間逼出體內的陰寒", "「刺痛總比麻木好！還知道痛，就說明你的魂兒還在自己身上！」"], "B1": ["將黑葫蘆裡的腐蝕性毒霧大口噴在刀刃與前方地面上，石板滋滋冒起白煙", "「這可是我用七種毒草泡出來的陳年老酒，看你們這身爛石頭扛不扛得住！」"], "B2": ["隨手抓起地上的怪物殘骸與毒苔塞進小鐵罐裡猛搖幾下，居然配出了一劑猛藥", "「就地取材，本小利大！來，對面的朋友，這劑猛藥算我免費請你們喝的！」"]}}, "herb": {"bg": "芸是個常年背著竹編大背簍、手裡拿著小藥鋤的村裡姑娘，也是鐘衡以前指點過的半個徒弟。別的冒險者下地窖看的是怪物和寶箱，她下地窖看的全是石壁縫裡的白根、發光的燭苔和書霧裡長出來的菌子。她膽子不算大，打架時總縮在盾衛屁股後面，但只要聞見哪裡有救命的好草藥，哪怕旁邊就趴著燭苔巨人，她也敢躡手躡腳地摸過去挖兩鋤頭。", "t": {"A": ["從竹簍裡抓出一把剛採的新鮮白根揉碎，敷在隊友的手臂上", "「這株根鬚剛離土，藥力最足，敷上去馬上就能止血了。」"], "B": ["小心地用木夾子夾起一朵長在廢紙堆上的黑斑菌子，朝敵人扔過去", "「長在死信上面的毒菇，聞一口就會頭暈眼花，你們可千萬別站下風處喔。」"], "A1": ["竹簍裡的各色草藥在微光中散發出蓬勃的生機，溫暖的綠意籠罩了整支隊伍", "「地底下雖然黑，但草木還是想活下去的。把這口活氣分給你們！」"], "A2": ["捧起一團散發著柔和橘光的極品燭苔，輕輕擦去隊員臉上的黑灰與負面詛咒", "「別怕，這團苔蘚還記著太陽的溫度，不會讓底下的冷氣凍壞你們的。」"], "B1": ["將收集來的酸腐苔汁與毒粉混合灑出，前方的怪物頓時被腐蝕得哀嚎連連", "「誰叫你們剛才踩壞了我好不容易找到的藥苗！全都賠給我！」"], "B2": ["她居然在自己背上的大竹簍裡用腐殖土養活了一小片隨身藥苗，隨手一摘便是奇藥", "「只要把泥土帶在身上，走到哪裡都有現成的新鮮草藥可以用啦！」"]}}, "snake": {"bg": "藥鱗是一條只有小指粗細、通體長著溫潤青白鱗片的無翼小蛇，平時最喜歡纏在青蒿的藥箱提手上，或者鑽進地方站大廳的油燈縫隙裡取暖。牠常年偷吃醫藥櫃裡掉出來的百草碎屑，一身的蛇蛻和涎水都變成了極佳的止血靈藥。牠性子溫順得很，誰要是受了外傷，牠就會悄悄滑過去用微涼的肚皮貼住傷口；但誰要是敢對拿著暖燈的隊友動粗，牠毒牙裡的麻痺毒液也不是吃素的。", "t": {"A": ["細蛇順著傷員的手臂滑下，用舌尖輕輕舔過傷口，留下一層清涼止血的透明薄涎。", ""], "B": ["牠昂起三角形的小腦袋，頸部鱗片微微炸開，朝著前方的敵人噴出一縷淡綠色的麻痺毒霧。", ""], "A1": ["細蛇在燈光下舒展身軀，鱗片間散發出一股濃郁的百草清香，讓全隊疲憊的傷痛一掃而空。", ""], "A2": ["牠順著隊友的手腕迅速蹭下一層薄如蟬翼的雪白蛇蛻，將傷口連同侵入體內的寒毒一併包裹拔除。", ""], "B1": ["細蛇化作一道青白色的閃電竄入敵陣，在幾隻怪物的腳踝上連咬數口，劇毒瞬間順著石骨蔓延開來。", ""], "B2": ["牠從嘴裡吐出一顆沾著翠綠膽汁的濃縮藥丸滾到你手邊，自己則懶洋洋地縮回暖燈旁打起了盹。", ""]}}, "raven": {"bg": "啄夜是一隻體型比普通烏鴉大上一圈的灰喙夜鴉，左腳踝上還套著一枚早就磨平了編號的舊驛站銅環。牠常年停在夢途驛的屋頂或村口的老槐樹梢上，最喜歡模仿村裡各種各樣的聲音——有時候學老陳敲湯碗，有時候學第六層那口沉悶的鐘響。牠的眼睛在伸手不見五指的地窖深處依然亮得像兩顆黑曜石，只要牠在隊伍頭頂拍動翅膀，暗處藏著的冷箭與怪影就無所遁形。", "t": {"A": ["夜鴉飛上高處的石樑，歪著腦袋鎖定黑暗中怪物的弱點，發出一聲短促尖銳的「咔！」鳴指引目標。", ""], "B": ["牠貼著迴廊兩側的岩壁高速滑翔，灰色的鐵喙如利箭般冷不防啄瞎了敵人的眼睛。", ""], "A1": ["牠從穹頂最暗的死角垂直俯衝而下，泛著寒光的灰喙像一枝重弩般精準貫穿了目標的核心。", ""], "A2": ["夜鴉拍打著強健的黑羽懸停在敵人面前，鐵喙化作一片殘影，叮叮噹當地在怪物護甲同一處狂啄不止。", ""], "B1": ["牠在隊伍頭頂的石縫間丟下幾根帶有氣味的羽毛，像是在標記自己的領地，讓所有靠近的敵人動作都變得遲緩畏縮。", ""], "B2": ["牠仰頭學了一聲悠長的古鐘長鳴，地窖暗處頓時湧出無數道黑色的鴉影，如暴風雨般將前方的敵陣徹底淹沒。", ""]}}, "spider": {"bg": "織燭是一隻巴掌大小、腹部有著像小燭台一樣暖黃花紋的奇異結蛛。牠原本住在第三層與第四層交界的石縫間，專門用摻了燭淚蠟的韌絲在斷裂的石橋間織網。因為牠吐出的銀絲在火把照耀下會發出微微的反光，還能黏住書霧裡亂飄的廢紙，頁絮和許茉都非常喜歡牠。只要帶上牠一起下地窖，不管底下的迷宮怎麼變，順著牠留在牆角的銀絲就一定能摸回樓梯口。", "t": {"A": ["結蛛八足飛快彈動，幾道塗滿黏稠燭蠟的銀絲瞬間在地面張開大網，把衝過來的怪物絆了個嘴啃泥。", ""], "B": ["牠將一根極細卻堅韌的透明蛛絲悄悄連在每位隊員的手腕上，只要有人走偏半步，銀絲就會輕輕拉扯提醒。", ""], "A1": ["結蛛在半空中高速旋轉跳躍，成百上千根帶著燭火餘溫的銀絲將前方的強敵層層裹住，捆成了一顆動彈不得的大白繭。", ""], "A2": ["牠將堅韌的蛛絲釘入倒地怪物的石骨關節中，前肢輕輕一撥，竟拉扯著那具軀殼反過來替隊伍擋下了攻擊。", ""], "B1": ["結蛛用銀絲將幾張廢棄的書霧紙片迅速編織成一個假人立在陣前，替隊員誘開了致命的一擊。", ""], "B2": ["連在隊員之間的銀絲亮起一圈溫暖的橘黃燭光，將所有人的心跳與步伐緊緊連在一起，連地底的寒氣都無法切斷。", ""]}}, "archerH": {"bg": "鳶是個走路沒有半點聲音、渾身上下藏滿了小鐵鉤與開鎖鐵絲的年輕斥候。他以前在外頭幹過一陣子翻牆摸鎖的營生，後來差點栽在一處古墓機關裡，被路過的柏燼叔拎著後領救了出來，從此就被按在暮簡村地方站「將功抵過」。他嘴貧手快，看見上鎖的木箱眼睛就會發亮，雖然嘴上老說要把寶貝私吞，但每次遇到真正的毒氣陷阱或暗門，他總是第一個衝上去替大家把雷排乾淨。", "t": {"A": ["將兩把短匕首反握在袖口裡，整個人像一滴墨水一樣悄無聲息地融進了石柱後面的黑影", "「別舉著火把往我這邊照啊，等我摸到牠們背後，一刀一個。」"], "B": ["趴在地上耳朵貼著石板聽了兩秒，掏出鐵絲三兩下挑斷了一根絆腳銅線", "「哈，前頭暗格裡有動靜！跟著小爺走，保準你們不踩坑還能發筆小財！」"], "A1": ["黑影中只見一抹寒光掠過怪物的咽喉，他已經拎著滴血的匕首退回了三步之外，連氣都沒喘一下", "「搞定。連叫聲都沒漏出來，這才叫專業。」"], "A2": ["雙手短匕如穿花蝴蝶般在指間高速翻飛，每一記割擊都精準挑斷敵人的發力筋絡", "「嫌我刀短？刀短才好往你們的骨頭縫裡鑽啊！」"], "B1": ["在與怪物擦身而過的瞬間，手指如閃電般順走了對方身上夾著的舊物與材料，得意地吹了聲口哨", "「多謝款待！放在你們身上也是發霉，不如交給我拿去換公會積分！」"], "B2": ["將拆下來的地窖陷阱零件改裝成一排彈簧飛鏢匣，啪嗒一聲扣在身前地面上", "「誰說只有地窖能給活人下套？來，踩踩看小爺給你們準備的大禮！」"]}}};
function brLine(h,tag){const B=HBIO[h.key];const L=B&&B.t[tag];if(!L)return;const nm=short(h.key);vn({title:'轉職',imgs:[{k:akOf(h)}],steps:[L[1]?{w:nm,a:L[0],s:L[1]}:{n:'（'+L[0]+'）'}],opts:[{t:'好',p:1}],done:()=>heroDetail(h.id)})}
function chooseBr2(id,j){const h=S.heroes.find(h=>h.id===id);if(!h||h.br==null||h.br2!=null||h.lv<20||!CHR[h.key])return;h.br2=j;{const nk=CHR[h.key].br2[h.br*2+j].s;if(!h.skills.includes(nk)){if(h.skills.length<slots(h))h.skills.push(nk);else h.skills[h.skills.length-1]=nk}}save();sfx('talent');toast(short(h.key)+' 二轉為「'+CHR[h.key].br2[h.br*2+j].n+'」');if(HBIO[h.key])brLine(h,'AB'[h.br]+(j+1));else heroDetail(id)}

function ch2Scene(f){if(f===10&&!S.ch2a){S.ch2a=1;save();return vn({title:'推開地址之門',bg:'bg_ch2_door',imgs:[{k:'n_su'},{k:'n_ye'}],steps:[{n:'出發前，柏燼叔把那枚生鏽的郵差徽章交回你手上。他什麼都沒多交代，只是伸出粗糙的大手，在你肩頭重重拍了兩下。'},{w:'蘇眠砂',i:0,s:'「這扇門後面寄出來的信，我隔著手套摸過很多封。寫信的人指尖都很冷，可是落筆時的心跳，快得嚇人。」'},{w:'蘇眠砂',i:0,s:'「記住，門推開以後，千萬別回頭去找來時的樓梯。裡面的路，全都是反著走的。」'},{n:'你走上前，把生鏽的徽章和寫著「簷下路九號」的舊信，一起按在第九層深處那扇冰冷的門板上。門沒有上鎖，只是沉得像壓著整條老街的石頭。'},{n:'門推開一條縫的瞬間，沒有任何怪物撲出來。迎面吹來的，是一陣帶著老街青磚潮氣和乾苦艾香的穿堂風。'},{n:'門後是一條望不到頭的青石板路。所有的木頭門牌都顛倒著釘在低矮的屋簷下，號碼從大往小倒著數，安安靜靜地通往極深的地方。'},{w:'頁絮',i:1,s:'「……等一下。我手上的字在動。」'},{n:'頁絮連忙捲起袖子。她左手虎口那片原本空白泛紅的皮膚上，正一點一點浮出一行細小的黑字：「逆址，退件廊，門後第三步。」那行字像認得路一樣自己游了起來，筆尖直直指向左邊一條幽暗的岔巷。'},{w:'頁絮',i:1,s:'「我不知道這行字是誰寫在我身上的。可是……我覺得它沒有騙我們。」',r:'第二章開始。踩到地上的黑色退件印會被「退件」，頁絮的好感越高，越容易避開。'}],opts:[{t:'走進去',p:1}],done:toMap})}

 sfx('step');if(RUN.torch>0){if(!RUN.party.some(q=>q.hp>0&&q.fx&&q.fx.torchSave&&Math.random()<q.fx.torchSave)&&!(RUN.fam&&RUN.fam.includes('wick')&&Math.random()<.5))RUN.torch--;if(S.weather==='rain'&&RUN.torch>0&&Math.random()<.2)RUN.torch--}else if(RUN.fearGuard){RUN.fearGuard=0;toast('火把用完了。你想起蘇眠砂說的話，把呼吸放慢。')}else{if(!(RUN.fam&&RUN.fam.includes('m_calmf')&&Math.random()<.5)&&!(RUN.party.some(q=>q.uq&&(q.uq.includes('crayon')||q.uq.includes('kq_su')))&&Math.random()<.5))RUN.fear=Math.min(10,(RUN.fear||0)+1);RUN.party.forEach(p=>{if(p.hp>0)p.hp=Math.max(1,p.hp-Math.ceil(p.maxhp*.02))});
  if(RUN.fear>=10&&Math.random()<.15){const al=RUN.party.filter(p=>p.hp>0);if(al.length>1){const p=pick(al);RUN.party.splice(RUN.party.indexOf(p),1);RUN.lost.push(p);toast(short(p.key)+' 在黑暗裡走散了……（迷失）')}}
  else if(RUN.fear===1)toast('火把用完了。四周只剩下你們的呼吸聲。');else if(RUN.fear===5)toast('黑暗裡有東西跟著你們。（恐懼 5 層）');else if(RUN.fear===10)toast('恐懼滿了。小心有人走散。')}
 const done=()=>{RUN.grid[y][x]='.';drawMap()};
 if(ch==='.'&&RUN.floor>=10&&RUN.floor<=14&&!RUN.abyss&&!RUN.mem&&stampTrap()){drawMap();return true}
 if(ch==='.'&&!RUN.mem&&!RUN.encDone&&S.encCD>=1&&Math.random()<Math.min(.12,.04+.02*S.encCD)){RUN.encDone=1;drawMap();encounter();return true}
 if(ch==='M'){const m=RUN.mon[x+','+y];drawMap();battle(m.k,done,m.elite,m);return true}
 if(ch==='B'){drawMap();const fl=RUN.floor;const mk=MINI[fl]&&!RUN.abyss?MINI[fl]:tierOf(fl).boss;const after=()=>{RUN.grid[y][x]=(fl>=maxReach()||RUN.abyss)?(RUN.abyss?'D':'.'):'D';if(fl===11&&!RUN.abyss&&giveKey('dial'))toast('得到劇情物品「逆行驛站日晷」');if(fl===13&&!RUN.abyss&&giveKey('fakeseal'))toast('制服垮了下來，裡面是空的。地上留著一枚「代簽木印章」。');drawMap();if(fl===14&&!RUN.abyss&&!S.ch2)ch2End();if(fl===19&&!RUN.abyss&&!RUN.portal&&!S.ch3)ch3End();if(fl===44&&RUN.portal==='iron')ironEnd()};if(fl===44&&RUN.portal==='iron')return ironPre(()=>battle(mk,after)),true;if(fl===14&&!RUN.abyss)return ch2Pre(()=>battle(mk,after)),true;if(fl===19&&!RUN.abyss)return ch3Pre(()=>battle(mk,after)),true;if(MPRE[mk]&&!RUN.abyss&&!S.bosses.includes(fl)){vn({title:FOES[mk].name,bg:bgK(tierOf(fl).bg,'bg_sort'),steps:MPRE[mk].map(s=>({w:FOES[mk].name,s})),opts:[{t:'迎戰',p:1,f:()=>{battle(mk,after)}}],done:toMap});return true}battle(mk,after);return true}
 if(ch==='C'){bump('chest');sfx('chest');const T=tierN(RUN.floor);const p=Math.round((rnd(4,8)+RUN.floor)*(1+RUN.party.reduce((a,q)=>a+(q.hp>0&&q.fx?q.fx.chestP||0:0),0))),m=pick(T>=2?['moss','bone','ink']:['moss','bone']);RUN.loot.pts+=p;RUN.loot[m]++;let gt='';const extra=hasTal('c13');if(Math.random()<(extra?.55:.35)){const it=genItem(T);RUN.loot.gear.push(it);gt='、'+it.n+'（'+RAR[it.r]+'）'}if(extra){RUN.loot.pts+=3;RUN.loot[m]++;gt+='（斥候多摸到一份）'}{const cg=RUN.party.reduce((a,q)=>a+(q.hp>0&&q.fx?q.fx.chestGear||0:0),0);if(cg&&Math.random()<cg){const it2=genItem(T);RUN.loot.gear.push(it2);gt+='、'+it2.n+'（多摸到的）'}}
  toast(`寶箱：積分 +${p}、${MAT[m]} +1${gt}`);done();return true}
 if(ch==='E'){RUN.grid[y][x]='.';bump('event');drawMap();runEvent();return true}
 if(ch==='Q'){RUN.grid[y][x]='.';if(RUN.encDone){drawMap();return false}RUN.encDone=1;drawMap();encounter();return true}
 if(ch==='L'){if(!RUN.lantern){RUN.lantern=true;healAll(.4);RUN.party.forEach(heal_wound);RUN.fear=0;rejoin();sfx('chime');const note=LANTERN_NOTES[S.notes%LANTERN_NOTES.length];S.notes++;save();drawMap();modal(`<h2>一盞紙燈</h2><p>黑暗裡亮著一盞小小的紙燈，光很暖。隊伍在燈下坐了一會兒。</p><p class="say">${note}</p><p class="note">活著的隊員回復 40% 生命，重傷治好了，恐懼也散了。</p><div class="row"><button class="btn primary" onclick="closeModal();drawMap()">繼續前進</button></div>`)}else{toast('紙燈的光變暗了，只剩一點點餘溫');drawMap()}return true}
 if(ch==='U'){drawMap();modal(`<h2>往上的石階</h2><p>要回地方站嗎？這次的戰利品會全部帶回去。${RUN.party.some(p=>p.hp<=0)?'<br><b style="color:#ff9b80">還倒在地上的隊員會被送進墓地。</b>':''}</p><div class="row"><button class="btn" onclick="closeModal()">繼續探索</button><button class="btn primary" onclick="closeModal();endRun()">回去</button></div>`);return true}
 if(ch==='D'){drawMap();const nf=RUN.floor+1;modal(`<h2>往下的石階</h2><p>台階往下延伸，越往下越冷。${nf>tierOf(RUN.floor).to?`<br>空氣的味道變了。下面是<b>${tierOf(nf).name}</b>。`:''}</p><p class="note">第 ${nf} 層。火把剩 ${RUN.torch} 支。</p><div class="row"><button class="btn" onclick="closeModal()">再看看</button><button class="btn primary" onclick="closeModal();descend()">往下走</button></div>`);return true}
 return false}
function descend(){sfx('stairs');if(RUN.abyss){RUN.depth++;RUN.floor=((RUN.depth-1)%9)+1;const fr=1+Math.floor(RUN.depth/4)+Math.floor(partyLv()/15);S.frag=(S.frag||0)+fr;S.abyssBest=Math.max(S.abyssBest||0,RUN.depth);setTimeout(()=>toast(`深淵第 ${RUN.depth} 層。得到 ${fr} 個碎片。`),900)}else RUN.floor++;genFloor();save();drawMap();toast(`第 ${RUN.floor} 層`);if(RUN.intr)setTimeout(()=>toast('走廊深處傳來很多人一起念名字的聲音……（這一層有東西亂入了）'),1600)}
const LANTERN_NOTES=['燈下壓著一張便條，字很工整：「這裡可以休息一下。燈不會一直亮，記得往前走。」','便條上只有一行：「我不知道你是誰，可是你走到這裡了。辛苦了。」','「燈照不完這裡的黑暗。可是至少，你不是一個人。」','「我不能替你們打怪，也不能替你們回答問題。我只能點燈。」','「有人問我是誰。我不想說謊，所以我不回答。」','便條的角落畫了一顆小小的星星。上面寫：「慢慢走。」'];

const EVIMG={"多出的一份簽收": "ev_receipt2", "苔光菇": "ev_mushroom", "前人的火把": "ev_torches", "一根黑羽毛": "ev_feather", "無字石碑": "ev_stele", "願意借燈的影子": "ev_shadowlamp", "滴水聲": "ev_drip", "回聲": "ev_echo", "留下的背包": "ev_backpack", "撕掉一半的收據": "ev_receipt", "遺落的夜郵袋": "ev_mailbag", "刻滿名字的牆": "ev_namewall", "字磚陷阱": "ev_trap", "地底的郵筒": "ev_mailbox", "紙偶商人": "n_paper"};
const EVIML={'願意借燈的影子':'ev_c01','多出的一份簽收':'ev_c02','姓氏唱錯了':'ev_c03'};
function evModal(t,d,opts){logEnc('事件・'+t);const steps=Array.isArray(d)?d:[{n:d}];const ik=(Array.isArray(d)&&EVIML[t]&&HAS.has(EVIML[t]))?EVIML[t]:EVIMG[t];
 return vn({title:t,bg:bgK('bg_f'+tierN(RUN.floor),'bg_sort'),...(ik?{imgs:[{k:ik}]}:{}),steps,opts:opts.map(o=>({t:o[0],f:()=>{const r=o[1]();save();return {steps:Array.isArray(r)?r:[{n:r}],opts:[{t:'繼續',p:1}]}}})),done:toMap})}
function evModalOld(t,d,opts){modal(`<h2>${t}</h2><p>${d}</p><div class="row" id="evOpts">${opts.map((o,i)=>`<button class="btn ${i===opts.length-1?'primary':''}" data-i="${i}">${o[0]}</button>`).join('')}</div>`);
 document.querySelectorAll('#evOpts button').forEach(b=>b.onclick=()=>{const r=opts[+b.dataset.i][1]();save();modal(`<h2>${t}</h2><p>${r}</p><div class="row"><button class="btn primary" id="evOk">繼續</button></div>`);$('evOk').onclick=()=>{closeModal();if(RUN){drawMap();showLevelUps()}}})}

const EV3={
 C04:{z:1,t:'根鬚下的舊飯盒',foe:'e_rat',steps:['粗大的古老樹根像血管一樣盤在潮濕的石壁上，根鬚縫隙裡流淌著溫吞的橘色燭淚蠟。空氣裡隱約飄著一股像老陳灶台邊烤麥餅的焦香味。','樹根盤結的死角裡，有一只被燭淚蠟半封住的扁鐵飯盒。幾隻巴掌大的「抱蠟苔鼠」圍著它團團轉，用前爪一下一下拍著盒蓋。飯盒被滾燙的樹脂包著，居然還透出一點溫熱。','盒蓋上用鈍刀刻著一個歪歪扭扭的「山」字。苔鼠不是想吃它，是把它當成暖肚子的火爐。硬拽的話，很可能惹毛這群護窩的苔鼠。'],
  a:{t:'用火把烤軟封蠟，分半塊乾糧換飯盒',txt:'火把的熱油融開了封蠟。領頭的苔鼠聞到麥餅香，猶豫了一下，抱起乾糧塞進嘴裡，大方地讓出位置。飯盒裡裝的不是飯菜，而是兩包用油紙裹好的乾燥火絨與上好燭淚蠟。',f:()=>{RUN.loot.wax+=2;RUN.loot.moss+=1;RUN.loot.pts+=4;RUN.torch+=1;return '燭淚蠟 +2、苔絨 +1、積分 +4、火把 +1。'}},
  b:{t:'直接用武器把飯盒撬出來（戰鬥）',txt:'鐵器硬生生插進古根縫隙，「嘎吱」一聲撬出了飯盒，也把樹根表皮撕開一道口子。溫熱的樹脂灑了一地，苔鼠背上的綠毛炸開，古根底下鑽出了紅著眼睛的「燭苔護根獸」！',win:()=>{RUN.loot.wax+=2;RUN.loot.bone+=2;return '燭淚蠟 +2、骨片 +2。'}},
  end:'古根上的橘光緩緩平復，你們收好東西，繼續往燭苔區深處走。'},
 C05:{z:1,t:'退潮的石骨階梯',foe:'e_crab',steps:['甬道向下傾斜，通往一段長年泡在地下暗渠裡的「石骨階梯」。灰白的石階像巨獸整齊排列的肋骨，水面漂著一層亮晶晶的蠟膜。','水位正巧退了一截，露出卡在骨縫裡的舊帆布郵差包。肩帶爛斷了，銅扣還牢牢鎖著。旁邊兩隻碩大的「盲眼啃骨蟹」舉著泛白的大螯，一下一下刮著石階上的苔絨。','水每隔一刻鐘就會漲回來。啃骨蟹沒有眼睛，全靠石階傳過去的腳步震動找獵物。郵差包鼓鼓的，裡頭似乎塞著油紙包。'],
  a:{t:'用繩索纏住武器柄，在岸邊遠遠勾上來',txt:'你們看準螃蟹轉身刮苔的空檔，手腕一抖甩出鐵鉤。鉤尖掛住了銅環，沒發出半點敲擊石骨的聲音。郵包順利滑到岸邊，裡頭有幾塊上好的骨片和密封的藥膏。',f:()=>{RUN.loot.bone+=3;S.potion++;return '骨片 +3、藥水 +1。'}},
  b:{t:'趁水還沒漲，踩著階梯衝下去搶（有風險）',chk:.5,ok:'你腳底抹油似地滑下三級石階，在螃蟹反應過來之前一把抄起郵差包，踏壁翻回岸上，連鞋底都沒濕透。',okf:()=>{RUN.loot.bone+=3;RUN.loot.moss+=2;S.potion++;return '骨片 +3、苔絨 +2、藥水 +1。'},txt:'石階上的蠟膜太滑，你一腳踩空，砸起一大片水花！兩隻盲眼啃骨蟹瞬間轉身，大螯敲得石骨「咔咔」作響，橫衝直撞地夾了過來！',win:()=>{RUN.loot.bone+=5;RUN.loot.pts+=6;return '骨片 +5、積分 +6。'}},
  end:'渾濁的暗渠水重新淹沒了石骨階梯，水面恢復了平靜。'},
 C06:{z:2,t:'自動排字的抄寫台',foe:'e_worm',steps:['迴廊兩側立著早已朽壞的木書架，白茫茫的書霧在架子間打著旋。地上積著厚厚一層廢紙，空氣乾得讓人嘴唇發裂。','轉角處有一張石製抄寫台。桌前沒有人，一支禿了毛的灰羽筆卻自己立在空中，「沙沙」地飛快抄寫。每寫完一行，旁邊的石硯台就冒出一個墨泡，散發濃郁的書霧墨香氣。','羽毛筆反覆抄的是同一句話：「今日無事，退件三封，收件人待補。」硯台裡是極純的書霧墨。抄寫台底下，一團廢紙條纏成的「護墨書蠹」正跟著筆的節奏一呼一吸地打瞌睡。'],
  a:{t:'不打斷它，悄悄從硯台邊舀走一半墨',txt:'你順著羽毛筆換行的節拍，用小木杓舀起半瓶烏黑發亮的書霧墨。禿毛筆在半空中頓了一秒，但行距沒亂，它只是往硯台裡重重沾了一下，繼續抄寫。',f:()=>{RUN.loot.ink+=2;RUN.loot.pts+=5;return '書霧墨 +2、積分 +5。'}},
  b:{t:'抓住羽毛筆，連硯台一起端走（戰鬥）',txt:'你一握住筆桿，羽毛筆就像被踩了尾巴的貓一樣猛甩，在長卷上劃出一道大黑槓！抄寫台劇烈震動，桌底那團廢紙條轟然炸開，化作三條水桶粗的「護墨書蠹」！',win:()=>{RUN.loot.ink+=4;RUN.party.forEach(p=>{if(p.hp>0)p.hp=Math.max(1,Math.round(p.hp*.92))});return '書霧墨 +4。濺了一身老墨，全隊失去少許生命。'}},
  end:'書霧重新漫過轉角，把那一桌沒抄完的廢話蓋在了霧底。'},
 C07:{z:2,t:'夾在門縫裡的催租單',foe:'e_dog',steps:['迴廊兩側開始出現嵌在石壁裡的假木門。門後其實是實心岩壁，門板上卻掛著磨平的舊門牌框，像是把地面上某條消失的老街拓印到了地底下。','其中一扇門縫裡，夾著半截還在微微抖動的牛皮信封。旁邊蹲著一隻半人高、渾身貼滿紅白封條的「巡廊退件犬」，正用沒有眼珠的紙糊腦袋撞門，喉嚨裡發出算盤珠子亂撥一樣的「噼啪」聲。','信封一角寫著：「西風巷舊戶・逾期三年房租催繳」。退件犬是因為找不到門後的住戶、沒辦法完成投遞，才卡在這裡發狂。'],
  a:{t:'把門縫撬寬，幫牠把信塞進去',txt:'你拿刀尖把腐朽的門框撬開半寸，把信封推了進去。聽見「啪嗒」一聲，退件犬安靜下來，歪著腦袋聞了聞門縫，確認投遞完成。牠抖落兩張封條和一塊封蠟，轉身跑進濃霧裡下班去了。',f:()=>{RUN.loot.wax+=1;RUN.loot.ink+=1;RUN.loot.pts+=5;return '燭淚蠟 +1、書霧墨 +1、積分 +5。'}},
  b:{t:'把催租單從門縫裡抽出來看（戰鬥）',txt:'你一把扯出信封。退件犬的動作猛地停住，腦袋一百八十度轉過來對準你的手。在牠的規矩裡，搶奪投遞中的信件等同劫道！算盤聲變成刺耳的警哨，牠張開釘滿鐵釘的嘴撲了上來！',win:()=>{RUN.loot.bone+=3;RUN.loot.ink+=1;S.clues++;return '骨片 +3、書霧墨 +1、線索 +1（半截舊鑰匙坯）。'}},
  end:'假木門依舊死氣沉沉地嵌在岩壁上。你們整頓好裝備，往鐘聲的方向走去。'},
 C08:{z:3,t:'向活人借偏旁的石碑',foe:'e_shade',steps:['地板已經分不清是石頭還是壓實的紙灰，踩上去沒有半點聲音。四周岩壁上全是用指甲摳出來的淺坑，像很多人試著在牆上刻下名字，最後只留下沒有筆畫的凹槽。','路中央立著半截灰白矮碑，碑面只剩一個「木」字偏旁，右半邊被磨平了。碑前蹲著一個紙灰凝成的半透明人形，拿尖石頭在自己臉上比劃，小聲唸著：「少了一半……沒有右邊那一半，我回不去村子了……借我半個字好不好？」','它還沒有變成見人就咬的東西。絕對不能把隊友真名裡的字借給它。背包裡剛好有些從上層撿來的廢公文。'],
  a:{t:'把廢公文上的「村」字貼在缺掉的右半邊',txt:'你沒敢用活人的名字，用燭淚蠟把廢公文上的「村」字貼在偏旁旁邊。人形愣了一下，摸了摸拼起來的字，臉上緊繃的紙灰慢慢舒展開來：「對……我是村裡的人……我想起來了。」它深深鞠了一躬，化作一縷輕煙，碑座下留著一塊溫潤的骨片。',f:()=>{RUN.loot.bone+=3;RUN.loot.pts+=8;RUN.fear=Math.max(0,(RUN.fear||0)-2);return '骨片 +3、積分 +8、恐懼 -2。'}},
  b:{t:'不理它，一腳踹倒擋路的矮碑（戰鬥）',txt:'矮碑砸在紙灰地上，「木」字偏旁也摔成兩半。人形抬起沒有五官的臉，發出淒厲的尖叫：「你弄碎了我的姓！拿你的名字來賠！」周圍地縫裡的紙灰同時暴起！',win:()=>{RUN.loot.bone+=2;RUN.loot.ink+=2;RUN.fear=Math.min(10,(RUN.fear||0)+1);return '骨片 +2、書霧墨 +2、恐懼 +1。'}},
  end:'冷風吹過斷碑。你們按了按胸口完好的徽章，繼續往前。'},
 C09:{z:3,t:'裝滿空信封的舊郵袋',foe:'e_crow',steps:['已經接近第九層的邊緣。頭頂偶爾飄落像黑色鴉羽一樣的硬紙片，地上散著鏽穿了底的鐵皮信箱，裡頭塞滿白花花的無字信封。','斷裂的石柱上，端端正正掛著一只帆布郵差袋，樣式跟暮簡村地方站配發的一模一樣。三四隻「缺字紙鴉」安安靜靜地蹲在石柱頂上，不啄郵袋也不飛走，像在守著誘餌。','郵袋外頭沒有繡名字。最上面那封信的封口用一團暗紅的書霧墨凍住，裡頭夾著硬硬的東西。只要有人伸手翻郵袋，紙鴉就會撲下來，把翻袋子的人當成新的「送信替死鬼」。'],
  a:{t:'先用火絨石塊驚走紙鴉，只挑走最上面那封',txt:'你把碎石裹上火絨，猛地砸向石柱頂端！火光一炸，紙鴉嘎嘎亂叫著飛散。你趁機用刀尖挑開那封油紙包，取出封存的骨片與濃墨，趕在鴉群聚攏前撤離了石柱。',f:()=>{RUN.torch=Math.max(0,RUN.torch-1);RUN.loot.ink+=2;RUN.loot.bone+=2;RUN.loot.pts+=8;return '火把 -1、書霧墨 +2、骨片 +2、積分 +8。'}},
  b:{t:'整只郵袋扯下來背走（戰鬥）',txt:'你一拎起肩帶，袋裡幾十封空白信封同時「嘩啦啦」翻響，死死纏住你的手腕！石柱頂上的紙鴉亮起血紅的眼睛，尖嘯著俯衝而下。在深處的規矩裡，背起郵袋的人，就得留下來替牠們送信！',win:()=>{RUN.loot.ink+=4;RUN.loot.bone+=3;RUN.loot.pts+=10;return '書霧墨 +4、骨片 +3、積分 +10。'}},
  end:'第九層的冷風吹散了地上的紙屑。遠處那扇與地址有關的門，已經隱約可見。'}};
function ev3(id){const E=EV3[id];logEnc('事件・'+E.t);const bg=bgK('bg_f'+tierN(RUN.floor),'bg_sort');const F=FOES[E.foe];
 const fight=()=>{battle(E.foe,()=>{const r=E.b.win()+curioGet(id);save();vn({title:E.t,bg,steps:[{n:F.ev.down},{n:F.ev.end,r},{n:E.end}],opts:[{t:'繼續',p:1}],done:toMap})},false)};
 const ik='ev_'+id.toLowerCase();vn({title:E.t,bg,...(HAS.has(ik)?{imgs:[{k:ik}]}:{}),steps:E.steps.map(n=>({n})),opts:[
  {t:E.a.t,f:()=>{const r=E.a.f()+curioGet(id);save();return {steps:[{n:E.a.txt,r},{n:E.end}],opts:[{t:'繼續',p:1}]}}},
  {t:E.b.t,f:()=>{if(E.b.chk&&Math.random()<E.b.chk){const r=E.b.okf()+curioGet(id);save();return {steps:[{n:E.b.ok,r},{n:E.end}],opts:[{t:'繼續',p:1}]}}return {steps:[{n:E.b.txt}],opts:[{t:'迎戰',p:1,f:fight}]}}}],done:toMap})}
function runEvent(){const f=RUN.floor,T=tierN(f);const evs=[
 ()=>evModal('無字石碑','一塊沒有字的石碑。手放上去的瞬間，碑面浮出一行很快就消失的字。',[['離開',()=>'你沒有碰它。'],['把手放上去',()=>{gainXP(10+f*3);return '隊伍若有所悟。全隊經驗 +'+(10+f*3)}]]),

 ()=>evModal('一根黑羽毛','走廊正中央，安安靜靜地躺著一根黑色的羽毛，乾淨得像剛剛才落下。四周的黑暗好像退開了一點。',[['撿起來',()=>{healAll(.25);return '活著的隊員回復 25% 生命。'}]]),

 ()=>evModal('紙偶商人','一個紙做的小人坐在路邊，面前擺著幾瓶藥水。它沒有臉，可是在笑。',[['走開',()=>'紙偶揮了揮手。'],['用 12 分戰利品買藥水',()=>{if(RUN.loot.pts<12)return '你身上的戰利品不夠。紙偶好像有點失望。';RUN.loot.pts-=12;S.potion++;return '藥水 +1。'}]]),

 evs.push(()=>evModal('背後的呼喚','走廊起霧了。霧裡，有人用你很熟悉的聲音，叫了你的名字。是一個已經不在的人的聲音。',[['回頭答應',()=>{hurtAll(.18);taintAdd(10);return '你回頭了。霧裡什麼都沒有，可是有一部分的你，好像留在那裡了。全隊受傷，濁度 +10。'}],['不回頭，繼續走',()=>{gainXP(10+f*2);taintAdd(2);return '聲音叫了三次，就不叫了。你們誰都沒有說話。全隊經驗 +'+(10+f*2)+'。'}]]));

 if(T===1)evs.push(()=>evModal('願意借燈的影子',[{n:'潮濕的岩壁上爬滿了肥厚的深綠燭苔，微弱的磷光順著古老樹根的脈絡緩緩呼吸。遠處偶爾傳來水滴落入暗渠的清脆回音。'},{n:'前方的岔路被一團濃重的暗影籠罩，火把被地底穿堂風吹得忽明忽暗。就在火苗即將熄滅的瞬間，石壁上一道不屬於你們任何人的修長影子，自己動了起來。'},{n:'那道沒有實體的影子雙手捧著一盞散發溫潤橘光的燭苔小燈，安靜地彎下腰，把燈火往你們的火把旁遞了過來。'},{n:'地面石縫間，散落著幾粒乾涸的蜂蠟與半截未燒完的燈芯。'}],

 if(T===3)evs.push(()=>evModal('姓氏唱錯了',[{n:'越往深處走，石壁上的字跡就越淡。空氣冷得像結了冰的墨汁，四周沒有風，卻不斷傳來無數張嘴同時翻動書頁、低聲呢喃的回音。'},{n:'黑暗的穹頂上方突然傳來層層疊疊的合唱聲。幾十道男女老少交疊的嗓音，用一種莊嚴卻走調的曲調唱著：「張家的長子住在李家的屋簷下，王家的姓氏縫在趙家的衣領上……」'},{n:'你們腰間的名牌與徽章開始微微發燙，上面的刻字像是要順著歌聲飄出去一樣。'},{n:'合唱聲中夾雜著一個孤單的童音，反覆唱著一句：「借我一個偏旁，還你半頁家鄉……」'}],

const ANN=[['v1.5.2',['給每一位走進公會的寶貝：歡迎回到我們一起創造的世界。你們的選擇、冒險與故事，都會讓這裡繼續長大。','新增色慾、傲慢、混沌三種心情；混沌每場隨機套用一至兩種其他心情效果。','亂入怪至少精英級，有機率晉升首領。提高怪物生命、攻擊與高層防禦。','雨天火焰傷害降低；霧天雙方命中率降低；夜晚依舊讓怪物更強。','怪物圖鑑新增招式效果與對抗建議；覺醒技改成角色發光與文字特效。','修正階段轉換時特效定位；難度保留舊存檔索引。']],['v1.5.1',['戰鬥特效換上新的手繪光效：斬擊、火焰、冰霜、毒霧、護盾、延爆、狐火、龍息、鴉羽……三十六種。','狀態小方塊換成圖示（還沒畫到的狀態先用文字）。','技能清單和出招時的技能名旁邊多了技能圖示。','三轉覺醒技發動時，會有一張職業專屬的大圖閃過。','戰鬥特效改成真正去背的圖，不會再有黑框。','戰鬥中角色名字上方會標出職業。','她的心情（難度）改到混亂遊樂坊裡，用選項跟她說。照她的慾望分成六段：陪我玩嘛、我想看你努力、執念、貪慾、惡慾、食慾，每段有自己的效果（不准撤退、體質加強、技能變多、飢餓……）。']],['v1.5.0',['混亂遊樂坊開放「混沌」房間：她有十二種新的樣子（繭母、鳳冠、假面、紅衣、鴉后、長髮、藥師、倒懸、蠍尾、鏡中九尾、紅翼、蛛女），每次隨機出五個。贏了有機會拿到她身上的東西（六件新的特色裝備）。','新增難度：首頁最下面點「難度」，照她今天的心情選——陪我玩嘛、我想看你努力、認真一點喔、我想吃掉你。','新的亂入怪物：狐面提燈者、根骨花祭，所有地圖都可能遇到（舊戶籍合唱體還是只在地窖）。','她有時候會失控亂入：燈全熄了，她不笑，這次不是陪你玩——會真的受傷，打贏了有混亂券、她身上的東西，偶爾還有舊物。','特色裝備的位階調到跟傳說一樣：新拿到的會跟著你的進度變強，固定三條詞條。','戰鬥畫面：戰士有怒氣條；變形師變成巨蟒時有綠光和 🐍；蟄蟄伏時變暗並標 💤；燈守旁邊會顯示狐火分身的數量。','英雄頁的裝備欄有了部位圖示。']],['v1.4.5',['守時者和空郵差制服的人換上新版立繪：普通、受傷、倒下，以及主宰版和主宰裂開後的樣子。','回憶房的主宰半血裂開時，有圖的會換成裂開後的樣子。','背景圖恢復原本的畫質。']],['v1.4.4',['換上爸爸畫的新圖：第二章、第三章、白鐵礦城的怪物和領主，守時者、空郵差制服的人、守門王，紙紮人、符屍、游神、無目天官，以及地窖的事件怪。','新背景：分站大廳、名字櫃、總分揀室、白鐵礦城，還有公會塔的大廳、圖書館、圖鑑館、鑑定館。','鐵扣有了自己的立繪；瞿山、伊恪、鐵扣的三轉立繪也換上了。','千號、守時者、空郵差制服的人會隨著受傷改變樣子。劇情物品和退件印泥有了自己的圖示。']],['v1.4.3',['每個人的技能、天賦和二轉，都照背景故事重新對過一次：每個人多一招專屬技能（換掉一招職業共用技能），二轉四個選項全部變成個人專屬。','夜漣改回背景裡的樣子：先用風燈照亮怪物的臉，再把火砸進眼窩。','葛隆、織燭、蕁、芸等人補上了符合背景的技能和天賦。','補上黑鱗龍裔・蟄和白鐵盾衛・鐵扣的背景故事。','招募板的總人數不再算進外傳英雄。']],['v1.4.2',['公會塔三樓開放「傳送門大廳」。第三章結束後，可以進入外傳〈白鐵門〉：白鐵礦城北境分站，共 5 層。打通後，白鐵盾衛・鐵扣會加入。','外傳碎片：在門後打倒精英和領主取得，可以召喚英雄。召喚到已經有的人會變成命星（每顆星生命、攻擊、防禦 +4%，最多 5 顆）。六芒門、香火門和神話召喚之後開放。','鑑定館新增「洗練」：所有詞條一起重洗，可以花渡鴉幣鎖住想留的詞條。','舊郵筒新增「投遞」：照隊伍等級挑一層，送到再回來投回執就有獎勵。異世界的深淵也會跟著隊伍等級變強，碎片和裝備也跟著變好。','混亂遊樂坊新增「認真模式」：她會認真起來，贏了混亂券加倍，還有機會拿到傳說圖紙和舊物。']],['v1.4.1',['三轉開放：45 級的英雄，用 1 個「舊物」就能三轉。每個人一個固定方向，會得到新稱號、專屬被動和每場一次的覺醒技，技能欄多一格。','舊物的來源：打贏回憶房的主宰（必定）、打倒首領（偶爾），第一次打倒千號給 2 個。','二轉重做：五個盾衛的四條二轉全部換成各自的路線；其他人的每條路線也都多了一個只屬於自己的選擇。','三轉立繪還沒畫的人，先用光暈暫代。']],['v1.4.0',['技能大洗牌：每個人都照自己的慾望重新設計，同職業之間不再重複。','新增四個職業：戰士（怒氣）、刺客（隱身處決）、詛咒師（延爆詛咒、褪名）、變形師（細蛇和巨蟒兩種形態）。瞿山轉為戰士、鳶轉為刺客、無名轉為詛咒師、藥鱗轉為變形師。','新英雄：黑鱗龍裔・蟄。龍族一睡就是一百年，他最怕睡著。','新增狀態：易傷、侵蝕、褪名、延爆詛咒、封印、魅惑、迴響、屏息、縮殼、誓約。','敵人被沉默時，也放不出技能了。','技能有變動的英雄，技能欄會自動重新配置；可以到英雄頁重新挑選。']],['v1.3.2',['套裝大幅加強：首領套裝的單件現在會跟著你的進度變強，固定有三條詞條；所有套裝的 2 件、4 件效果都提高了（已經穿在身上的套裝效果也會一起變強）。','回憶房的主宰更強了：生命和攻擊提高，拖過 24 回合就會每回合狂怒；裂開異變時回復得更多。','第三章的蒸氣信差和倒轉鐘塔加強了。']],['v1.3.1',['守門王「舊戶籍合唱體・全員到齊」、守時者、空郵差制服的人有了完整的戰鬥文字；守時者和空郵差制服的人第一次見面時會先開口。','回憶房的六個主宰都有了自己的登場、異變和倒下描寫。','第二章三個場景重新潤色。','九位村民的羈絆故事加上了動作和神態描寫。','打倒首領後，戰鬥結算會顯示牠倒下的樣子。']],['v1.3.0',['第三章〈二十年前的分揀機〉開放：打通第二章後，從第 15 層進入二十年前的地底分站。四種新怪物、兩個小首領，還有總分揀機・千號。','等級上限提高到 55。','三個新的地窖事件：傳送帶上的玉片、站長室、播音室。','人物和怪物的圖放大了：英雄詳細頁會顯示轉職後的立繪，點圖片可以看大圖；劇情和戰鬥裡的圖也變大了。','退件執事・無簽有了專屬的戰鬥音樂〈未開封の終焉〉。','修正：重新整理頁面後，渡鴉幣、被封起來的東西、特色素材、圖紙、濁度和挑戰紀錄不會再不見；+8 以上的強化也會正確保存。']],['v1.2.5',['新的特色素材：各區的精英和首領會掉落自己的素材，合唱體會掉「合唱的喉音」。','傳說圖紙：打倒領主、首領、主宰或完成每日委託偶爾會拿到。拿去岩蘢的工坊，就能照圖紙打造那件傳說裝備。','五件故事裝備：引路白幡、鬼梳頭、哭喪銅鈴、百家衣、怨念紅線。都有強大的效果，也都有代價。拿到時會照隊伍等級適配；羈絆信物和狐尾墨戒也一樣。','濁度：在地窖待越久、走越深就越高。濁度越高，攻擊和掉寶越好，但會出現異變，滿了還會失控。可以找蘇眠砂點「淨香」洗掉。','遊樂坊的萬相套裝（6 件）：每間房第一次贏會給一件，也能用混亂券換。','守時者、空郵差制服的人現在也會掉領主素材，可以指定打造「守時」「空制服」套裝。','地窖裡出現新的東西：紙紮人、符屍、游神、無目天官。','三個新的禁忌事件：背後的呼喚、子時的鏡子、天上的輪廓。']],['v1.2.0',['新的稀有度「史詩」，比傳說更高。每件史詩都寫著一段這裡的歷史；傳說則是一段碎片。','倉庫和鑑定館可以「檢閱」裝備：看完整數值、穿在誰身上、套裝效果和裝備故事。','圖鑑館的怪物可以點「資訊」：出沒樓層、等級、招式、掉落。','回憶房：打贏過的領主可以挑戰「主宰」型態，招式異變、多一個階段，第一次打贏必定掉史詩。','鍛鍊房：打贏過的怪物可以挑戰「♛ 首領」版。遊樂坊：所有房間和混亂都贏過之後，開放她的「主宰」。','新狀態「減療」「禁療」；中毒的敵人也會被減療。','打通第二章後，強化可以到 +10：+8 和 +10 會多長出詞條，+10 的名字前面會多「不褪的」。','交易層新增高價區：升階材料包、必成符、指定傳說、史詩裝備。','第二章：30 級以後升級變慢。一般怪更兇，會穿透一部分防禦、更快打破護盾，也不太理會嘲諷；單獨出現的怪一回合動兩次。精英和首領更常出現。','遊樂坊的衣櫃改名；混亂房把蛇之新娘加回來，變成 14 個階段。']],['v1.1.0',['村子裡多了「公會塔」：一樓有圖書館和圖鑑館，二樓是徽章每日委託，三樓是鑑定館和渡鴉幣交易層。三樓以上，是一片打不開的黑色玻璃。','圖書館可以重讀劇情、村民的往事和地窖事件紀錄；圖鑑館多了怪物圖鑑。','鑑定館：打開「被封起來的東西」、把特色和傳說裝備升階、洗附加詞條。','新的錢幣「渡鴉幣」：完成每日委託、打倒首領可以拿到。交易層的價錢每次都不一樣。','小怪新增「首領」位階（地圖上的 ♛）：比精英更大更兇，有專屬招式，掉落更好。','世界正式定為天闕大陸的北境邊緣。']],['v1.0.2',['首頁新增「公告」，每次更新的內容都會寫在這裡。','🔊 設定裡新增「回到首頁」。','天賦改成照等級排列；技能欄說明更正為最多 7 格。','首領進入下一階段以後，就算回血也不會變回原本的樣子。','守門王變強了：等級 32，生命和攻擊大幅提高，而且不太理會嘲諷。','合唱體亂入的機率提高，等級會跟著隊伍變強，會無視嘲諷亂點名。']],
 ['v1.0.1',['九個地窖事件有了自己的插圖。','逆址郵廊換上新的背景。','退件執事・無簽有了二階段和重傷的樣子。']],
 ['v1.0.0',['第二章《回不到地址的信》：第 10～14 層、兩個小首領、領主無簽。','打通守門王後，等級上限開到 45，新增天賦、覺醒和第 5 階裝備，強化可到 +7。','村民關係新增「羈絆」，完成羈絆故事得到專屬信物。','收集冊新增怪物、怪東西、小穗的寶貝、領主分頁；領主會掉特殊素材。','地窖裡的提燈人有了七種樣子；遊樂坊新增血脈房和衣櫃。']]];
function annSeen(){try{return localStorage.getItem('rg_ann')===VER}catch(e){return true}}
function annMark(){try{localStorage.setItem('rg_ann',VER)}catch(e){}}
function annShow(){annMark();modal(`<h2>公告</h2>${ANN.map((a,i)=>i===0?`<p><b>${a[0]}</b></p><ul style="margin:4px 0 10px 18px;padding:0">${a[1].map(x=>`<li style="margin:3px 0">${x}</li>`).join('')}</ul>`:`<details class="q"><summary style="cursor:pointer;color:var(--gold)">${a[0]}</summary><ul style="margin:6px 0 4px 18px;padding:0">${a[1].map(x=>`<li style="margin:3px 0">${x}</li>`).join('')}</ul></details>`).join('')}<div class="row"><button class="btn primary" onclick="closeModal()">好</button></div>`)}
function backTitle(){if(BAT)return modal(`<h2>回到首頁</h2><p>戰鬥中不能離開。打完這場再說吧。</p><div class="row"><button class="btn primary" onclick="closeModal()">好</button></div>`);
 if(RUN)return modal(`<h2>要放棄這次下潛嗎？</h2><p>回到首頁會直接回到地面，<b>這次帶著的戰利品會全部留在地窖裡</b>。</p><div class="row"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="backTitleGo(1)">放棄並回首頁</button></div>`);
 backTitleGo(0)}
function backTitleGo(ab){if(ab&&RUN){const L=RUN.loot;L.pts=0;for(const m in MAT)L[m]=0;L.gear=[];endRun()}save();closeModal();hadSave=true;title()}
function zoomImg(src,flt){const d=document.createElement('div');d.className='zoomv';d.innerHTML=`<img src="${src}" alt="" style="filter:${flt||'none'}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
document.addEventListener('click',e=>{const el=e.target;if(el&&el.classList&&el.classList.contains('zoomable')){e.stopPropagation();zoomImg(el.src,el.style.filter)}},true);
function title(){$('stage').innerHTML=`<div class="bg" style="background-image:url('${A('bg_village')}')"></div><div class="dock" style="top:auto">
 <div class="chip" style="align-self:stretch;text-align:center"><b style="font-size:20px;letter-spacing:.2em">渡鴉公會</b><br>天闕大陸・北境邊緣・暮簡村<br><span class="note">湖邊紙田的盡頭，有一座點著燭火的地方站。<br>村外的無字石碑群底下，有一座沒有人走完的地窖。<br>地面是活的，地底是死的。</span></div>
 <div class="bar4" style="grid-template-columns:${hadSave?'1fr 2fr':'1fr'}">${hadSave?'<button class="btn" id="bNew">重新開始</button>':''}<button class="btn primary" id="bStart">${hadSave?'繼續':'推開地方站的門'}</button></div>
 <div class="row" style="justify-content:center;margin:0"><button class="btn small" id="bAnn">公告${annSeen()?'':' ●'}</button></div>
 <p class="note" style="text-align:center;margin:0;text-shadow:0 1px 3px #000">${VER}・右上角 ♫ 可以打開音樂，🔊 是音量、遊玩報告、搬存檔和回到首頁<br>遊玩紀錄只存在這台裝置${hadSave&&localStorage.getItem(KEY)===null?'<br>v0.4 改了屬性和裝備系統：舊裝備換成了新的隨機裝備，積分上限調整為 400。':''}</p></div>`;
 $('bAnn').onclick=annShow;if(!annSeen())setTimeout(()=>{if(!modalOpen())annShow()},400);$('bStart').onclick=()=>{save();town('hall')};if(hadSave)$('bNew').onclick=()=>modal(`<h2>重新開始？</h2><p>會清除這台裝置上的進度。</p><div class="row"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="S=fresh();save();closeModal();town('hall')">確定</button></div>`)}
window.addEventListener('resize',()=>{if(RUN&&!BAT&&!modalOpen())drawMap()});
res();title();
</script></body></html>
