name: Repair Raven Guild startup media loading
on:
  push:
    paths:
      - '.github/workflows/repair-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  externalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact game source
        uses: actions/checkout@v4
      - name: Extract unchanged image and audio bytes
        run: python3 scripts/externalize_game.py index.html .
      - name: Publish smaller HTML and independent media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html art/game-assets audio .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Fix online startup: externalize 575 images and 8 music files"
          git push origin HEAD:main
